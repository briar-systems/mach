# refuse: manifest.removed_key
# mach 6's filter written as one string is refused as that, carrying its rewrite to an array
[project]
id      = "filter"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out"

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[link.m]
source = "system"
name   = "m"
sys    = ["linux"]
arch   = ["*"]
abi    = "*"
