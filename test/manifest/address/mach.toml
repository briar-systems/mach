# an address past an integer's range, a target's base and a region's origin, written as a string
[project]
id      = "address"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.bmos]
arch     = "x86_64"
isa      = "x86-64"
sys      = "freestanding"
abi      = "sysv64"
of       = "flat"
base     = "0xFFFF800000000000"
platform = "bmos"

[artifact.address]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/address{artifact.suffix}"
targets = ["*"]

[artifact.address.region.high]
origin = "0xFFFF800000000000"
length = 0x100000
access = "rwx"
run    = [".text"]

[profile.debug]
optimize = false
debug = true
simd  = "scalarize"
