# vector rows: the declared outcome of every retained (operation, lane kind, lane
# width) cell on every target this suite serves, with the external witness for it.
#
# this file restates the compiler's catalog (isa.MachineModel.packed_forms and
# scalar_forms, one table per ISA) so that the two can disagree: a row here is judged
# against the disassembly an external decoder produces and against execution, never
# against the catalog. the driver refuses a target that does not name exactly the
# retained domain (46 cells), so a cell added to the vocabulary is a missing row here
# as well as a registration refusal in the compiler.
#
# columns (whitespace-separated, pattern runs to end of line):
#   target   the engines.conf row the probe program builds for
#   op       add sub mul div and or xor not cmp
#   kind     int | float
#   bits     lane width
#   form     packed   the probe's decoded body must contain an instruction matching
#                     the pattern
#            scalar   the probe's decoded body must contain no instruction matching
#                     the pattern, which names the packed family the ISA would use
#   pattern  a regular expression over one decoded instruction (mnemonic and
#            operands, whitespace collapsed to single spaces)
#
# a row is witnessed by one probe function per signedness (int rows) and, for a
# compare row, by an ordering and an equality predicate each. EXCEPTIONS lists the
# probes a reviewed statement declares away, with the issue they die with.
#
# a scalar row whose family the ISA lacks entirely (a packed integer divide on
# x86_64 or NEON) makes the absence check vacuous; the execution check still holds.
#
# target          op   kind   bits form    pattern
