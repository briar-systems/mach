[project]
id = "mach"
version = "4.26.4"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.windows-x86_64]
isa  = "x86_64"
os   = "windows"
abi  = "win64"
# the sweep cases in stack_probe_runtime recurse past the 1 MiB PE default,
# and the compiler itself recurses on real inputs; reserve is address space,
# not memory, so match the 8 MiB linux main-thread default (#3091).
stack_reserve = 0x800000

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.mach]
kind = "bin"
entry = "bin/main.mach"
out = "bin/mach"
targets = ["linux-x86_64", "linux-arm64", "linux-riscv64", "darwin-x86_64", "darwin-aarch64"]
link = []
need = []

[artifact.mach-windows]
kind = "bin"
entry = "bin/main.mach"
out = "bin/mach.exe"
targets = ["windows-x86_64"]
link = []
