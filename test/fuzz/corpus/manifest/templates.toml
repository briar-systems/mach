[project]
id = "a"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}/{target.isa}/{target.os}/{target.abi}"

[target.t]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"

[artifact.a]
kind = "bin"
entry = "main.mach"
out = "{target.name}{profile.name}" 
targets = ["t"]
link = []
need = []

[artifact.b]
kind = "bin"
entry = "main.mach"
out = "{target.name}{profile.name}"
targets = ["t"]
link = []
need = []
