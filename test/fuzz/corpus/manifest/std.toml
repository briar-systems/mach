[project]
id = "std"
version = "0.35.1"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# darwin's platform library, and the only supported way to reach the kernel:
# apple does not promise syscall numbers. `name` is spelled as the full install
# path on purpose. a dyld-loaded image implicitly links libSystem under exactly
# that path, and a requirement that does not match it string-for-string is a
# SECOND dependency rather than the same one - the image then carries two
# LC_LOAD_DYLIB commands, one of them a bare leaf name dyld would have to
# search for. `library` is the logical name `#[library("libSystem")]` pins to.
[link.libsystem]
source  = "system"
name    = "/usr/lib/libSystem.B.dylib"
library = "libSystem"
os      = ["darwin"]
isa     = ["*"]
abi     = ["*"]
export  = true

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.ws2_32]
source = "system"
name = "ws2_32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.bcrypt]
source = "system"
name = "bcrypt.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.synch]
source = "system"
name = "api-ms-win-core-synch-l1-2-0.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[artifact.std]
kind = "static"
entry = "lib/libstd.mach"
out = "lib/std"
targets = ["*"]
link = ["kernel32", "ws2_32", "bcrypt", "synch", "libsystem"]
need = []
