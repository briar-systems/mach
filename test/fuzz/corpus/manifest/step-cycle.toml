[project]
id = "a"
version = "0.0.0"
src = "src"
out = "out"

[target.t]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"

[artifact.a]
kind = "bin"
entry = "main.mach"
out = "a"
targets = ["t"]
link = []
need = ["s1"]

[[step]]
name = "s1"
argv = ["sh"]
need = ["s2"]

[[step]]
name = "s2"
argv = ["sh"]
need = ["s1"]
