# a project with no target table, so every unit builds for the host's target, named native
[project]
id      = "records"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.records]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/records{artifact.suffix}"
targets = ["*"]

[artifact.archive]
kind    = "static"
entry   = "lib/calc.mach"
out     = "{project.work}/lib/calc{artifact.suffix}"
targets = ["*"]

[artifact.shared]
kind    = "shared"
entry   = "lib/calc.mach"
out     = "{project.work}/lib/calc{artifact.suffix}"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
