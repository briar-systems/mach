[project]
id      = "app"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.app]
kind    = "static"
entry   = "lib/app.mach"
out     = "{project.work}/lib/libapp{artifact.suffix}"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.vlib]
git = "../vlib.bundle"
ref = "tag/v0.1.0"
