[project]
id      = "app3"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.app3]
kind    = "static"
entry   = "lib/app3.mach"
out     = "{project.work}/lib/libapp3{artifact.suffix}"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"
