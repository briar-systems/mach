[project]
id      = "app2"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.app2]
kind    = "static"
entry   = "lib/app2.mach"
out     = "{project.work}/lib/libapp2{artifact.suffix}"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.liba]
path = "../liba"
