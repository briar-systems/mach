# a project whose build writes the views --emit names beside its objects, its helper inlined
# under the optimised profile
[project]
id      = "emit_views"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.emit_views]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/emit_views{artifact.suffix}"
targets = ["*"]

[profile.debug]
default  = true
optimize = false
debug    = true
simd     = "scalarize"

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
