# an object built under a windows convention for a system whose object format is not windows':
# a freestanding elf image under win64 and under aapcs64win, each frame of which goes to call
# frame information and not to windows' unwind codes
[project]
id      = "listing_windows_elf"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.x86_64]
arch = "x86_64"
sys  = "freestanding"
abi  = "win64"
isa  = "x86-64"

[target.aarch64]
arch = "aarch64"
sys  = "freestanding"
abi  = "aapcs64win"
isa  = "armv8-a+fp+simd"

[artifact.framed]
kind    = "object"
entry   = "framed.mach"
targets = ["*"]

[profile.debug]
default  = true
optimize = false
debug    = true
simd     = "scalarize"

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"
