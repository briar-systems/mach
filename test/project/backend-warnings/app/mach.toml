# a library for wasm32, whose instruction set guarantees no instruction's timing, calling a
# constant-time function of the path dependency ctlib, and stating two of its own, one
# acknowledging its warning, under a profile with debug locations and one without
[project]
id      = "app"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.wasi]
arch = "wasm32"
sys  = "wasi"
abi  = "basic"
env  = "preview1"

[artifact.app]
kind    = "static"
entry   = "lib/app.mach"
out     = "{project.work}/lib/libapp{artifact.suffix}"
targets = ["*"]

[profile.release]
default  = true
optimize = false
debug    = false
simd     = "scalarize"

[profile.dbg]
optimize = false
debug    = true
simd     = "scalarize"

[dep.ctlib]
path = "../ctlib"
