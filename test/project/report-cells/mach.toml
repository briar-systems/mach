# two freestanding targets building objects, which link nothing, so every host builds them
[project]
id      = "cells"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.one]
arch = "x86_64"
sys  = "freestanding"
abi  = "sysv64"
isa  = "x86-64"

[target.two]
arch = "x86_64"
sys  = "freestanding"
abi  = "sysv64"
isa  = "x86-64"

[artifact.single]
kind    = "object"
entry   = "single.mach"
targets = ["one"]

[artifact.broken]
kind    = "object"
entry   = "broken.mach"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"
