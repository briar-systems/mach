[project]
id      = "liba"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.liba]
kind    = "static"
entry   = "lib/liba.mach"
out     = "{project.work}/lib/libliba{artifact.suffix}"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.vlib]
git = "../vlib.bundle"
ref = "tag/v0.1.0"
