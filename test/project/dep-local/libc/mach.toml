[project]
id      = "libc"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.libc]
kind    = "static"
entry   = "lib/libc.mach"
out     = "{project.work}/lib/liblibc{artifact.suffix}"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.vlib]
git = "../vlib.bundle"
ref = "tag/v0.2.0"
