# wasm32 modules of exports: on freestanding, one that imports from a module a link entry names,
# the provider of that module, one that allocates through std's heap over linear memory, one whose
# import no entry attributes and one that does not link the entry its import names, which the link
# refuses, and a bin with no _start, the deprecated spelling of a module. on wasi, a reactor and the
# module that imports from the host's module, and a bin with no _start, which the link refuses
[project]
id      = "wasm_module"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.web]
arch = "wasm32"
sys  = "freestanding"
abi  = "basic"

[target.wasi]
arch = "wasm32"
sys  = "wasi"
abi  = "basic"

[link.host]
source = "system"
kind   = "module"
sys    = ["freestanding", "wasi"]
arch   = ["wasm32"]
abi    = ["*"]

[artifact.adder]
kind    = "module"
entry   = "adder.mach"
out     = "{project.work}/bin/adder{artifact.suffix}"
targets = ["web", "wasi"]
link    = ["host"]

[artifact.host]
kind    = "module"
entry   = "host.mach"
out     = "{project.work}/bin/host{artifact.suffix}"
targets = ["web"]

[artifact.heap]
kind    = "module"
entry   = "heap.mach"
out     = "{project.work}/bin/heap{artifact.suffix}"
targets = ["web"]

[artifact.unattributed]
kind    = "module"
entry   = "unattributed.mach"
out     = "{project.work}/bin/unattributed{artifact.suffix}"
targets = ["web"]

[artifact.unlinked]
kind    = "module"
entry   = "adder.mach"
out     = "{project.work}/bin/unlinked{artifact.suffix}"
targets = ["web"]

[artifact.entryless]
kind    = "bin"
entry   = "host.mach"
out     = "{project.work}/bin/entryless{artifact.suffix}"
targets = ["web", "wasi"]

[artifact.reactor]
kind    = "module"
entry   = "reactor.mach"
out     = "{project.work}/bin/reactor{artifact.suffix}"
targets = ["wasi"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
