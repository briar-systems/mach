# freestanding wasm32 modules: one that imports from a module a link entry names and exports a
# function, the provider of that module, one that allocates through std's heap over linear
# memory, and one whose import no entry attributes, which the link refuses
[project]
id      = "wasm_module"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.web]
arch = "wasm32"
sys  = "freestanding"
abi  = "basic"

[link.host]
source = "system"
kind   = "module"
sys    = ["freestanding"]
arch   = ["wasm32"]
abi    = ["*"]

[artifact.adder]
kind    = "bin"
entry   = "adder.mach"
out     = "{project.work}/bin/adder{artifact.suffix}"
targets = ["web"]
link    = ["host"]

[artifact.host]
kind    = "bin"
entry   = "host.mach"
out     = "{project.work}/bin/host{artifact.suffix}"
targets = ["web"]

[artifact.heap]
kind    = "bin"
entry   = "heap.mach"
out     = "{project.work}/bin/heap{artifact.suffix}"
targets = ["web"]

[artifact.unattributed]
kind    = "bin"
entry   = "unattributed.mach"
out     = "{project.work}/bin/unattributed{artifact.suffix}"
targets = ["web"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
