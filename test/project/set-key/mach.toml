# a project whose profile keys are written with --set
[project]
id      = "setkey"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.setkey]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/setkey{artifact.suffix}"
targets = ["*"]

[profile.debug]
default  = true
optimize = false
debug    = true
simd     = "scalarize"

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
