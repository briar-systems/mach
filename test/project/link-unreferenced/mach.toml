# windows executables that import nothing from ws2_32: one links an entry that has the image load
# it whether or not anything imports from it, which the link refuses naming the entry, and one an
# entry that states `include = "referenced"`, which builds
[project]
id      = "link_unreferenced"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.win]
arch = "x86_64"
sys  = "windows"
abi  = "win64"
env  = "msvc"

[artifact.always]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/always{artifact.suffix}"
targets = ["win"]
link    = ["ws2_32"]

[artifact.referenced]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/referenced{artifact.suffix}"
targets = ["win"]
link    = ["winsock"]

[link.ws2_32]
source = "system"
name   = "ws2_32.dll"
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]

[link.winsock]
source  = "system"
name    = "ws2_32.dll"
include = "referenced"
sys     = ["windows"]
arch    = ["*"]
abi     = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
