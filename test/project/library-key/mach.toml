# windows executables importing ExitProcess, which std attributes to its [link.kernel32] entry by
# that entry's key: one attributes it to the entry's loader name, which the build refuses with
# the key to write, and one to the key, which builds beside std's attribution
[project]
id      = "library_key"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.win]
arch = "x86_64"
sys  = "windows"
abi  = "win64"
env  = "msvc"

[artifact.loader]
kind    = "bin"
entry   = "loader.mach"
out     = "{project.work}/bin/loader{artifact.suffix}"
targets = ["win"]

[artifact.keyed]
kind    = "bin"
entry   = "keyed.mach"
out     = "{project.work}/bin/keyed{artifact.suffix}"
targets = ["win"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
