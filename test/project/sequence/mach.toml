# a project built and tested in turn in one work directory, each reusing what the last left
[project]
id      = "sequence"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.sequence]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/sequence{artifact.suffix}"
targets = ["*"]

[profile.debug]
optimize = false
debug    = true
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
