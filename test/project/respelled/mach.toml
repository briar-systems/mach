# a project with two profiles, built under the default selection and under --all in one work directory
[project]
id      = "respelled"
version = "0.1.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[artifact.respelled]
kind    = "bin"
entry   = "main.mach"
out     = "{project.work}/bin/respelled{artifact.suffix}"
targets = ["*"]

[profile.debug]
default  = true
optimize = false
debug    = true
simd     = "scalarize"

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"

[dep.std]
path = "../../../dep/std"
