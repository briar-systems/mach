[project]
id = "checked-types"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"

[artifact.cross-unit-alignment]
kind = "static"
entry = "cross-unit-alignment.mach"
out = "lib/cross-unit-alignment.a"
targets = ["*"]
link = []
need = []

[artifact.cross-domain-id]
kind = "static"
entry = "cross-domain-id.mach"
out = "lib/cross-domain-id.a"
targets = ["*"]
link = []
need = []

[dep.mach]
path = "provider"
