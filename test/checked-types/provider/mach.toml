[project]
id = "mach"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"

[artifact.mach]
kind = "static"
entry = "lang/layout.mach"
out = "lib/mach.a"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../../../dep/std"
