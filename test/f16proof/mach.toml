[project]
mach = ">=5"
id = "f16proof"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.x86_64v3-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"
extensions = ["x86-64-v3"]

[target.aarch64-linux]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.aarch64fp16-linux]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"
extensions = ["fp16"]

[target.riscv64-linux]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.riscv64zfh-linux]
isa = "rv64gc_zfh"
os  = "linux"
abi = "lp64d"

[profile.o0]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.o2]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.f16proof]
kind = "bin"
entry = "bin/main.mach"
out = "bin/f16proof"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../../dep/std"
