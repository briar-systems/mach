[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["foreign", "kernel32"]
need = []

[link.foreign]
source = "local"
path = "{project.work}/obj/foreign/qz.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.kernel32]
source = "system"
name = "kernel32.dll"
symbols = ["GetTickCount"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.foreign]
argv = ["sh", "decode-fixture.sh", "{project.work}/obj/foreign/qz.o"]
in = ["decode-fixture.sh", "qz.c", "qz.o.b64"]
out = ["{project.work}/obj/foreign/qz.o"]
need = []
