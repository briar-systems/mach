[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[link.probe]
source = "local"
path = "probe.o"
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[link.objc]
source = "system"
name = "/usr/lib/libobjc.A.dylib"
library = "objc"
symbols = ["objc_msgSend"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe", "objc"]
need = []

[dep.std]
path = "../../../../dep/std"
