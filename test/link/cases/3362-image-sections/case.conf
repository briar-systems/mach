# a linked freestanding ELF image keeps its data symbols, its `.bss` and its
# `#[section(...)]` names (#3362). the image's section table used to be
# synthesized from the LOAD segments - names from segment protection, sizes from
# p_filesz, everything PROGBITS - which erased all three at once, and the symbol
# table carried functions only. the observable is readelf's account of the image,
# normalized to names, types and sizes, so the golden is the same on every ISA.
#
# cross-built on the cheap x86_64-linux leg and never executed: nothing here is a
# runtime fact, and no freestanding runner exists. the sibling aarch64 and riscv64 cases cover the other ELF ISAs.
run: image-sections
legs: x86_64-linux
target: freestanding-x86_64
