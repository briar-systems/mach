[project]
id = "3362imagesections"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.freestanding-x86_64]
isa  = "x86_64"
os   = "freestanding"
abi  = "sysv64"
of   = "elf"
base = 0xFFFFFFFF80000000

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.3362imagesections]
kind = "bin"
entry = "main.mach"
out = "bin/3362imagesections.elf"
targets = ["*"]
link = []
need = []
