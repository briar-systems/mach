[project]
mach = ">=5"
id = "3362imagesections"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.freestanding-x86_64]
isa  = "x86_64"
os   = "freestanding"
abi  = "sysv64"
of   = "elf"
base = 0xFFFFFFFF80000000

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.3362imagesections]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/3362imagesections.elf"
targets = ["*"]
link = []
need = []
