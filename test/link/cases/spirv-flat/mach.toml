[project]
id = "case"
version = "0.0.0"
src = "src"
# a fixed output root: `-o` names the delivered entry module and the per-module
# objects land under obj/ beside it, so the producer finds both from one directory
# rather than through a per-target/profile template it would have to reconstruct.
out = "out/link"

# no `of` key. that is the whole point of the case: the target spells only the
# tuple, and the toolchain must resolve the object format that carries a finished
# SPIR-V module on its own (#2245).
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = []
need = []
