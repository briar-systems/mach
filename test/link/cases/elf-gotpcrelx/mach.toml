[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[step.probe]
argv = ["sh", "-c", "cc -c -O1 -fPIC -fno-plt probe.c -o {project.out}/obj/probe.o && cc -c -O1 defs.c -o {project.out}/obj/defs.o && readelf -r --wide {project.out}/obj/probe.o | grep -q 'R_X86_64_REX_GOTPCRELX' && readelf -r --wide {project.out}/obj/probe.o | grep -q 'R_X86_64_GOTPCRELX '"]
in = ["probe.c", "defs.c"]
out = ["{project.out}/obj/probe.o", "{project.out}/obj/defs.o"]
need = []

[link.probe]
source = "local"
path = "{project.out}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[link.defs]
source = "local"
path = "{project.out}/obj/defs.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe", "defs"]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
