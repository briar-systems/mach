[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[step.probe]
argv = ["sh", "-c", "cc -c -O1 -fPIC -fno-plt probe.c -o {project.work}/obj/probe.o && cc -c -O1 defs.c -o {project.work}/obj/defs.o && readelf -r --wide {project.work}/obj/probe.o | grep -q 'R_X86_64_REX_GOTPCRELX' && readelf -r --wide {project.work}/obj/probe.o | grep -q 'R_X86_64_GOTPCRELX '"]
in = ["probe.c", "defs.c"]
out = ["{project.work}/obj/probe.o", "{project.work}/obj/defs.o"]
need = []

[link.probe]
source = "local"
path = "{project.work}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[link.defs]
source = "local"
path = "{project.work}/obj/defs.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["probe", "defs"]
need = []

[dep.std]
path = "../../../../dep/std"
