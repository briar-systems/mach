# `-fPIC` reaches a global through the GOT and emits R_X86_64_REX_GOTPCRELX (42),
# an indirect call under `-fno-plt` emits R_X86_64_GOTPCRELX (41), and mach
# rejected both outright as unsupported relocation types (#2534). `-fPIC` is the
# default on most distributions, so any project vendoring C hit this.
#
# Both are the RELAXABLE spelling of GOTPCREL: a linker may honour the indirection
# or rewrite the site into a direct PC-relative reference. mach honours it, so the
# observable has to be the VALUES read and written through those GOT slots, not
# that the link succeeded - a link-only check is exactly what would pass while the
# slot held the wrong address.
#
# x86_64-linux only: the relocation numbers are x86_64's and the case's C half is built by
# the runner's native `cc`, which produces an x86-64 object no other leg can
# consume. The step re-reads its own object and fails if either type is missing, so
# a toolchain that stopped emitting them breaks the case loudly instead of leaving
# it silently covering nothing.
run: exec
legs: x86_64-linux
