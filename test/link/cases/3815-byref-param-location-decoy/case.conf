# binary-inspection case (#3815): the byref-param-location check selects exactly the
# case's own `probe`. This is the 3461-byref-param-location program plus a second
# module declaring another `probe` with a parameter `w`, the shape a std `probe`
# could take. A selector that picked the function by name alone would count two
# subprograms and read the decoy's `w`, so the golden's subprograms=1 fails it.
run: byref-param-location
legs: x86_64-linux aarch64-linux riscv64-linux
gbuild: yes
