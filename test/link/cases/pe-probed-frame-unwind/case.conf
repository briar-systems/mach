# a mach frame large enough to need stack probes, and a small one beside it,
# each unwound by Windows' own unwinder. each function captures its own context
# with RtlCaptureContext, then looks up its function entry and unwinds one frame
# with RtlVirtualUnwind, which must hand back exactly the caller's stack pointer
# and frame pointer. the probed frame allocates past a page, so its unwind info
# has to describe the allocation the probe made.
#
# x86_64-windows only: RtlVirtualUnwind is the unwinder under test.
legs: x86_64-windows
