[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[link.kernel32]
source = "system"
name = "kernel32.dll"
symbols = ["RtlCaptureContext", "RtlLookupFunctionEntry", "RtlVirtualUnwind"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.out}/bin/case"
targets = ["*"]
link = ["kernel32"]
need = []

[dep.std]
path = "../../../../dep/std"
