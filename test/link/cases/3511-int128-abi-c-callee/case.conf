# `u128` and `i128` across an `ext` boundary against a C callee and a C caller the
# RUNNER'S own toolchain built (mach #3511): C's `unsigned __int128` / `__int128`.
#
# WHAT ONLY A FOREIGN TOOLCHAIN CAN SAY. mach's caller and callee agree with each
# other by construction, so a 128-bit placement that is wrong on both sides is
# invisible to every mach-only fixture. The positions here are the ones each
# convention treats specially, and the `next` argument after every 128-bit value
# lands where the convention says only if the value consumed exactly the registers
# the convention says:
#   - position 0 (`c_u128`): the plain pair (rdi:rsi, x0:x1, a0:a1; a pointer on Win64)
#   - after one integer (`c_odd`): AAPCS64 C.10 rounds NGRN 1 up to 2, so the value
#     takes x2:x3 and `next` x4, and x1 is never filled; System V and LP64 do not round
#   - after six integers (`c_six`): System V has no pair left and puts the value on the
#     stack, never split, with `next` behind it; AAPCS64 fills x6:x7 and stacks `next`;
#     LP64 fills a6:a7 and stacks `next`
#   - after seven integers (`c_seven`): AAPCS64 C.11 gives the last register to
#     nothing (NGRN becomes 8) and stacks the value 16-byte aligned; LP64 splits it,
#     the low half in a7 and the high half as the first stack word; System V stacks it
#   - a float on each side (`c_fmix`): the float bank is untouched by the pair
#   - returns (`c_mk_u128`, `c_mk_i128`): rax:rdx, x0:x1, a0:a1, and XMM0 on Win64
#
# Win64 has no Microsoft rule for the type; the convention is the one GCC (mingw-w64)
# and Clang share since LLVM 18 (by reference to a caller copy, returned in xmm0), which
# is what this probe's compiler emits and what mach declares (see
# src/lang/target/abi/win64.mach). Both directions run: mach calls C with each shape and
# reads each return back from C, then C calls mach with the same shapes and reads what
# mach returns. -O0 keeps every C read in place.
run: exec
