# 32-byte vectors (`i32x8`) across an `ext` boundary on an avx target, against a
# C callee and a C caller built at -mavx2 by the runner's own toolchain (mach
# #3751): C's `int __attribute__((vector_size(32)))`.
#
# WHAT ONLY A FOREIGN TOOLCHAIN CAN SAY. Under avx the System V psABI classes a
# 32-byte vector SSE then SSEUP, one ymm register, so where the next argument
# lands says whether each vector consumed exactly one vector register:
#   - `c_v8`: a vector between two integers rides ymm0, the integers rdi and rsi.
#   - `c_two`: two vectors ride ymm0 and ymm1.
#   - `c_fmix`: a double, a vector, a double take xmm0, ymm1 and xmm2.
#   - `c_full`: eight doubles fill xmm0-xmm7, so the vector goes on the stack at
#     its 32-byte alignment and `next` stays in rdi.
#   - `c_mk`: a vector result returns in ymm0.
#   - `c_v16`: a 64-byte vector is past the ymm register, so it stays MEMORY on
#     the stack at 64 bytes, as the baseline passes a 32-byte one.
# under avx2 mach holds an i32x8 whole in its ymm register and passes it there
# (#4128), clearing the upper state with vzeroupper before a call or a return
# that passes no ymm value. Both directions run: mach calls C with each shape and
# reads each return back from C, then C calls mach with the same shapes. The leg
# is x86_64-linux, whose runner has AVX2; the target selects x86-64-v3.
legs: x86_64-linux
target: x86_64v3-linux
run: exec
