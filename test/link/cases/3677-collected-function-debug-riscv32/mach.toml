[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.riscv32]
isa  = "rv32imafdc"
os   = "freestanding"
abi  = "ilp32d"
of   = "elf"
base = 0x10000

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = []
need = []
