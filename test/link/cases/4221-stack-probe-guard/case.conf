# a frame larger than the stack's guard faults at the guard (mach #4221). a
# std thread fences a 64 KiB PROT_NONE guard inside its own stack with at least
# 256 KiB of writable stack below it, descends to just above the guard, and
# calls a function with a 256 KiB frame whose first write is the call it makes
# at the frame's bottom. with probes the frame's allocation touches every 4 KiB of it in order
# and faults at the guard. without them the call lands wholly in the writable
# memory below, returns, and the program exits 1: the stack clash the probe
# exists to stop.
#
# linux and darwin legs: windows has probed since its commit model needed it.
# riscv64 executes under qemu, which is compute evidence (see test/README.md).
legs: x86_64-linux aarch64-linux riscv64-linux x86_64-darwin aarch64-darwin
