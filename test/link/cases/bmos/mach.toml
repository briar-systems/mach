[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.bmos-x86_64]
isa      = "x86_64"
os       = "freestanding"
abi      = "sysv64"
base     = 0xFFFF800000000000
platform = "bmos"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case.app"
targets = ["*"]
link = []
need = []
