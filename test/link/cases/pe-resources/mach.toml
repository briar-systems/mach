[project]
mach = ">=5"
id = "pe-resource-case"
version = "3.4.5"
src = "src"
work = "out"

[target.x86_64-windows]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.game-app]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/game-app"
targets = ["*"]
link = ["kernel32"]
need = ["step.icon"]
icon = "out/resource/app.ico"
manifest = "assets/app.manifest"

[step.icon]
argv = ["sh", "decode-icon.sh", "out/resource/app.ico"]
in = ["decode-icon.sh", "assets/app.ico.b64"]
out = ["out/resource/app.ico"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false
