[project]
id = "pe-resource-case"
version = "3.4.5"
src = "src"
out = "out"

[target.x86_64-windows]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.game-app]
kind = "bin"
entry = "main.mach"
out = "bin/game-app"
targets = ["*"]
link = ["kernel32"]
need = ["icon"]
icon = "out/resource/app.ico"
manifest = "assets/app.manifest"

[step.icon]
argv = ["sh", "decode-icon.sh", "out/resource/app.ico"]
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }
in = ["decode-icon.sh", "assets/app.ico.b64"]
out = ["out/resource/app.ico"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false
