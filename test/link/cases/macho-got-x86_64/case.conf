# Cross-build and structurally inspect real clang GOT_LOAD/GOT relocations on the
# per-PR Linux leg. The same case also runs the PIE on the native Intel macOS main
# lane, so one fixture proves both the dyld metadata and the loaded values.
run: macho-got
legs: x86_64-linux x86_64-darwin
target: x86_64-darwin
build-flags: --pie
