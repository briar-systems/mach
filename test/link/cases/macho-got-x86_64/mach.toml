[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[link.fixture-c]
source = "local"
path = "fixture.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[link.fixture-provider]
source = "local"
path = "fixture-provider.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[link.fixture-asm]
source = "local"
path = "fixture-asm.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[link.libsystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
library = "libSystem"
symbols = ["__stderrp"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["fixture-c", "fixture-provider", "fixture-asm", "libsystem"]
need = []

[dep.std]
path = "../../../../dep/std"
