# A MACH callee overwrites every field of its by-value aggregate parameter, and the C
# CALLER's object must be untouched (mach #3416, ruled in #3418). This is the reverse
# direction of ext-byval-aggregate, and it is the boundary the ruling newly rests on.
#
# WHAT CHANGED AND WHY THIS EXISTS. Mach used to copy an incoming aggregate into
# storage of its own at function entry, so a callee writing to its parameter wrote to
# that private copy and no caller could be harmed, whatever the caller had done.
# #3418 ruled option A: the caller owns the copy on every ABI, as C does, and the
# callee uses the memory it was handed IN PLACE. The callee's entry copy is gone, so
# the only thing standing between a writing callee and the caller's object is the
# copy the CALLER made. When the caller is C, that copy is made by the runner's own
# toolchain following the platform convention - which is precisely the claim the
# ruling makes, and which no mach-only fixture can test, because mach's caller and
# callee agree with each other by construction.
#
# WHICH LEGS ARE EVIDENCE AND WHICH ARE CONTROLS. aarch64-linux, riscv64-linux and
# x86_64-windows pass the 32-byte aggregate as the address of a caller-allocated
# copy, so a mach callee writing in place writes into that copy. x86_64-linux and
# x86_64-darwin put the bytes in the outgoing stack area, which System V also gives
# the callee to use; they are controls, and a change that made the by-reference
# conventions safe by breaking the by-value one would fail them. The 16-byte `pair`
# is the windows leg's own by-reference case at a size the other conventions pass in
# registers, where the callee's home is storage the ABI lowering gave it.
#
# The probe is built at -O0 so each field read after the call is really performed.
run: exec
