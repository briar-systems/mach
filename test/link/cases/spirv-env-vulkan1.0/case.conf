# a vulkan1.0 module is SPIR-V 1.0: its entry points list only Input and Output
# variables and its storage buffers are Uniform variables over BufferBlock blocks
# (#3399). the environment every other spirv case pins is vulkan1.3, whose rules
# accept the 1.4 and 1.3 forms, so none of them could see either.
run: spirv-val-pinned
legs: x86_64-linux
target: spirv
