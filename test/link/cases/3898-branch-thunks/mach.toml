[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.aarch64-linux]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[step.far]
argv = ["sh", "../../cc.sh", "-c", "far.c", "-o", "{project.work}/obj/far.o"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["far.c"]
out = ["{project.work}/obj/far.o"]
need = []

[link.far]
source = "local"
path = "{project.work}/obj/far.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["far"]
need = []

[dep.std]
path = "../../../../dep/std"
