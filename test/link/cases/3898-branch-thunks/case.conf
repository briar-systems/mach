# branches across more than 128 MB of aarch64 code link through range-extension
# thunks (#3898). b and bl reach +-128 MB, and the linker used to refuse any branch
# past that with a relocation overflow.
#
# far.c is an assembly object whose code holds a 140 MB skip between a function at
# its start and two at its end. main calls all three and each calls back into
# mach, so whichever order the link lays the mach code and the object out in,
# calls cross the skip both ways, as bl and as a tail b. on darwin the start
# function also calls an import, whose call stub lies past the skip, so the thunk
# to a stub is proven there. the object and the image are each about 140 MB.
legs: aarch64-linux aarch64-darwin
profiles: debug
