[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[link.fixture-c]
source = "local"
path = "fixture.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[link.libsystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
symbols = ["__stdoutp", "__stderrp"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["fixture-c", "libsystem"]
need = []

[dep.std]
path = "../../../../dep/std"
