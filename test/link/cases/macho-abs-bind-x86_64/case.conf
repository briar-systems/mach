# Cross-build and structurally inspect in-place dyld binds of absolute import
# references on the per-PR Linux leg. The same case runs the PIE on the native
# Intel macOS main lane, proving dyld resolves the cells at load.
run: macho-abs-bind
legs: x86_64-linux x86_64-darwin
target: x86_64-darwin
build-flags: --pie
