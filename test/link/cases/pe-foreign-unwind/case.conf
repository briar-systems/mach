# Cross-link a Windows image on Linux and inspect its exception directory. The
# linked COFF fixture is a real clang-produced C object with `.pdata` ADDR32NB
# relocations and 8 KiB text alignment, so the first section is more than one
# page above ImageBase; execution is neither needed nor possible on this leg.
run: pe-exceptions
legs: x86_64-linux
target: x86_64-windows
