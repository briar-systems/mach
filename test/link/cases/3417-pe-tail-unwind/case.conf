# a mach frame that ends in a tail jump, walked by Windows' own unwinder (mach
# #3417). m_outer saves nonvolatile registers, since it holds values across a
# call into C, and then leaves by jumping to m_inner: its epilogue restores
# them and frees the frame before the jump, so m_inner returns straight to
# m_outer's caller.
#
# The C driver loads a sentinel into every nonvolatile register and calls
# m_outer. m_inner holds values across a call into C, which walks the stack
# with RtlLookupFunctionEntry and RtlVirtualUnwind the way a backtrace does:
# its own frame, then m_inner's, whose function entry the walk checks, and
# then the walk must stand at the driver's return address with the driver's
# stack pointer and every sentinel back. Were m_outer's frame still on the
# stack the walk would stand inside it instead.
#
# x86_64-windows only: RtlVirtualUnwind is the unwinder under test. release
# only, where the middle end marks tail calls.
legs: x86_64-windows
profiles: release
