# vulkan1.0 guarantees no Int8, so an 8-bit local and its arithmetic are carried
# in the narrowest integer it has, a wider one, with the wrap kept where the
# value is observed: compared, tested, extended or converted (#4302). the module
# must build without the Int8 capability and validate as vulkan1.0.
run: spirv-val-pinned
legs: x86_64-linux
target: spirv
