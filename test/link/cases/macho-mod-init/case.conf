# dyld runs the pointers in a __DATA,__mod_init_func section before the program
# entry point, and it finds that section by its section TYPE
# (S_MOD_INIT_FUNC_POINTERS), not by its name. A link that carried the name but not
# the type produced an image whose initializer was silently never called (#2637).
#
# the structure is read host-side on the cheap x86_64-linux leg. the macOS leg builds the
# same image and RUNS it, which is the only thing that proves dyld actually called
# the entry: every other observable here is satisfied by an image that never runs it.
run: macho-mod-init
legs: x86_64-linux x86_64-darwin
target: x86_64-darwin
build-flags: --pie
