# A record argument that lands on the stack across an `ext` boundary against a C
# callee and a C caller the RUNNER'S own toolchain built (mach #3950).
#
# Each shape follows eight integers (or eight doubles) and a byte (or a float), so
# the record is on the stack past a narrow argument and `next` follows it. Apple's
# arm64 ABI places a scalar on the stack at its natural size and alignment, but gives
# a record that is no HFA or HVA a slot aligned to at least 8 and rounded up to 8, as
# AAPCS64 does. An HFA keeps its natural placement on darwin:
#   - `c_r3` (`{u8,u8,u8}`): the record at sp+8, `next` at sp+16
#   - `c_m` (`{u8; u32}`): the record at sp+8, `next` at sp+16
#   - `c_p` (`#[packed] {u128}`): the record at sp+8, `next` at sp+24
#   - `c_h` (`{f32,f32,f32}` HFA after eight doubles and a float): aarch64-darwin
#     places the record at sp+4 and `next` at sp+16, aarch64-linux at sp+8 and sp+24
# Both directions run: mach calls C, then C calls mach with the same shapes. The
# unpatched compiler placed the three integer records at their own size and alignment
# on aarch64-darwin, so it read `c_r3`'s record from sp+1 and its `next` from sp+8.
#
# The legs are the two aarch64 ones: linux is the control, darwin the fix.
legs: aarch64-linux aarch64-darwin
run: exec
