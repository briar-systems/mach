[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["kernel32", "user32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
library = "kernel32"
symbols = ["Sleep"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.user32]
source = "system"
name = "user32.dll"
library = "user32"
symbols = ["MessageBeep"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false
