[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["kernel32", "user32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
symbols = ["Sleep"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.user32]
source = "system"
name = "user32.dll"
symbols = ["MessageBeep"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false
