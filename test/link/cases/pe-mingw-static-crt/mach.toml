[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["crt"]
need = []

[link.crt]
source = "local"
path = "{project.work}/lib/mingw-crt.lib"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.crt]
argv = ["sh", "decode-fixture.sh", "{project.work}/lib/mingw-crt.lib"]
in = ["decode-fixture.sh", "caller.c", "caller.o.b64", "vsnprintf.c", "vsnprintf.o.b64", "options.c", "options.o.b64", "startup.c", "startup.o.b64"]
out = ["{project.work}/lib/mingw-crt.lib"]
need = []
