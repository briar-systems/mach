[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["crt"]
need = []

[link.crt]
source = "local"
path = "{project.out}/lib/mingw-crt.lib"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.crt]
argv = ["sh", "decode-fixture.sh", "{project.out}/lib/mingw-crt.lib"]
in = ["decode-fixture.sh", "caller.c", "caller.o.b64", "vsnprintf.c", "vsnprintf.o.b64", "options.c", "options.o.b64", "startup.c", "startup.o.b64"]
out = ["{project.out}/lib/mingw-crt.lib"]
need = []
