# the selector stubs apple clang compiles a message send to (#4256). probe.o is
# what clang -c emits for one call of `_objc_msgSend$addItem:` (see
# test/link/objc-probe.py): an undefined symbol no dylib exports, which ld64
# synthesizes at link time. mach used to refuse it as an unattributed dynamic
# import. the link now defines the stub, so the call reaches a stub that loads
# the selector reference the linker emits (a pointer to the method name
# `addItem:`) and jumps through the GOT slot dyld binds to libobjc's objc_msgSend.
# the image is read host-side on the cheap x86_64-linux leg, and a native arm64
# macOS leg also runs it.
run: macho-objc-stubs
legs: x86_64-linux
target: x86_64-darwin
build-flags: --pie
