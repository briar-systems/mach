[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[link.probe]
source = "local"
path = "probe.o"
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[link.objc]
source = "system"
name = "/usr/lib/libobjc.A.dylib"
symbols = ["objc_msgSend"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["probe", "objc"]
need = []

[dep.std]
path = "../../../../dep/std"
