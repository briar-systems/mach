# binary-inspection case (#3394): the rows covering a function's prologue must carry
# the function's own declaration, not the location of whatever instruction the body
# happens to start with - at -O2 that instruction belongs to an inlined std callee in
# another file, and crediting the frame setup to it drops `main` out of any view that
# filters library code (briar-systems/compiler-explorer#6). the facts come from
# llvm-dwarfdump over the -g artifact and are ISA-independent, so the golden is shared
# across the ELF legs; it differs by profile only in whether the body starts in
# another file, which is the inlining the -O2 half of the case needs to have happened.
legs: x86_64-linux aarch64-linux riscv64-linux
gbuild: yes
