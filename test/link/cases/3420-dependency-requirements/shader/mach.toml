[project]
id = "shader"
version = "0.0.0"
mach = ">=5"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"

[artifact.shader]
export = true
kind = "static"
entry = "lib.mach"
out = "{project.work}/lib/shader{artifact.suffix}"
targets = ["x86_64-linux"]
link = []
need = ["artifact.shader-quad"]

[artifact.shader-quad]
kind = "bin"
entry = "quad.mach"
out = "{project.work}/spv/quad{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.std]
path = "../../../../../dep/std"

[profile.debug]
optimize = false
debug = false
simd = "scalarize"
