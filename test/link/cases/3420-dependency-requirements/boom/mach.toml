[project]
id = "boom"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"

[artifact.boom]
default = true
kind = "static"
entry = "lib.mach"
out = "lib/boom{artifact.suffix}"
targets = ["x86_64-linux"]
link = []
need = ["artifact.shader-quad", "step.stamp"]

[artifact.shader-quad]
kind = "bin"
entry = "quad.mach"
out = "spv/quad{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.std]
path = "../../../../../dep/std"

[step.stamp]
argv = ["sh", "stamp.sh", "{project.out}/stamp/boom.txt"]
env = {}
in = ["stamp.sh"]
out = ["{project.out}/stamp/boom.txt"]
need = []

[dep.shader]
path = "../shader"
