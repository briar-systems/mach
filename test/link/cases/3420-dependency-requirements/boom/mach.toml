[project]
id = "boom"
version = "0.0.0"
mach = ">=5"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"

[artifact.boom]
export = true
kind = "static"
entry = "lib.mach"
out = "{project.work}/lib/boom{artifact.suffix}"
targets = ["x86_64-linux"]
link = []
need = ["artifact.shader-quad", "step.stamp"]

[artifact.shader-quad]
kind = "bin"
entry = "quad.mach"
out = "{project.work}/spv/quad{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.std]
path = "../../../../../dep/std"

[step.stamp]
argv = ["sh", "stamp.sh", "{project.work}/stamp/boom.txt"]
env = {}
in = ["stamp.sh"]
out = ["{project.work}/stamp/boom.txt"]
need = []

[dep.shader]
path = "../shader"

[profile.debug]
optimize = false
debug = false
simd = "scalarize"
