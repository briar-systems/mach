# a dependency's default library artifact requires a shader artifact and embeds it,
# and the consumer can do nothing about it: `need` never reaches into a dependency.
#
# THE TWO DELIVERED MODULES ARE THE CASE. boom and shader both declare an artifact
# named shader-quad; each is built for the consumer, homed under its own dependency
# id, and each dependency's modules resolve `{artifact.shader-quad.out}` in their own
# manifest. boom's shader compiles a shader module in turn, so shader's requirement
# is built before boom's. a shared home, a scope read from the root, or a missing
# order all show up as the wrong bytes in the program. boom's default library also
# requires a step, which must run in the consumer's output tree (#3420).
legs: x86_64-linux
run: exec
