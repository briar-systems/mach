[project]
id = "symtabcase"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.aarch64-linux]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.riscv64-linux]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.symtabcase]
kind = "bin"
entry = "main.mach"
out = "bin/symtabcase"
targets = ["*"]
link = []
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
