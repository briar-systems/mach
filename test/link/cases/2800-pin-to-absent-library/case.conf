# the negative direction of #2800: an import pinned to a logical name that is
# genuinely nowhere in the effective link set - neither the consumer's own entries
# nor any dependency's `export = true` - is still refused, and the message names
# what the link does provide instead of only what was asked for.
#
# this exists so the fix cannot become a blanket permit. `2800-pin-to-static-entry`
# is the sibling holding the case where the library IS in the link; the two are
# only meaningful together, since either message alone is satisfiable by the other.
# the link here has no dynamic input either, so this arm also pins that the genuine
# refusal fires on a static link rather than degrading to "undefined symbol".
run: build-fails
legs: x86_64-linux
profiles: debug
