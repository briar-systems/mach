# a textured shader: image and sampler bindings through the spirv back half (#2794).
#
# THE INSTRUCTIONS ARE THE OBSERVABLE, not the validator's verdict, and here more
# than anywhere else in the spirv set. Every wrong outcome available in this case
# passes spirv-val: an `OpTypeImage` whose Dim came out 2D where the source wrote
# `sampler3d`, one whose Arrayed came out 0 where it wrote `array`, one whose
# Sampled operand came out 2 (a storage image) rather than 1, a descriptor bound at
# set 0 where the source wrote set 1, a sample reading the wrong one of two handles
# whose types happen to agree. The golden names every `OpTypeImage` operand, the
# descriptor each handle is bound at, and the handle TYPE each sample reads, so
# each of those is a diff.
#
# The CAPABILITIES are in the golden for the same reason and are the sharpest case
# of it: spirv-val accepts an arrayed cube image declared with `SampledCubeArray`,
# with `ImageCubeArray` (which is the STORAGE form of the same shape, eleven apart
# in the numbering), and with neither. Only the golden separates the three.
#
# The environment is vulkan1.3: `UniformConstant` being the one storage class an
# image, sampler or sampled-image variable may live in is a Vulkan rule, and the
# universal environment does not apply it.
run: spirv-image
legs: x86_64-linux
target: spirv
