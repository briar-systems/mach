[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/link"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.1"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = []
need = []
