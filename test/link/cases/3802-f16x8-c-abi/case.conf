# f16 lanes across an `ext` boundary against a C callee and a C caller the
# RUNNER'S own toolchain built (mach #3802): arm_neon.h's `float16x8_t` and
# `float16x4_t`.
#
# AAPCS64 passes a short vector in the next v register, whatever its lanes, so
# an f16x8 is a `float16x8_t` in one of v0-v7 and an f16x4 a `float16x4_t` in
# the low half of one; where the arguments around it land says each vector
# consumed exactly one vector register:
#   - `c_v8` and `c_v4`: a vector between two integers rides v0, the integers
#     x0 and x1.
#   - `c_mix`: an f32, a vector, an f64 and a scalar f16 take s0, v1, d2 and h3.
#   - `c_full`: eight doubles fill v0-v7, so the vector goes on the stack at its
#     16-byte alignment and `next` stays in x0.
#   - `c_mk`: a vector result returns in v0.
# Both directions run: mach calls C with each shape and reads each return back
# from C, then C calls mach with the same shapes. -O0 keeps every C read in
# place, and each side reads a lane as its bits, so no float conversion runs.
legs: aarch64-linux aarch64-darwin
run: exec
