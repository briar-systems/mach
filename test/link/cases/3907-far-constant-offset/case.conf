# a constant offset past 2^31 into a static array links and reaches the byte it
# names (#3907). the offset used to travel as an i32 from codegen to the
# relocation, so aarch64 refused the image with a page21 overflow and x86-64 and
# riscv64 linked a store 2 GB below the array and faulted.
#
# every access here is a constant offset from `BIG` or from a pointer into it:
# stores at, below and past 2^31, one through a pointer argument whose
# displacement x86-64 cannot encode in disp32, and one through a constant
# address taken as a value. each byte is read back through a runtime index, which
# never folded and so never truncated, so a store that lands anywhere but its
# own byte reads back as 0.
#
# aarch64's adrp reaches +-4 GB and carries the offset in its relocation. x86-64
# and riscv64 reach +-2 GB from the pc, so past 2^31 the address is the symbol
# plus an add. BIG is 2.2 GB of zero-fill, which no leg touches beyond the pages
# the case writes.
legs: x86_64-linux aarch64-linux riscv64-linux
