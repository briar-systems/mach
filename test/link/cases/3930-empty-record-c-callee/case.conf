# An empty record argument across an `ext` boundary against a C callee and a C caller
# the RUNNER'S own toolchain built (mach #3930).
#
# An empty struct is a GNU C extension of size 0, as mach's `rec E { }` is, and clang
# and GCC pass it in no register and no stack slot on aarch64-linux. Apple's arm64 ABI
# lets a function ignore it, and Apple clang does. (C++ differs: its empty struct has
# size 1, and clang passes one in a register on linux. mach follows C.) Each shape puts
# an argument after the empty record that lands where C reads it only if the record
# took nothing:
#   - `c_e`: between two integers, so `next` is x1
#   - `c_ee`: first and third of five, around a double, so `first` is x0, `x` d0 and
#     `next` x1
#   - `c_e7`: after seven integers, so `next` is x7 and not the stack
# Both directions run: mach calls C, then C calls mach with the same shapes. The
# unpatched compiler gave each empty record a general register, so on aarch64-linux
# (qemu) it printed `e=300 ee=30003 e7=700` and `c drives mach: 1`.
#
# The legs are the two aarch64 ones this issue fixes. System V still gives an empty
# record a register: x86_64-linux prints `e=300 ee=30003 e7=700` against GCC as well.
legs: aarch64-linux aarch64-darwin
run: exec
