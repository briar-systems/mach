# the unreferenced twin of link-include-referenced: the SAME provider-cascaded
# include="referenced" [link.m] entry, but the consumer only DECLARES the
# pinned symbol and never calls it. build must still succeed (no
# "not among the link's dependencies" the way a bare, unregistered pin would
# refuse), and the produced image must carry no dependency NEEDED at all - the
# defect this whole design fixes was mach-std's own libc entries forcing a
# NEEDED on every consumer regardless of use.
#
# the dependency is a fixture-built shared library the provider's own [step]
# compiles (REM-141: a linux fixture links only what it builds itself, never a
# host system library); its file existing on disk is irrelevant to this
# golden, since the fact under test is that an unreferenced import elides the
# NEEDED regardless of whether the underlying file could resolve at all.
run: elf-needed
legs: x86_64-linux
