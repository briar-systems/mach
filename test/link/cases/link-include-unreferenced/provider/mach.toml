[project]
id = "provider"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[step.libdemo]
argv = ["sh", "build.sh", "{project.out}/lib/libdemo.so.1"]
in = ["build.sh", "demo.c"]
out = ["{project.out}/lib/libdemo.so.1"]
need = []

# the platform link requirement lives once, here, and cascades to consumers.
# include = "referenced" means this entry's NEEDED is only emitted when some
# live import actually pins to it - unlike 2800-cascade-library-attribution's
# unconditional twin, a project importing this provider without ever calling
# the pinned symbol carries no dependency on it at all. the file is a fixture-
# built shared library the step above compiles, never a host system library
# (REM-141): a "local" entry resolving to a real ELF .so is a genuine dynamic
# dependency exactly like a "system" entry would be, recorded under its own
# soname, so this proves the same referenced-mode mechanism without leaning on
# anything the operating system did not itself supply.
[link.m]
source = "local"
path = "{project.out}/lib/libdemo.so.1"
library = "demomath"
include = "referenced"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true
