# A backtrace through mach code, taken by the platform's own unwinder (mach #4013).
# A C caller enters a mach function that calls another, and the inner one asks
# libSystem's `_Unwind_Backtrace` to walk the stack, handing each frame to a C
# callback that records where its function starts. The unwinder finds every mach
# frame only through the image's `__TEXT,__unwind_info` (and the `__eh_frame` it
# points to where compact unwind cannot say a frame), so reaching the outer mach
# function proves the inner one's entry is right, and the region starts prove the
# entries sit at the functions they describe.
#
# darwin legs only: libSystem carries the unwinder. The ELF legs read their
# `.eh_frame` through llvm-dwarfdump in test/link/cases/symtab instead, since a
# linux image mach links carries no C runtime to unwind with.
run: exec
legs: aarch64-darwin x86_64-darwin
