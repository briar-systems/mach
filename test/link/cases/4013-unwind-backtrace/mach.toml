[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[step.probe]
argv = ["sh", "../../cc.sh", "-c", "-O0", "-fno-stack-protector", "probe.c", "-o", "{project.work}/obj/probe.o"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.c"]
out = ["{project.work}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.work}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

# the unwinder lives in libSystem, and a two-level namespace attributes every
# import to its library
[link.libsystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
symbols = ["_Unwind_GetRegionStart"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["probe", "libsystem"]
need = []

[dep.std]
path = "../../../../dep/std"
