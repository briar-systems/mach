# binary-inspection case (#3461): a by-reference aggregate parameter carries a
# DW_AT_location whose every expression is a memory location reached through the
# incoming pointer. Before the fix the producer rejected a register home for an
# aggregate outright, so on the conventions that pass the object by address the
# parameter had no location at all. The class is what is checked, not the register
# or the slot, so one golden holds on every ISA and in both profiles; each ELF leg
# builds its own target, and the win64 arm is the -win64 sibling.
run: byref-param-location
legs: x86_64-linux aarch64-linux riscv64-linux
gbuild: yes
