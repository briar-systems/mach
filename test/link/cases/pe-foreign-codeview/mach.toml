[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["foreign"]
need = []

[link.foreign]
source = "local"
path = "{project.out}/obj/foreign/codeview.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.foreign]
argv = ["sh", "decode-fixture.sh", "{project.out}/obj/foreign/codeview.o"]
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }
in = ["decode-fixture.sh", "codeview.c", "codeview.o.b64"]
out = ["{project.out}/obj/foreign/codeview.o"]
need = []
