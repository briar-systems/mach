[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/link"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.1"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = []
need = []
