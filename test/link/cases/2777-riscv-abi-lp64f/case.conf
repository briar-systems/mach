# riscv64 only: this case exists to pin one member of the RISC-V ABI family, and the
# other legs have no lp64f to select. its sibling 2777-riscv-abi-lp64 holds identical
# source and an identical golden and differs only in the abi its manifest names, so
# the two together assert that each soft-float member places these arguments
# consistently between caller and callee. the default lp64d is carried by the
# corpus's riscv64-linux column against the C reference.
legs: riscv64-linux
