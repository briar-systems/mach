# build-only: cross-build a aarch64-darwin binary that links a normally-compiled
# clang object (debug info and unwind tables intact) on the cheap x86_64-linux leg and
# assert it emitted. both halves of #2521 are load-bearing here - the object's
# section-based relocations must parse, and the `ext fun` must bind the C
# object's underscore-prefixed `_mad_device_open` - and either regression turns
# the build into a hard error, not a wrong observable. no darwin runner needed
# since the image is not executed.
run: built
legs: x86_64-linux
target: aarch64-darwin
