# Tag values across an `ext` boundary against a C callee and a C caller the RUNNER'S own
# toolchain built (mach #3218, roadmap L5). A mach tag is the record of its layout: the
# discriminator first, then a union of the case payloads at the common payload offset,
# so the matching C type is `struct { D d; union { ... } u; }`. Twelve shapes cover a
# payloadless tag, a 3-byte tag in an 8-byte register, a 9-byte tag in two registers, a
# 16-byte tag, a 24-byte tag in memory, a nested tag, a packed and an over-aligned tag,
# and float, float32 and mixed float/integer payloads.
#
# WHAT ONLY A FOREIGN TOOLCHAIN CAN SAY. mach's own caller and callee agree with each
# other by construction, so a classification that is wrong on both sides is invisible to
# every mach-only fixture. The over-aligned 16-byte tag is the shape that found one: its
# second eightbyte holds only padding, System V assigns it no register, and mach used to
# spend rsi on it, so `c_al16(v, next)` read `next` from the wrong register. The `next`
# argument after every tag is there for that reason: it lands where the convention says
# only if the tag consumed exactly the registers the convention says.
#
# Both directions run: mach calls C with each shape and reads each shape back from C,
# then C calls mach with the same shapes and reads what mach returns. -O0 keeps every
# C field read in place.
run: exec
