[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
# under out/link, which the harness clears before every build, so a module left by an
# earlier run can never stand in for the one this build should have delivered
work = "out/link/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

# vulkan1.0 pins SPIR-V 1.0, the oldest module a consumer can ask for
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.0"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["x86_64-linux"]
link = []
need = ["artifact.shader-*"]

[artifact.shader-tint]
kind = "bin"
entry = "shaders/tint.mach"
out = "{project.work}/spv/tint{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.std]
path = "../../../../dep/std"
