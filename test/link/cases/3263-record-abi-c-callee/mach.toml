[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.aarch64-linux]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.riscv64-linux]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[step.probe]
argv = ["sh", "../../cc.sh", "-c", "-O0", "-fno-stack-protector", "probe.c", "-o", "{project.work}/obj/probe.o"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.c"]
out = ["{project.work}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.work}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

# clang lowers a struct initializer on x86_64-darwin to a memset call, and a
# two-level namespace needs every import attributed to its library
[link.libsystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
symbols = ["memset"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["probe", "libsystem"]
need = []

[dep.std]
path = "../../../../dep/std"
