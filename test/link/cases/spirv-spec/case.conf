# specialization constants through the spirv back half at O2 (#4277). the golden is
# the instructions, not the verdict: a `#[spec]` var nothing writes is exactly the
# global an optimizer would fold to its initializer, and a module that did so still
# validates. each spec constant's reads inside the stage are counted, so a fold shows
# as `reads=0` where the golden says otherwise.
run: spirv-spec
legs: x86_64-linux
target: spirv
profiles: release
