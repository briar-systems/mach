# an `ext` declared after a gate only layout can decide, in a module nothing
# imports, links under its C name (mach #3523). the module is an orphan: `mach
# build` never loads it, so the shape exists only under a test build, where every
# module of the project is loaded and its `ext` reaches the linker. before the
# fix the load walk stopped at the layout gate, the declarations after it were
# never walked, and the link asked for `case.sys.probe_answer` instead of
# `probe_answer`. the probe is a C object the leg's own toolchain builds, so the
# symbol has the same name on every leg and no system library is opened.
#
# this is the first case with `goal: test` (mach #3535); the compile step is
# `mach test`, which also runs the collected test, and exec then records what
# the test printed through the dispatcher. the darwin legs are the ones #3523
# was reported on.
goal: test
run: exec
