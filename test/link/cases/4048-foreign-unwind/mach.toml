[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[step.probe]
argv = ["sh", "../../cc.sh", "-c", "-O2", "-fno-stack-protector", "-ffunction-sections", "probe.c", "-o", "{project.out}/obj/probe.o"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.c"]
out = ["{project.out}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.out}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

# the unwinder lives in libSystem, and a two-level namespace attributes every
# import to its library
[link.libsystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
library = "libSystem"
symbols = ["_Unwind_Backtrace", "_Unwind_GetRegionStart"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[link.kernel32]
source = "system"
name = "kernel32.dll"
symbols = ["RtlCaptureContext", "RtlLookupFunctionEntry", "RtlVirtualUnwind"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe", "libsystem", "kernel32"]
need = []

[dep.std]
path = "../../../../dep/std"
