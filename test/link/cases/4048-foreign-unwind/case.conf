# A backtrace through C functions linked into a mach executable, taken by the
# platform's own unwinder (mach #4048). mach calls C, which calls back into mach,
# and the innermost mach function asks the C probe to walk the stack and record
# where each frame's function starts. The walk reaches the outer mach function
# only by unwinding each C frame through the unwind information its object
# carried into the image.
#
# On darwin, `c_middle` is compiled C whose object describes it in
# `__compact_unwind`, and `c_dwarf` is assembly whose frame compact unwind cannot
# express, so its object leaves it to an `__eh_frame` description the link must
# carry and point the index at; libSystem's `_Unwind_Backtrace` walks. On
# windows both are compiled C described by their object's `.pdata` and `.xdata`,
# and RtlVirtualUnwind walks.
#
# The ELF legs take the same chain through gdb in
# test/link/cases/4048-foreign-unwind-elf, since a linux image mach links
# carries no C runtime to unwind with.
run: exec
legs: aarch64-darwin x86_64-darwin x86_64-windows
