# The RISC-V psABI's pc-relative hi/lo pair, linked by mach against a clang-built
# object (mach#2797).
#
# A `R_RISCV_PCREL_LO12_I/_S` does not name its target. It names a LABEL AT THE PAIRED
# `auipc`, and the target is read off the `R_RISCV_PCREL_HI20` sitting at that label.
# mach never followed that indirection. It took the low half's own symbol as the
# target - which for the psABI spelling IS the auipc's address - and measured from
# `patch_va - 4`, so the whole displacement collapsed to `auipc_va - (patch_va - 4)`:
# a number about where the two instructions sit, with the actual target nowhere in it.
#
# That breaks a foreign object UNCONDITIONALLY, at every hi/lo distance. Byte-adjacent
# halves (the `patch_va - 4` layout the rule assumed) give exactly 0, which is not
# "right because the assumption held" - it is the target having dropped out entirely.
# Halves one instruction apart give -4. Neither is the address the pair names.
#
# So this is not a story about compiler versions. `test/link/cases/narrow-stack-args`
# passes under a newer clang only because that clang builds its `10.0` with
# `lui`+`slli` and emits NO relocation at all, so there is no pair to resolve wrongly;
# under clang 18 it pools the constant, gets a pair, and reads every float argument
# back as 0. Whether a given probe trips this is a property of the SHAPE its compiler
# happened to emit, never of the compiler being new enough - which is exactly why this
# case builds the shape deliberately instead of hoping a probe written for something
# else still contains one.
#
# WHY THIS CASE EXISTS ALONGSIDE test/link/cases/narrow-stack-args. That case also fails
# pre-fix and is a real end-to-end guard, but its probe reaches exactly one pooled
# constant, and under clang 18 that constant is `.LCPI1_0` at section offset 0, with a
# zero addend on the high half, four bytes from its low half. That is the EASIEST
# configuration on every axis a pairing can get wrong, so passing it proves the label
# chase happens and nothing about what the chase carries. A pairing that recovered the
# target section but dropped the symbol's offset, or dropped the high half's addend,
# or still assumed a four-byte gap, would pass it.
#
# This case therefore holds a probe built to be non-trivial on each of those axes at
# once, and every one of them is a real clang output rather than a contrivance:
#
#   symbol offset   `scale`'s 12.5 is `.LCPI2_0` at +8 in the same section whose +0
#                   holds `pcrel_doubles`' 1000.0, so an offset that is dropped shows
#                   up in one row and not the other
#   high addend     the two stores target `kl[2]` / `kd[3]`, which clang spells as
#                   `kl + 10` and `kd + 18` on the HIGH half - a dropped addend is
#                   invisible whenever it is 0, and here it is not
#   hi->lo gap      the pairs in this object sit 4, 6 and 8 bytes apart
#   both spellings  loads reach R_RISCV_PCREL_LO12_I, the stores reach _S. they share
#                   one resolution path, and a shared path is only covered where
#                   something actually exercises it
#
# riscv64 only: the pair is a RISC-V relocation spelling, and no other leg has one.
#
# The observable carries the loaded VALUES, because the failure mode is a believable
# zero and not a crash, plus three facts about what was emitted:
#
#   label-pairs=yes   the case's own C object still contains a low half spelled the
#                     psABI way. clang folds a `const` array into immediates and the
#                     pair vanishes; a fixture that stopped containing the shape it
#                     exists to test would otherwise stay green forever
#   stored ...        the values read back AFTER a store through the `_S` spelling. a
#                     store resolved to the wrong address leaves the original value in
#                     place and corrupts a neighbour, so the readback having MOVED is
#                     the assertion, not that the call returned
#   misaligned=0      over the WHOLE linked image, no load reached through an `auipc`
#                     resolves to an address that is not a multiple of its access
#                     width. this is the check that catches this defect on the emitted
#                     image alone, independent of the values: a low half resolved
#                     against the wrong pc lands an arbitrary byte count off its
#                     symbol, and the pre-fix builds report 8 and 4 here
#   text-relative=0   over the same set, none of those addresses lands inside the text
#                     range. a constant is never in .text, so this is a true invariant
#                     - but it does NOT catch this defect, which resolves to a wrong
#                     address in .data rather than onto code, and it reads 0 both
#                     before and after the fix. it is here because it fails closed for
#                     a different mistake (a pair resolved onto instructions), and it
#                     is stated as its own number rather than being folded in and
#                     described as if it were doing the catching
#
# On `scale=0 0 0` specifically: that row is the ONLY observable here that passes a
# float across the mach -> C boundary (the other two pass a pointer and return
# integers), so it is the one that reports an ABI mismatch rather than a relocation
# one. It reads as the same believable zero this case exists to catch, from an
# unrelated cause - if it zeroes while `doubles` and `longs` stay correct, look at
# this project's `abi =` and at cc.sh's `-mabi`, not at the linker.
run: riscv-pcrel
legs: riscv64-linux
