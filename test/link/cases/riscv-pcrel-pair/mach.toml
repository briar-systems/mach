[project]
id = "case"
version = "0.0.0"
src = "src"
# a fixed out root, not the usual {target.name}/{profile.name} template: the
# riscv-pcrel producer reads the probe object this build leaves behind to prove the
# fixture still exercises the psABI hi/lo spelling, so its path must not move.
out = "out/link/build"

# lp64d, not lp64: since #2777/#2811 those are distinct vtables and `lp64` really
# means soft-float. cc.sh builds this probe with `-mabi=lp64d`, so a target declaring
# plain `lp64` would pass `scale`'s double in an integer register the callee never
# reads - which this case reports as `scale=0 0 0`, the same believable-zero shape
# #2797 produced for a different reason.
[target.riscv64-linux]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[step.probe]
argv = ["sh", "../../lib/cc.sh", "-c", "-O1", "-fno-stack-protector", "probe.c", "-o", "{project.out}/obj/probe.o"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.c"]
out = ["{project.out}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.out}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe"]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
