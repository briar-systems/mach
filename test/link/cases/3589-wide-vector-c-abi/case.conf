# Vectors wider than the vector registers (`i32x8`, `i32x16`) across an `ext`
# boundary against a C callee and a C caller the RUNNER'S own toolchain built
# (mach #3589): C's `int __attribute__((vector_size(32)))` and `(64)`.
#
# WHAT ONLY A FOREIGN TOOLCHAIN CAN SAY. mach's caller and callee agree with each
# other by construction, so a placement wrong on both sides is invisible to every
# mach-only fixture. The `next` argument after every vector lands where the
# convention says only if the vector consumed exactly what the convention says:
#   - System V: MEMORY class, the bytes on the stack at the vector's C alignment,
#     so after one integer (`c_v8`) the vector is at sp+0 and `b` stays in rdx;
#     after six (`c_six`) the vector is at sp+0 and `next` at sp+32; after seven
#     (`c_seven`) the seventh is at sp+0, the vector rounds up to sp+32 and `next`
#     is at sp+64; a float on each side (`c_fmix`) leaves the xmm bank untouched;
#     the 64-byte `c_v16` rounds to 64. A return is the hidden result pointer.
#   - Win64: a pointer to a caller copy, and caller-provided result storage.
#   - AAPCS64 (linux and darwin) and LP64D: a pointer to a caller copy in the
#     next integer register, and the indirect result register for a return.
# clang returns a System V wide vector in xmm0:xmm1 against the psABI; the probe
# declares the result as the record of the same extent under clang on System V,
# which clang returns as MEMORY (see doc/language/ext-fun.md). Both directions
# run: mach calls C with each shape and reads each return back from C, then C
# calls mach with the same shapes and reads what mach returns. -O0 keeps every C
# read in place.
run: exec
