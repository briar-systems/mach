# A C-variadic `ext fun` called against a C object the RUNNER's own toolchain built,
# so the va_arg side is the platform's real ABI rather than mach's model of it. This
# is the case that fails on aarch64-darwin without #2575: Apple's arm64 ABI passes
# every variadic argument on the stack, so a register-placed one is read as a wrong
# VALUE, which only executing against real clang output can catch.
#
# Runs natively on the two macOS legs (the arm64 one is the divergence, the Intel one
# the SysV control) and on both linux legs (aarch64-linux is the same AAPCS64 vtable
# WITHOUT the divergence, so the two arm64 legs cross-check each other) - both cross-
# compile the probe object through test/link/lib/cc.sh when the runner's own `cc` can't
# target the leg (mach#2741), and both match the golden.
#
# riscv64-linux runs since #2771. the RISC-V psABI passes an UNNAMED float in an
# integer register even under the hard-float members, so the riscv family declares
# `variadic_float_bits = 0` and the tail classifier routes every variadic float to
# the a bank the probe's `va_arg` actually reads. before that the caller placed
# them in fa0-fa7 and every float came back as flat 0.
#
# exempt windows: `[step]` now runs there (#2578/#2587 fixed it), but this case has
# not yet been verified against the windows-latest runner's own C toolchain (does it
# expose a bare `cc`, and does it target win64 the way this case needs?). Re-enable
# once that's confirmed rather than guessing at it here; win64's variadic rule (a
# tail float duplicated into its integer register) is otherwise exercised only by
# the compiler's own unit tests.
run: exec
skip: x86_64-windows
