[project]
id = "provider"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

# a vendored static input carrying a logical name. it IS in the consumer's
# effective link set; it just defines symbols rather than importing them.
[link.p]
source = "local"
path = "{project.out}/vendor/provider/provider.o"
library = "provider-lib"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true

[step.provider]
argv = ["sh", "build.sh", "{project.out}/vendor/provider/provider.o"]
in = ["build.sh", "provider.c"]
out = ["{project.out}/vendor/provider/provider.o"]
need = []
