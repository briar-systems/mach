[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

# riscv64-only: this case is compiled by the riscv64-hosted compiler under qemu
# (see case.conf `self-host`), so it never targets another format.
[target.riscv64-linux]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../../../../dep/std"
