# a consumer's own `#[library("mathlib")]` binds against the `export = true` entry a
# path dependency declares, with nothing but a `dep` entry in the consumer's manifest.
#
# THIS CASE PASSES ON THE COMPILER THAT INTRODUCED IT, AND THAT IS THE POINT. it is
# not a fix's regression guard; it pins a guarantee doc/manifest.md states twice - an
# exported entry applies to any project linking this project's modules, so a platform
# link requirement lives once in the manifest that needs it - which nothing else in the
# suite asserts. the guarantee is invisible to any single-project build: every axis of
# it (the cascade, the logical name, the consumer-side decorator) needs two manifests
# to exist at once, so a unit test cannot reach it and only a case shaped like this can.
#
# #2800 was filed believing this path was broken. it was not - the reporter's import
# named a symbol that does not exist (`glfwGetInstanceProcAddr` for GLFW's
# `glfwGetInstanceProcAddress`) and a misleading linker diagnostic pointed at the
# cascade. that investigation cost a day for want of exactly this case. do not delete
# it for passing.
run: exec
legs: x86_64-linux
