[project]
id = "provider"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[step.libdemo]
argv = ["sh", "build.sh", "{project.out}/lib/libdemo.so.1"]
in = ["build.sh", "demo.c"]
out = ["{project.out}/lib/libdemo.so.1"]
need = []

# the platform link requirement lives once, here, and cascades to consumers.
# the logical name is what a consumer's #[library("demomath")] must resolve
# against. the file is a fixture-built shared library the step above compiles,
# never a host system library (REM-141).
[link.m]
source = "local"
path = "{project.out}/lib/libdemo.so.1"
library = "demomath"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true
