[project]
id = "provider"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

# the platform link requirement lives once, here, and cascades to consumers. the
# logical name is what a consumer's #[library("mathlib")] must resolve against.
[link.m]
source = "system"
name = "m"
library = "mathlib"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true
