# a data import a shared library provides, read and written in place and through
# its taken address (mach #4035).
#
# lowering marks an import's operand for its GOT slot. x86-64 honoured the mark
# only for an address taken with lea, and encoded a load or store of the import as
# a direct [rip + sym] reference, which the linker bound to the import's call stub:
# the program linked and read the stub's bytes as the value.
legs: x86_64-linux
