# Tags whose unit cases outnumber their bytes across an `ext` boundary against a C callee
# and a C caller the RUNNER'S own toolchain built (mach #3400). A unit case is a
# zero-width member, so sixteen of them add no bytes and change no C spelling: the tag is
# still `struct { D d; union { ... } u; }` with only the payload cases in the union. Three
# shapes: sixteen unit cases ahead of an integer payload in the second eightbyte, the
# same with a float payload, and an outer tag whose case holds a tag of thirteen unit
# cases and a four-byte payload, the shape that found it.
#
# WHAT ONLY A FOREIGN TOOLCHAIN CAN SAY. System V classification used to collect members
# into a list of sixteen and drop the rest, so the payload eightbyte of every shape here
# classified as empty on both mach sides at once and mach agreed with itself while moving
# half the value. The `next` argument after every tag lands where the convention says
# only if the tag consumed exactly the registers the convention says.
#
# Both directions run: mach calls C with each shape and reads each shape back from C,
# then C calls mach with the same shapes and reads what mach returns. -O0 keeps every
# C field read in place.
run: exec
