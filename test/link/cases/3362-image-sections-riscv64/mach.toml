[project]
id = "3362imagesectionsriscv64"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.freestanding-riscv64]
isa  = "riscv64"
os   = "freestanding"
abi  = "lp64"
of   = "elf"
base = 0x80200000

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.3362imagesectionsriscv64]
kind = "bin"
entry = "main.mach"
out = "bin/3362imagesectionsriscv64.elf"
targets = ["*"]
link = []
need = []
