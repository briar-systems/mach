# a -g spirv build writes the core debug model into the module: OpString and OpSource for
# the files, OpName and OpMemberName for functions, variables and the uniform record, and
# OpLine for the instructions (#3398).
#
# THE NAMES AND FILES ARE THE OBSERVABLE, validated against vulkan1.3. a debug model the
# validator accepts can still name nothing, attribute every line to the wrong file or lose
# a callee drawn in from another module, and each of those changes the listing.
legs: x86_64-linux
target: spirv
