[project]
id = "case"
version = "0.0.0"
src = "src"
# a fixed output root, so the producer finds the modules under the directory `-o` names
out = "out/link"

# both profiles request debug info: O0 keeps every local, O2 inlines and still has to
# attribute the result to the right files and lines
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = true
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = []
need = []
