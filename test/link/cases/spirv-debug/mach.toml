[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
# a fixed output root, so the producer finds the modules under the directory `-o` names
work = "out/link"

# both profiles request debug info: O0 keeps every local, O2 inlines and still has to
# attribute the result to the right files and lines
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = true
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = []
need = []
