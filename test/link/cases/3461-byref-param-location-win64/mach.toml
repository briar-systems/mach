[project]
mach = ">=5"
id = "byrefparamwin64"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.byrefparamwin64]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/byrefparamwin64"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../../../../dep/std"
