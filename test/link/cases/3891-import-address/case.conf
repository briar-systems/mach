# a function import's address taken rather than called, bound to the library that
# provides it at run time (mach #3891).
#
# x86-64 takes a function's address with RK_PC32, a kind the linker already bound to
# the import's call stub as it binds a call. aarch64 takes it with an adrp+add pair
# (RK_PAGE21, RK_ADD_LO12) and riscv64 with auipc+addi (RK_PCREL_HI20,
# RK_PCREL_LO12_I), which the linker bound to nothing: a link on those legs refused
# the import as "pinned to library 'probe' not among the link's dependencies" while
# naming 'probe' as provided.
#
# the program takes both imports' addresses: it calls through them from mach, and
# hands one to C as a callback. the observable is the values each call returned.
legs: x86_64-linux aarch64-linux riscv64-linux
