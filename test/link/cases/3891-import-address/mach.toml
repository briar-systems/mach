[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.aarch64-linux]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.riscv64-linux]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

# lld links the fixture on every leg: the riscv64 leg is a cross build, which the
# host's own linker cannot link
[step.probe]
argv = ["sh", "../../cc.sh", "-shared", "-fPIC", "-nostdlib", "-O1", "-fuse-ld=lld", "-Wl,-soname,libprobe.so", "probe.c", "-o", "{project.out}/lib/libprobe.so"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.c"]
out = ["{project.out}/lib/libprobe.so"]
need = []

[link.probe]
source = "local"
path = "{project.out}/lib/libprobe.so"
library = "probe"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe"]
need = []

[dep.std]
path = "../../../../dep/std"
