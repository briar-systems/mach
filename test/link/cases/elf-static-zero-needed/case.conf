# REM-141: an ordinary linux binary - no --pie, no [link.X] entry, nothing but
# std.print - must emit no dynamic dependency at all. this is the direct,
# unconditional twin of pie-reloc/pie-relro-fault/elf-relro's self-relocating
# --pie guard: those prove the --pie startup path stays libc-free once a
# runtime relocation is in play, this proves the plain default build never
# introduces a dynamic dependency in the first place.
run: elf-needed
legs: x86_64-linux
