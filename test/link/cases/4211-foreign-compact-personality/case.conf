# A C++ exception thrown through a mach frame and caught by a C++ function that
# only its object's compact unwind describes (mach #4211). mach calls
# `cxx_catch`, which calls back into mach, which calls `cxx_throw`. The throw
# unwinds through the mach frame and is caught in `cxx_catch`.
#
# The C++ object is compiled with `-femit-dwarf-unwind=no-compact-unwind`, so
# `cxx_catch` has no `__eh_frame` description to carry its personality and lsda.
# libunwind finds its handler only through the image's `__unwind_info`
# personality table and lsda index.
run: exec
legs: aarch64-darwin x86_64-darwin
