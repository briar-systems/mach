[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

# compact unwind alone describes the object's functions: no __eh_frame
# description carries the catch's personality and lsda
[step.probe]
argv = ["sh", "../../cc.sh", "-c", "-O2", "-femit-dwarf-unwind=no-compact-unwind", "probe.cpp", "-o", "{project.out}/obj/probe.o"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.cpp"]
out = ["{project.out}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.out}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

# the C++ runtime's throw, catch and personality, and a two-level namespace
# attributes every import to its library
[link.cxxabi]
source = "system"
name = "/usr/lib/libc++abi.dylib"
library = "libc++abi"
symbols = ["__cxa_allocate_exception", "__cxa_throw", "__cxa_begin_catch", "__cxa_end_catch", "__gxx_personality_v0", "_ZTIx"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe", "cxxabi"]
need = []

[dep.std]
path = "../../../../dep/std"
