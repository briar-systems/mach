# f16 across an `ext` boundary against a C `_Float16` callee and a C caller the
# RUNNER'S own toolchain built (mach #3800).
#
# mach's caller and callee agree with each other by construction, so a placement
# wrong on both sides is invisible to every mach-only fixture. Each convention
# places `_Float16` as a float of two bytes:
#   - System V: SSE class, the low 16 bits of an xmm register; `c_nine`'s ninth
#     goes to the stack. A record's f16 members make its eightbyte SSE (`H2`,
#     `HF`, `H4`, both eightbytes of `H5`), and one shared with an `int` is
#     INTEGER (`HI`).
#   - Win64: the xmm register of its positional slot, xmm0 for a result, as
#     clang places `_Float16` on the Microsoft convention. A record of 1, 2, 4
#     or 8 bytes rides its integer slot as ever. mingw-w64 GCC, which the
#     windows runner's `cc` resolves to, places a scalar `_Float16` as a 2-byte
#     integer instead. Under GCC on windows the probe declares each scalar as a
#     `float` holding the f16 in its low 16 bits, which GCC places as clang
#     places the `_Float16` (see doc/language/ext-fun.md).
#   - AAPCS64 (linux and darwin): an h register; `H2` and `H4` are HFAs of two
#     and four two-byte members, `HF` and `H5` are not.
#   - LP64D: an f register, NaN-boxed; `H2` and `HF` are two float leaves, `HI` a
#     float and an integer leaf.
# `c_scalars` interleaves f16 with integers, an f64 and an f32 so each bank's
# cursor is checked. Both directions run: mach calls C with each shape and reads
# each return back from C, then C calls mach with the same shapes and checks
# what mach returns. -O0 keeps every C read in place, and C builds and reads each
# f16 as its bits, so no conversion helper is linked.
run: exec
