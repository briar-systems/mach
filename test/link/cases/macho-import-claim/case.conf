# a [link.X]'s `symbols` claim must attribute an undefined import on Mach-O, and
# route it to that entry's dylib (#2636). The claim is written in `mach.toml` as a
# SOURCE-level name; the object symbol darwin's C ABI emits is `_`-prefixed, and
# registering the manifest spelling verbatim meant the claim keyed `Sleep` while
# the linker asked for `_Sleep`. So the claim attributed nothing and the link
# failed with the very "no #[library] attribution" error the claim exists to
# prevent - #2510's feature simply did not work on darwin.
#
# Cross-build the darwin image on the x86_64-linux leg and read its bind tables host-side
# with llvm-objdump, as macho-got does; no darwin runner is needed, and no dylib is
# opened at link time on any host.
#
# Two dylibs are deliberate, for the reason pe-import-claim gives: with one
# dependency a linker that bound every import to the first would still produce the
# expected table, so the case would pass while routing was broken. Splitting the
# claims across two makes the per-dylib binding the observable.
run: macho-imports
legs: x86_64-linux
target: x86_64-darwin
