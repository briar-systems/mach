[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[link.shim]
source = "local"
path = "shim.o"
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["shim"]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
