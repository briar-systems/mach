[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[link.provider]
source = "local"
path = "provider.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "shared"
entry = "lib.mach"
out = "{project.work}/lib/case.so"
targets = ["*"]
link = ["provider"]
need = []

[dep.std]
path = "../../../../dep/std"
