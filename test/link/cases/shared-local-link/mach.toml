[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[link.provider]
source = "local"
path = "provider.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "shared"
entry = "lib.mach"
out = "lib/case.so"
targets = ["*"]
link = ["provider"]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
