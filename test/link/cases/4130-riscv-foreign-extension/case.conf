# a C object built with -march=rv64gc_zfh links with mach code and runs (mach #4130).
#
# the object's .riscv.attributes names zfh and zfhmin, which mach has no codegen
# for and no riscv64 target selects. the linker merges its arch string into the
# output's by the psABI union and refuses only a real conflict (another XLEN,
# another float ABI, RV32E/RV64E, a malformed section), so the link succeeds, and
# the C side's half-precision instructions run under qemu-riscv64. riscv64 only:
# no other leg has a .riscv.attributes to merge.
legs: riscv64-linux
