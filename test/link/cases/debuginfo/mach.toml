[project]
id = "dbgcase"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.aarch64-linux]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.riscv64-linux]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.dbgcase]
kind = "bin"
entry = "main.mach"
out = "bin/dbgcase"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../../../../dep/std"
