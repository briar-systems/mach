[project]
id = "prov"
version = "0.0.0"
mach = ">=5"
src = "src"
work = "out/{target.name}/{profile.name}"

[link.kernel32]
source = "system"
name = "kernel32.dll"
symbols = ["Sleep"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.advapi32]
source = "system"
name = "advapi32.dll"
symbols = ["RegCloseKey"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[profile.debug]
optimize = false
debug = false
simd = "scalarize"
