[project]
id = "prov"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[link.kernel32]
source = "system"
name = "kernel32.dll"
library = "kernel32"
symbols = ["Sleep"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.advapi32]
source = "system"
name = "advapi32.dll"
library = "advapi32"
symbols = ["RegCloseKey"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true
