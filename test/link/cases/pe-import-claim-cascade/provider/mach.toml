[project]
id = "prov"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[link.kernel32]
source = "system"
name = "kernel32.dll"
symbols = ["Sleep"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.advapi32]
source = "system"
name = "advapi32.dll"
symbols = ["RegCloseKey"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[profile.debug]
opt = 0
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false
