[project]
id = "prov2"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[link.kernel32]
source = "system"
name = "kernel32.dll"
library = "kernel32"
symbols = ["GetTickCount"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true

[link.advapi32]
source = "system"
name = "advapi32.dll"
library = "advapi32"
symbols = ["RegFlushKey"]
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = true
