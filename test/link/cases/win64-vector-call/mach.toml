[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[step.probe]
argv = ["sh", "../../lib/cc.sh", "-c", "-O1", "-fno-stack-protector", "probe.c", "-o", "{project.out}/obj/probe.o"]
env = { PATH = "/usr/local/bin:/usr/bin:/bin", MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.c"]
out = ["{project.out}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.out}/obj/probe.o"
os = ["windows"]
isa = ["x86_64"]
abi = ["win64"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe"]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
