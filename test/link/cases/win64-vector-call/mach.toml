[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[step.probe]
argv = ["sh", "../../cc.sh", "-c", "-O1", "-fno-stack-protector", "probe.c", "-o", "{project.work}/obj/probe.o"]
env = { MACH_TARGET_ISA = "{target.isa}", MACH_TARGET_OS = "{target.os}", MACH_TARGET_ABI = "{target.abi}" }
in = ["probe.c"]
out = ["{project.work}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.work}/obj/probe.o"
os = ["windows"]
isa = ["x86_64"]
abi = ["win64"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["probe"]
need = []

[dep.std]
path = "../../../../dep/std"
