[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[link.shim]
source = "local"
path = "{project.out}/obj/bsd-ar/libshim.a"
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["shim"]
need = []

[step.shim]
argv = ["bash", "build-archive.sh", "{project.out}/obj/bsd-ar/libshim.a"]
in = ["build-archive.sh", "shim.s"]
out = ["{project.out}/obj/bsd-ar/libshim.a", "{project.out}/obj/bsd-ar/foreign-object-with-long-name.o"]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
