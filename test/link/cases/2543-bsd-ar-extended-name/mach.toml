[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[link.shim]
source = "local"
path = "{project.work}/obj/bsd-ar/libshim.a"
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["shim"]
need = []

[step.shim]
argv = ["bash", "build-archive.sh", "{project.work}/obj/bsd-ar/libshim.a"]
in = ["build-archive.sh", "shim.s"]
out = ["{project.work}/obj/bsd-ar/libshim.a", "{project.work}/obj/bsd-ar/foreign-object-with-long-name.o"]
need = []

[dep.std]
path = "../../../../dep/std"
