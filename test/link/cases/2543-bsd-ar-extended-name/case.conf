# Build a Darwin executable on the Linux leg and inspect its Mach-O header
# host-side. The required foreign function lives only in the llvm-ar Darwin
# archive produced by the manifest step, whose symbol directory and long object
# member both use BSD `#1/<length>` names. The build itself is the regression:
# forwarding either name prefix to the Mach-O parser fails with bad magic.
run: field
legs: x86_64-linux
target: x86_64-darwin
