# an inline asm block that leaves sp lower until the epilogue, which is legal,
# in a frame deep enough that its locals sit beyond the frame pointer's one-word
# reach. the block overwrites every allocatable register, so the scalars live
# across it are spilled to slots below a 512-byte pad and read back after it.
# with sp moved, an sp-relative slot address is wrong, so the frame must not
# declare sp fixed and has to address its slots from the frame pointer.
#
# aarch64 legs only: the sp-moving body is written in aarch64 asm.
legs: aarch64-linux aarch64-darwin
