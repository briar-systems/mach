# a shared library exports the root project's `pub` declarations and the names it
# re-exports with `fwd`, and nothing else (#3412). the case holds every arm of
# that rule at once, because each one is satisfiable by a wrong implementation of
# another: a dependency's `pub` that leaks would look like a re-export working, a
# re-export that silently recorded the mangled name of a renamed declaration
# would look like the rename being honoured, and both read as "the export list is
# fine" unless the list is compared whole.
#
# x86_64-linux only: the C arm links a real consumer against the built `.so` with
# the host `cc` and runs it, which is host-native evidence. the ELF export table
# itself is read by `readelf` the same way on every leg, but nothing about this
# rule is per-ISA, so one leg carries it.
legs: x86_64-linux
