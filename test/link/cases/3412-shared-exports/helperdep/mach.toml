[project]
id = "helperdep"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.helperdep]
kind = "static"
entry = "api.mach"
out = "lib/helperdep"
targets = ["*"]
link = []
need = []
default = true
