[project]
id = "helperdep"
version = "0.0.0"
mach = ">=5"
src = "src"
work = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.helperdep]
kind = "static"
entry = "api.mach"
out = "{project.work}/lib/helperdep"
targets = ["*"]
link = []
need = []
export = true
