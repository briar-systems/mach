[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.case]
kind = "shared"
entry = "lib.mach"
out = "lib/libcase.so"
targets = ["*"]
link = []
need = []

[dep.helperdep]
path = "helperdep"

[dep.std]
path = "../../../../dep/std"
