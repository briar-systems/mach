# tail calls run in constant stack (mach #3417). each recursion below is ten
# million levels deep, which no leg's default stack holds a frame per level
# for, so a run that prints its line proved the calls became a loop or jumps:
#
#   count  self tail recursion, a loop in the middle end
#   parity mutual recursion, a sibling jump each way
#   spread a sibling chain passing ten arguments, the ones past the argument
#          registers written into the caller's own incoming argument area
#   fib    the accumulator form, one call and a loop
#
# release-g is release with -g: debug information changes no code, so the
# same depths run under it.
profiles: release release-g
