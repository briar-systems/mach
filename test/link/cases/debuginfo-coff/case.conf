# binary-inspection case (#3408): a windows image built with -g carries DWARF in its COFF
# sections, and the facts a consumer needs hold over the mach-linked exe. llvm-dwarfdump
# --verify accepts the multi-TU image, llvm-symbolizer resolves a function address to its
# name and source line, and -g perturbs no loadable section.
#
# THE RELOCATIONS ARE WHAT THIS GUARDS. a PE image maps its debug sections at addresses,
# so an offset from one debug section into another has to be section-relative. written as
# an absolute address it points past the image base into nothing, and before #3408 every
# string and range reference in .debug_info did exactly that.
legs: x86_64-linux
target: x86_64-windows
gbuild: yes
