[project]
mach = ">=5"
id = "dbgcoff"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.dbgcoff]
kind = "bin"
entry = "main.mach"
out = "bin/dbgcoff.exe"
targets = ["*"]
link = []
need = []

[dep.std]
path = "../../../../dep/std"
