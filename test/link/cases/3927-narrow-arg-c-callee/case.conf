# Integer arguments narrower than 32 bits across an `ext` boundary against a C callee
# and a C caller the RUNNER'S own toolchain built (mach #3927).
#
# Apple's arm64 ABI makes the caller sign- or zero-extend an argument narrower than
# 32 bits to 32 bits ("Writing ARM64 code for Apple platforms", "Pass arguments to
# functions correctly"), and Apple clang's callees read the 32-bit register without
# extending it again. x86-64 System V does the same in practice: clang's callees read
# the 32-bit register (`movslq %edi` for a signed char) and GCC's callers extend
# (#3951). AAPCS64 elsewhere and Win64 leave the upper bits to the callee.
# mach computes each argument from a runtime u64 whose bits 8 to 31 are not zero, so
# a caller that only truncates leaves them in the register:
#   - `c_narrow`: the C callee sees u8, i8, u16 and i16 and the `next` argument after
#     them, on every leg
#   - `c_widened`: on aarch64-darwin and the System V x86_64 legs the C callee declares
#     the same four parameters as 32-bit integers, so it reads the whole 32-bit
#     register, which those conventions define as the extended value. every other leg
#     declares the narrow types, since its convention defines no upper bits
#   - C calls mach with the same four types (`m_narrow`), so mach's callee reads
#     them back correctly from C's registers
# The unpatched compiler's aarch64-darwin caller moves the 32-bit truncation of each
# sum (`mov w3, w2`, no `uxtb` or `sxtb` in its disassembly), so that leg's C callee
# reads `a=1010580609 b=1010580610 c=1010613249 d=1010613505`, and x86_64-linux read
# `b=130` and `d=1010613505` (debug) before #3951.
run: exec
