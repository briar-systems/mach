# .symtab on a shared object (#2807): the same fixture and the same facts
# test/link/cases/symtab already established for a static executable, built as a
# `kind = "shared"` `.so` instead. #2807 found that a shared object carried NO
# section headers at all (readelf -h reported 0) - a shared object is the
# image a profiler most needs to symbolize, since the interesting frames in a
# mixed process are usually in libraries, and it got none of #2772's benefit.
# only `main` is `pub`, so the shared writer's own export table (.dynsym) claims
# that one name and nothing else (#3412), and the private `burn` this case
# resolves an address inside lands only in `.symtab` - the table this case is
# about, with no second, ambiguous entry for a real consumer to match by
# accident.
#
# runs on every ELF leg (linux, aarch64-linux, riscv64-linux): the facts hold
# identically on every ISA, so the golden is shared.
run: symtab
legs: x86_64-linux aarch64-linux riscv64-linux
