# build the os=freestanding, of=raw flat image on the x86_64-linux leg and run it through
# the C mmap-loader; the observable is the image's exit status, an `#[embed]`ed byte
# plus a computed sum, so it proves both the code and the embedded data (#2507).
run: flat-loader
legs: x86_64-linux
target: freestanding-x86_64
