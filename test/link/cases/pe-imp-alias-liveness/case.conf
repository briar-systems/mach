# a declared import whose only reference anywhere is a foreign object's
# `__imp_` alias (address-taken through a real Clang dllimport call, no direct
# Mach call, no local definition, and its DLL is NOT an explicit [link.X]
# dynlib - the import library alone names it) must still keep its NEEDED entry.
# a liveness gate that matches only the exact canonical name would elide it
# and desync the import table from the loader dependency list.
run: pe-imports
legs: x86_64-linux
target: x86_64-windows
