# a mach object calls hook_add, which an archive member defines only as a COFF
# weak external aliasing `.weak.hook_add.default`, and hook_unused, the same
# shape, goes unreferenced (#4251). the fallback must stay live across objects
# and the unreferenced weak external must import nothing, so the only import
# is the declared ExitProcess.
run: pe-imports
legs: x86_64-linux
target: x86_64-windows
