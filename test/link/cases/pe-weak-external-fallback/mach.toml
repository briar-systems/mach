[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["runtime", "kernel32"]
need = []

[link.runtime]
source = "local"
path = "{project.work}/lib/runtime.lib"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.kernel32]
source = "system"
name = "kernel32.dll"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.runtime]
argv = ["sh", "decode-fixture.sh", "{project.work}/lib/runtime.lib"]
in = ["decode-fixture.sh", "runtime.c", "runtime.o.b64"]
out = ["{project.work}/lib/runtime.lib"]
need = []
