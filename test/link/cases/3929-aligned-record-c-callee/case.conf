# A record whose members give it 16-byte alignment across an `ext` boundary against a
# C callee and a C caller the RUNNER'S own toolchain built (mach #3929).
#
# AAPCS64 C.12 rounds NGRN up to even for a composite of alignment 16, and C.14 aligns
# its stack slot to 16. The alignment is the natural one, the one the members give
# the record, so a record raised to 16 by #[align(16)] alone is neither rounded nor
# 16-aligned on the stack. Apple's arm64 ABI starts a pair in any register (#3922)
# and aligns a record's stack slot to its declared alignment:
#   - after one integer (`c_w`, `W { v: u128 }`): aarch64-linux passes the record in
#     x2:x3 and `next` in x4, aarch64-darwin in x1:x2 and x3
#   - the same through a nested member (`c_n`, a record holding an #[align(16)]
#     record): the member's alignment counts, so it rounds as `c_w` does
#   - raised by #[align(16)] alone (`c_a`): x1:x2 and x3 on both systems
#   - on the stack after eight integers and a byte (`c_as`): aarch64-linux places the
#     #[align(16)] record at sp+8, aarch64-darwin at sp+16
# System V, Win64 and LP64 run the same calls under their own rules. Both directions
# run: mach calls C, then C calls mach with the same shapes. The unpatched compiler
# passed `c_w` and `c_n` in x1:x2 and `c_as`'s record at sp+16, so on aarch64-linux
# (qemu) it printed `w=3090503 n=3090503 a=5090307`, `as=203080700` and
# `c drives mach: 1`.
run: exec
