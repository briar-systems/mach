[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[link.probe-a]
source = "local"
path = "probe-a.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[link.probe-b]
source = "local"
path = "probe-b.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["probe-a", "probe-b"]
need = []

[dep.std]
path = "../../../../dep/std"
