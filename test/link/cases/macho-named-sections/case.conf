# a linked darwin image keeps the (segment, section) identity of its inputs, so a
# runtime that finds content by name finds it: libobjc scans __DATA,__objc_classlist
# and reads __DATA,__objc_imageinfo, and dyld runs __DATA,__mod_init_func (#2606).
#
# two clang objects each contribute to __objc_classlist, so the case also pins that
# same-named inputs are CONCATENATED into one contiguous, pointer-aligned run rather
# than emitted as two sections sharing a name.
#
# the section structure is read host-side on the cheap x86_64-linux leg, and this image is
# never RUN. its objc metadata is synthetic: an __objc_classlist entry has to point
# at a real Objective-C class object, and building one needs the macOS SDK, so the
# markers that make concatenation order checkable here are not addresses. libobjc
# reads that list for real on darwin and dereferences every entry, so the image
# faults before main (#2637). `macho-mod-init` is the executing case, on a payload
# a runtime can act on correctly.
run: macho-sections
legs: x86_64-linux
target: x86_64-darwin
build-flags: --pie
