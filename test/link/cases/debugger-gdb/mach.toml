[project]
id = "dbggdbcase"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
default = true
vectorize = true
float_reassoc = false
opt = 0
debug = false
simd = "scalarize"

[profile.release]
vectorize = true
float_reassoc = false
opt = 2
debug = false
simd = "scalarize"

[artifact.dbggdbcase]
kind = "bin"
entry = "main.mach"
out = "bin/dbggdbcase"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
