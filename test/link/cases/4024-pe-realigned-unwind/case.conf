# A realigned mach frame that saves callee-saved registers, unwound by Windows'
# own unwinder (mach #4024). The frame's unwind info names rbp as its frame
# register, and Windows finds every save from that register, so the prologue
# saves before it realigns rsp. Unwinding it with RtlVirtualUnwind must hand the
# caller back its own nonvolatile registers, stack pointer and return address.
#
# The C driver loads a sentinel into every nonvolatile register before it calls
# the mach function, which holds values across a call into C. That C function
# checks that the mach frame's over-aligned local is aligned, so the frame
# really was realigned, then unwinds its own frame and the mach one and records
# what the caller would see.
#
# x86_64-windows only: RtlVirtualUnwind is the unwinder under test.
legs: x86_64-windows
