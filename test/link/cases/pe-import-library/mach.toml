[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["implib"]
need = []

[link.implib]
source = "local"
path = "{project.out}/lib/libwin.a"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.implib]
argv = ["sh", "mkimplib.sh", "{project.out}/lib/libwin.a"]
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }
in = ["mkimplib.sh"]
out = ["{project.out}/lib/libwin.a"]
need = []
