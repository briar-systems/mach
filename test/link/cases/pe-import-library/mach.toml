[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["implib"]
need = []

[link.implib]
source = "local"
path = "{project.work}/lib/libwin.a"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.implib]
argv = ["sh", "mkimplib.sh", "{project.work}/lib/libwin.a"]
in = ["mkimplib.sh"]
out = ["{project.work}/lib/libwin.a"]
need = []
