# A composite or HFA that goes to the stack gives the rest of its register bank to
# nothing, against a C callee and a C caller the RUNNER'S own toolchain built
# (mach #3928).
#
# AAPCS64 C.13 sets NGRN to 8 once a composite does not fit the general registers
# left, and C.3 sets NSRN to 8 once an HFA or HVA does not fit the vector registers
# left, so every later argument of that bank goes to the stack too. Each shape leaves
# exactly one register free that the next argument would take if the bank were not
# exhausted:
#   - `c_s`: seven integers, a 12-byte record that needs a pair where only x7 is
#     left, and `n`. C reads `n` from the stack after the record, not from x7
#   - `c_sd`: the same with a double between them, which still takes d0, since the
#     vector bank is untouched
#   - `c_h`: six doubles, a three-double HFA where only d6 and d7 are left, and `n`.
#     C reads `n` from the stack after the HFA, not from d6
#   - `c_hg`: the same with a two-float HFA that would fit d6 and d7 but goes to the
#     stack as well
# System V, Win64 and LP64 run the same calls under their own rules. Both
# directions run: mach calls C, then C calls mach with the same shapes. The unpatched
# compiler passed `n` in x7 or d6, so on aarch64-linux (qemu) it printed
# `s=50307 sd=950307`, `h=43206 hg=2480706` and `c drives mach: 1`.
run: exec
