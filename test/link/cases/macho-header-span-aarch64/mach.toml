[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["System", "objc", "cxx", "iconv", "z", "xml2", "bz2", "curses"]
need = []

[link.System]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
symbols = []
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[link.objc]
source = "system"
name = "/usr/lib/libobjc.A.dylib"
symbols = []
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[link.cxx]
source = "system"
name = "/usr/lib/libc++.1.dylib"
symbols = []
os = ["darwin"]
isa = ["*"]
