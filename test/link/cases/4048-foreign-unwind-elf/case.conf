# A backtrace through C functions linked into a mach ELF executable (mach #4048).
# mach calls C, which calls back into mach, and gdb stops in the innermost mach
# function and walks out. `c_middle` is compiled C, and `c_dwarf` is assembly
# that keeps the caller's stack pointer in a callee-saved register, so no
# prologue reading finds its caller: gdb reaches `c_middle` and the frames past
# it only through the `.eh_frame` description the object carried into the image.
# The check also holds every function a frame description covers to a row of
# `.eh_frame_hdr`'s search table, the index a runtime unwinder searches.
#
# The runtime unwinders walk the same chain on darwin and windows in
# test/link/cases/4048-foreign-unwind. A linux image mach links carries no C
# runtime to unwind with, so gdb is the unwinder here.
legs: x86_64-linux aarch64-linux
