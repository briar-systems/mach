[project]
id = "provider"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

# a vendored static input carrying a logical name. it IS in the consumer's
# effective link set; it just defines symbols rather than importing them.
[link.p]
source = "local"
path = "{project.out}/vendor/provider/provider.o"
library = "provider-lib"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true

# an unrelated dynamic dependency. it provides nothing this build imports; it is
# here only so the link has a dynamic half, which is what used to change the
# wording. the file is a fixture-built shared library the step below compiles,
# never a host system library (REM-141) - a synthetic soname proves the wording
# is decided by the presence of A dynamic half, not by what it is.
[link.m]
source = "local"
path = "{project.out}/lib/libdemo.so.1"
library = "demomath"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true

[step.provider]
argv = ["sh", "build.sh", "{project.out}/vendor/provider/provider.o"]
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }
in = ["build.sh", "provider.c"]
out = ["{project.out}/vendor/provider/provider.o"]
need = []

[step.libdemo]
argv = ["sh", "libdemo-build.sh", "{project.out}/lib/libdemo.so.1"]
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }
in = ["libdemo-build.sh", "demo.c"]
out = ["{project.out}/lib/libdemo.so.1"]
need = []
