[project]
mach = ">=5"
id = "case"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.x86_64-windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/case"
targets = ["*"]
link = ["alias", "alias-two", "implib", "comdat-winner", "comdat-loser", "provider"]
need = []

[link.alias]
source = "local"
path = "{project.work}/obj/foreign/alias.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.alias-two]
source = "local"
path = "{project.work}/obj/foreign/alias-two.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.implib]
source = "local"
path = "{project.work}/lib/liblocal.a"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.comdat-winner]
source = "local"
path = "{project.work}/obj/foreign/comdat-winner.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.comdat-loser]
source = "local"
path = "{project.work}/obj/foreign/comdat-loser.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.provider]
source = "local"
path = "{project.work}/obj/foreign/provider.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.foreign]
argv = ["sh", "decode-fixture.sh", "{project.work}/obj/foreign"]
in = ["decode-fixture.sh", "alias.c", "alias-two.c", "comdat-winner.cpp", "comdat-loser.cpp", "provider.c", "alias.o.b64", "alias-two.o.b64", "comdat-winner.o.b64", "comdat-loser.o.b64", "provider.o.b64"]
out = ["{project.work}/obj/foreign/alias.o", "{project.work}/obj/foreign/alias-two.o", "{project.work}/obj/foreign/comdat-winner.o", "{project.work}/obj/foreign/comdat-loser.o", "{project.work}/obj/foreign/provider.o"]
need = []

[step.implib]
argv = ["sh", "mkimplib.sh", "{project.work}/lib/liblocal.a"]
in = ["mkimplib.sh"]
out = ["{project.work}/lib/liblocal.a"]
need = []
