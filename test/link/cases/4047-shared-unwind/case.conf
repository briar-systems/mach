# A backtrace through a mach shared library, taken by the unwinder a C program
# links against (mach #4047). A C consumer calls into the library, where mach
# calls C that calls back into mach, and the innermost mach function has the
# consumer walk the stack with libgcc's `_Unwind_Backtrace`, recording where
# each frame's function starts. The unwinder finds the library's frames only
# through its PT_GNU_EH_FRAME search table, so reaching the outer mach function
# and the consumer's `main` proves every frame between is described: the mach
# ones from their frame records, `c_middle` and `c_dwarf` from the `.eh_frame`
# their object carried in (#4048). `c_dwarf` keeps its caller's stack pointer in
# a callee-saved register, which only its frame description says.
#
# The ELF legs with a native C toolchain: Mach-O and PE have no shared-library
# writer yet (#3781, #3783).
legs: x86_64-linux aarch64-linux
