[project]
id = "provider"
version = "0.0.0"
mach = ">=5"
src = "src"
work = "out/{target.name}/{profile.name}"

[link.provider]
source = "local"
path = "{project.work}/vendor/provider/provider.o"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true

[step.provider]
argv = ["sh", "build.sh", "{project.work}/vendor/provider/provider.o"]
in = ["build.sh", "provider.c"]
out = ["{project.work}/vendor/provider/provider.o"]
need = []

[profile.debug]
optimize = false
debug = false
simd = "scalarize"
