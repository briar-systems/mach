[project]
id = "provider"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[link.provider]
source = "local"
path = "{project.out}/vendor/provider/provider.o"
os = ["linux"]
isa = ["*"]
abi = ["*"]
export = true

[step.provider]
argv = ["sh", "build.sh", "{project.out}/vendor/provider/provider.o"]
in = ["build.sh", "provider.c"]
out = ["{project.out}/vendor/provider/provider.o"]
need = []
