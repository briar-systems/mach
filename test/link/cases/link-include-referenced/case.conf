# a [link.X] entry with `include = "referenced"` still resolves to a real
# dynamic dependency and participates in attribution exactly like an explicit
# ("always") entry - it just does not force a NEEDED unconditionally. this
# consumer genuinely calls the pinned symbol, so the produced image must both
# carry a real-soname NEEDED for it and actually run: the referenced-mode
# lookup has to hand back the provider's own soname, not the "demomath"
# logical pin the decorator names, or the loader fails to find it (mach-std's
# bare `#[library("libc")]` pin was exactly this bug before include="referenced").
#
# the dependency is a fixture-built shared library the provider's own [step]
# compiles (REM-141: a linux fixture links only what it builds itself, never a
# host system library), so the NEEDED and the runtime resolution are both
# proven against an artifact this case owns.
#
# the entry is declared in a path dependency and cascades via export=true,
# the same shape 2800-cascade-library-attribution already proves for an
# "always" entry - this case is that one's referenced-mode twin.
run: exec
legs: x86_64-linux
