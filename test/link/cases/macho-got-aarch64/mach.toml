[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.aarch64-darwin]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["libsystem"]
need = []

[link.libsystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
library = "libSystem"
symbols = ["__stderrp"]
os = ["darwin"]
isa = ["*"]
abi = ["*"]
export = false

[dep.std]
path = "../../../../dep/std"
