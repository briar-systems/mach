# an `ext val` data import on aarch64-darwin (#3675). the aarch64 lowering reads
# imported data through the GOT (adrp/ldr with the GOT kinds), and the Mach-O
# writer had no ARM64_RELOC_GOT_LOAD_PAGE21/PAGEOFF12 to carry it, so every
# `ext val` failed to emit. cross-built and structurally inspected on the linux
# leg: the object's relocation records, the linker-owned __DATA_CONST slots that
# point at the two cells another object defines (rebased), and the import slot
# after them in the same __got that dyld binds to libSystem's `__stderrp`. on a native arm64 macOS leg the same
# image is also executed and its values compared with the runtime contract.
legs: x86_64-linux aarch64-darwin
target: aarch64-darwin
