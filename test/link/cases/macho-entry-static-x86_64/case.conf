# Execute a non-PIE (LC_UNIXTHREAD) darwin x86_64 image on the native Intel macOS
# leg and assert the same argument block its `--pie` sibling asserts. This is the
# layout darwin x86_64 defaults to today; the pair is what keeps the entrypoint
# from being fixed for one load command by breaking the other.
run: exec
legs: x86_64-darwin
