# the target registry: one row per registered target, and the single source of
# truth for how each one is built, executed and decoded. the driver generates its
# manifest from these columns, so registering a target is this row and nothing else.
#
# columns (whitespace-separated, note runs to end of line):
#   name    the corpus target name, also the CI leg identifier
#   isa     manifest [target.<name>].isa
#   os      manifest [target.<name>].os
#   abi     manifest [target.<name>].abi
#   of      manifest [target.<name>].of, or - to take the os default
#   kind    bin (linked executable or finished module) | static (archive)
#   entry   hosted       the driver's std.runtime entry that prints the checksum
#           direct       the case file is the artifact entry, and nothing executes
#           freestanding the driver's bare _start entry that sinks the checksum
#   engine  native | qemu:<command> | none. `none` is a public label, not a default:
#           a target carrying it has no layer C column and the matrix says so.
#   disasm  the external decoder layer B diffs against the golden
#   runner  the CI runner label the leg executes on, or - when it has no leg yet
#   note    why the row reads the way it does
#
# name            isa      os            abi      of   kind    entry         engine             disasm        runner            note
x86_64-linux      x86_64   linux         sysv64   -    bin     hosted        native             llvm-objdump  ubuntu-latest     the primary host and the leg that also carries the spirv and mos6502 columns
aarch64-linux     aarch64  linux         aapcs64  -    bin     hosted        native             llvm-objdump  ubuntu-24.04-arm  native arm silicon: qemu cannot settle aapcs64 or page-size questions
riscv64-linux     riscv64  linux         lp64d    -    bin     hosted        qemu:qemu-riscv64  llvm-objdump  ubuntu-latest     compute evidence only, never ABI evidence
riscv32           riscv32  freestanding  ilp32d   elf  static  direct        none               llvm-objdump  ubuntu-latest     linux declares no riscv32 support and freestanding ships no runtime, so nothing can execute it yet
x86_64-windows    x86_64   windows       win64    -    bin     hosted        native             llvm-objdump  windows-latest    no wine, anywhere, ever
x86_64-darwin     x86_64   darwin        sysv64   -    bin     hosted        native             llvm-objdump  macos-15-intel    main cadence
aarch64-darwin    aarch64  darwin        aapcs64  -    bin     hosted        native             llvm-objdump  macos-15          main cadence
spirv             spirv    freestanding  spirv    -    bin     direct        none               spirv-dis     ubuntu-latest     a finished GPU module, not a machine: layers A and B only
mos6502           mos6502  freestanding  mos6502  -    bin     freestanding   none              da65          ubuntu-latest     layers A and B only, and promoting it to an execution engine is follow-up work
