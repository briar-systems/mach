# the external oracles, pinned. the driver verifies every row it is about to depend
# on before it runs anything, and refuses to start rather than produce a result an
# unpinned tool could have shaped. a row is only checked when the selected targets
# and layers actually reach it, so a host missing a tool no selected leg needs is
# not blocked by it.
#
# rows:
#   tool <name> <rule> <want> <probe-args...>
#     rule major  the leading version component must equal <want>
#     rule exact  the leading components must equal <want> exactly
#     rule min    the version must be at least <want>
#   disasm-flags <tool> <flags...>
#     the exact layer B flag set. it lives here rather than in the driver because a
#     golden is only reproducible against a named tool AND a named flag set, and one
#     source of truth for both is what makes re-blessing a reviewable diff.
#   cflags <mode> <flags...>
#     how the host C reference is built. -ffp-contract=off is not a preference: a
#     fused multiply-add in the reference and not in mach would make the anchor
#     disagree on rounding rather than on semantics.
#
# recorded on a linux x86_64 host, 2026-08-08. da65 (cc65) has no entry because
# nothing in the corpus reaches it yet: mos6502 is fully skipped for a compiler
# reason (golden/mos6502/SKIPS), so pinning a version this repo has never run
# against would be a claim rather than a record.

tool llvm-objdump   major 22      --version
tool llvm-readobj   major 22      --version
tool llvm-dwarfdump major 22      --version
tool spirv-val      exact 2026.3  --version
tool spirv-dis      exact 2026.3  --version
tool cc             min   9       --version
tool qemu-riscv64   min   8       --version
tool qemu-riscv32   min   8       --version

# --symbolize-operands replaces every branch and call target with a local label, and
# --no-leading-addr drops the address column, so the golden holds instructions and
# operands only and never churns on a layout shift that changed no code.
disasm-flags llvm-objdump -d --no-leading-addr --no-show-raw-insn --symbolize-operands
disasm-flags spirv-dis    --no-color --no-indent

cflags O0    -std=c11 -O0 -ffp-contract=off -Wall -Wextra
cflags O2    -std=c11 -O2 -ffp-contract=off -Wall -Wextra
cflags ubsan -std=c11 -O0 -ffp-contract=off -fsanitize=undefined -fno-sanitize-recover=all
