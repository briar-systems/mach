[project]
id = "mach"
version = "6.7.3"
mach = "^6"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.windows-x86_64]
isa  = "x86_64"
os   = "windows"
abi  = "win64"
# 8 MiB, the linux and darwin main-thread default, so every host starts the
# compiler and its tests on the same stack
stack_reserve = 0x800000

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.mach]
kind = "bin"
default = true
entry = "bin/main.mach"
out = "bin/mach"
targets = ["linux-x86_64", "linux-arm64", "linux-riscv64", "darwin-x86_64", "darwin-aarch64"]
link = []
need = []

[artifact.mach-windows]
kind = "bin"
default = true
entry = "bin/main.mach"
out = "bin/mach.exe"
targets = ["windows-x86_64"]
link = []
need = []

# the test-only modules no compiler entry reaches; `mach test . -a tests` runs them
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "lib/tests"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.4.1"
