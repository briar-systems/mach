[project]
id = "mach"
version = "5.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.windows-x86_64]
isa  = "x86_64"
os   = "windows"
abi  = "win64"
# the sweep cases in stack_probe_runtime recurse past the 1 MiB PE default,
# and the compiler itself recurses on real inputs (#3091). the parser descends
# MAX_NEST_DEPTH (2048) levels before it refuses, and at O2 one statement level
# (parse_stmt, parse_stmt_body, parse_if_stmt, parse_block_stmt) costs 4208
# bytes of win64 frame, 8.2 MiB in all, past the 8 MiB linux default that the
# sysv frames (3568 bytes, 7.0 MiB) fit under. reserve is address space, not
# memory, so hold twice the bound's worst case (#3325).
stack_reserve = 0x1000000

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.mach]
kind = "bin"
entry = "bin/main.mach"
out = "bin/mach"
targets = ["linux-x86_64", "linux-arm64", "linux-riscv64", "darwin-x86_64", "darwin-aarch64"]
link = []
need = []

[artifact.mach-windows]
kind = "bin"
entry = "bin/main.mach"
out = "bin/mach.exe"
targets = ["windows-x86_64"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v2.0.0"
