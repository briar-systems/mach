[project]
id = "mach"
version = "6.10.1"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.windows-x86_64]
isa  = "x86_64"
os   = "windows"
abi  = "win64"
env  = "msvc"
# 8 MiB, the linux and darwin main-thread default, so every host starts the
# compiler and its tests on the same stack
stack_reserve = 0x800000

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"
env = "macos"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"
env = "macos"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.mach]
kind = "bin"
default = true
entry = "bin/main.mach"
out = "{project.work}/bin/mach{artifact.suffix}"
targets = ["*"]
link = []
need = []

# mach.lang.editor, which only mach-lsp reaches: built so the compiler's own checks cover it
[artifact.editor]
kind = "static"
entry = "lib/editor.mach"
out = "{project.work}/lib/editor"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.yaml]
git = "https://github.com/briar-systems/mach-yaml"
ref = "branch/dev"

[dep.mink]
git = "https://github.com/briar-systems/mink"
ref = "branch/dev"

[dep.masc]
git = "https://github.com/briar-systems/masc"
ref = "branch/dev"

[dep.mirl]
git = "https://github.com/briar-systems/mirl"
ref = "branch/dev"

[dep.deflate]
git = "https://github.com/briar-systems/mach-deflate"
ref = "branch/dev"

[dep.zstd]
git = "https://github.com/briar-systems/mach-zstd"
ref = "branch/dev"
