name: apt install
description: install Ubuntu packages without letting an unrelated repository fail the leg

# `apt-get update` exits non-zero when ANY configured repository is unreachable,
# including repositories the job never installs from. The runner image carries
# Microsoft's and azure-cli's lists preinstalled, and a 403 from them failed
# `int pinned (linux)` while every Ubuntu repository the job actually reads fetched
# fine (#2885). A leg should fail when the code under test fails, or when a package it
# needs cannot be installed - not when third-party infrastructure is down.
#
# So the update's verdict is not this step's verdict, and the INSTALL's is: a package
# that genuinely cannot be found still fails here, loudly, which is the signal the
# update was standing in for. Dropping the unused lists first would work today and
# would be a list of third-party repositories to maintain against a runner image
# nobody here controls; the install is the check that needs no such list.
#
# It lives in one action rather than at each call site so a leg cannot be added under
# the old shape.

inputs:
  packages:
    description: space-separated package names to install
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update \
          || echo "::warning::apt-get update reported repository errors; continuing, the install below decides this step"
        sudo apt-get install -y ${{ inputs.packages }}
