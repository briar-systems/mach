name: setup audited mach
description: bootstrap the selected committed compiler from a published release

inputs:
  evidence-suffix:
    description: distinguish matrix rows sharing the same job and native host
    required: false
    default: ''

outputs:
  compiler:
    description: absolute path to the verified compiler
    value: ${{ steps.bootstrap.outputs.compiler }}

runs:
  using: composite
  steps:
    - name: Install published bootstrap seed
      id: seed
      uses: ./.github/actions/seed-mach
      with:
        tag: v4.26.5
    - name: Build and verify committed compiler
      id: bootstrap
      shell: bash
      run: >-
        python3 .github/actions/setup-mach/bootstrap.py
        7e26667e92e279b6ad2da53bf8e9a68ca42caa49
        3ee8e709a8ed7baff6e93780ce9b3582a907a91f
        ${{ steps.seed.outputs.tag }}
    - name: Retain bootstrap provenance
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: compiler-bootstrap-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}${{ inputs.evidence-suffix }}
        path: .mach-toolchain/evidence/
        if-no-files-found: error
