name: setup audited mach
description: install the audited published compiler used to build and test this checkout

inputs:
  evidence-suffix:
    description: distinguish matrix rows sharing the same job and native host
    required: false
    default: ''

outputs:
  compiler:
    description: absolute path to the verified compiler
    value: ${{ steps.seed.outputs.compiler }}

runs:
  using: composite
  steps:
    - name: Install audited published compiler
      id: seed
      uses: ./.github/actions/seed-mach
      with:
        tag: v4.30.0
    - name: Retain bootstrap provenance
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: compiler-bootstrap-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}${{ inputs.evidence-suffix }}
        path: |
          .mach-seed/release.json
          .mach-seed/SHA256SUMS
          .mach-seed/provenance.json
        if-no-files-found: error
