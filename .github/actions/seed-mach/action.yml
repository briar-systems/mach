name: seed mach
description: install and verify the published mach compiler for this runner

inputs:
  tag:
    description: explicit published release tag, or latest when empty
    required: false
    default: ''
  token:
    description: token used to read the release
    required: false
    default: ${{ github.token }}

outputs:
  tag:
    description: verified published release tag
    value: ${{ steps.resolve.outputs.tag }}
  compiler:
    description: absolute path to the verified installed compiler
    value: ${{ steps.verify.outputs.compiler }}

runs:
  using: composite
  steps:
    - name: resolve published release
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) host=x86_64-linux; ext=tar.gz ;;
          Linux/ARM64) host=aarch64-linux; ext=tar.gz ;;
          Windows/X64) host=x86_64-windows; ext=zip ;;
          macOS/X64) host=x86_64-darwin; ext=tar.gz ;;
          macOS/ARM64) host=aarch64-darwin; ext=tar.gz ;;
          *) echo "::error::no published mach seed for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        release=latest
        if [ -n "$RELEASE_TAG" ]; then release="tags/$RELEASE_TAG"; fi
        mkdir .mach-seed
        gh api "repos/briar-systems/mach/releases/$release" > .mach-seed/release.json
        python "$ACTION_PATH/verify.py" resolve .mach-seed/release.json "$RELEASE_TAG" "$host" "$ext"
    - name: download and verify archive before extraction
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        gh release download "$TAG" -R briar-systems/mach -p "$ASSET" -p SHA256SUMS -D .mach-seed
        python "$ACTION_PATH/verify.py" archive ".mach-seed/$ASSET" .mach-seed/SHA256SUMS
    - name: install native seed
      if: runner.os != 'Windows'
      shell: bash
      env:
        ASSET: ${{ steps.resolve.outputs.asset }}
      run: |
        set -euo pipefail
        tar -xzf ".mach-seed/$ASSET" -C .mach-seed mach
        chmod +x .mach-seed/mach
        echo "$PWD/.mach-seed" >> "$GITHUB_PATH"
    - name: install native seed
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ASSET: ${{ steps.resolve.outputs.asset }}
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = Join-Path $PWD '.mach-seed'
        Expand-Archive -Path (Join-Path $dir $env:ASSET) -DestinationPath $dir
        Add-Content -Path $env:GITHUB_PATH -Value $dir
    - name: verify installed version and record provenance
      id: verify
      shell: bash
      env:
        TAG: ${{ steps.resolve.outputs.tag }}
        ASSET: ${{ steps.resolve.outputs.asset }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/verify.py" installed .mach-seed "$TAG" "$ASSET"
