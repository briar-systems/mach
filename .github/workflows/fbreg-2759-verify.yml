name: inspect exact fbreg fixture against pinned decoders
on:
  push:
    branches: [fix/2759-verify]
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: fbreg-2759-evidence
          run-id: 34001842327
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Install pinned external decoders
        run: bash test/ci-tools.sh ubuntu-latest
      - name: Prove oracle correction and negative coverage
        run: python3 .github/scripts/fbreg-3197-proof.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fbreg-3197-proof
          path: fbreg-evidence
