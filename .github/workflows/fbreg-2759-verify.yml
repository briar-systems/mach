name: inspect exact fbreg fixture against pinned decoders
on:
  push:
    branches: [fix/2759-verify]
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          run-id: 34001051750
          github-token: ${{ github.token }}
          path: artifact
      - name: Install pinned external decoders
        run: bash test/ci-tools.sh ubuntu-latest
      - name: Inspect all fixture profiles
        run: python3 .github/scripts/fbreg-2759-verify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fbreg-2759-evidence
          path: fbreg-evidence
