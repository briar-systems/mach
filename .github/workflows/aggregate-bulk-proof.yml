name: verify RV aggregate split-tail carrier completion
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
  actions: read
jobs:
  carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/apt-install
        with:
          packages: clang llvm qemu-user libc6-dev-riscv64-cross
      - run: gh run download 34079126813 --name abi-carrier-final-rv --dir reused-proof
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 .github/scripts/abi-carrier-resume.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: abi-carrier-rv-runtime
          path: piece-evidence/
