name: inspect exact Darwin std backend objects
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
  actions: read
jobs:
  darwin-backend:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: fullbar-darwin-seeds
          path: darwin-seeds
          run-id: 34039651050
          github-token: ${{ github.token }}
      - name: Verify exact std backend with the corrected native compiler
        run: python .github/scripts/bulk-piece-std-backend.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bulk-piece-darwin-std-backend
          path: piece-evidence/
