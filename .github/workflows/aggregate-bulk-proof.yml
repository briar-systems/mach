name: aggregate bulk lowering proof
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
        id: seed
      - name: Install native diagnostic debugger
        run: sudo apt-get update -qq && sudo apt-get install -y gdb
      - name: Install the pinned SPIR-V oracle
        run: python .github/scripts/install-bulk-spirv.py
      - name: Verify bounded aggregate copy and zero lowering
        env:
          SEED_TAG: ${{ steps.seed.outputs.tag }}
        run: python .github/scripts/aggregate-bulk-proof.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aggregate-bulk-proof
          path: bulk-evidence/
