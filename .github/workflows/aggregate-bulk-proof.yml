name: verify materialized ARM backed-variable offsets
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
jobs:
  fbreg:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - uses: ./.github/actions/apt-install
        with:
          packages: llvm
      - run: python3 .github/scripts/fbreg-proof.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fbreg-current-arm
          path: piece-evidence/
