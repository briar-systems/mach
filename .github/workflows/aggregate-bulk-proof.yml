name: aggregate machine-piece native proof
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
  actions: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
        if: runner.os != 'macOS'
      - uses: actions/download-artifact@v5
        if: runner.os == 'macOS'
        with:
          name: fullbar-darwin-seeds
          path: darwin-seeds
          run-id: 34039651050
          github-token: ${{ github.token }}
      - name: Verify exact bulk source and selected native controls
        run: python .github/scripts/bulk-piece-proof.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bulk-pieces-${{ matrix.runner }}
          path: piece-evidence/
