name: finish aggregate bound and overlap mutations
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Prove live-piece bound and evaluated snapshot guards
        run: python .github/scripts/bulk-piece-mutations.py --remaining
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bulk-piece-mutations-final
          path: piece-evidence/
