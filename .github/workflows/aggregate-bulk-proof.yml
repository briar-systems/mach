name: verify RV aggregate split-tail carrier completion
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
jobs:
  carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - uses: ./.github/actions/apt-install
        with:
          packages: clang llvm qemu-user libc6-dev-riscv64-cross
      - run: python3 .github/scripts/abi-carrier-final.py
        env:
          CARRIER_FINAL_SOURCE: 4c92c99e9cf240ffbeab5a861417f0bfe61cc3f0
          CARRIER_FINAL_STD: c6a8816933fffa8ee490bb0bed8a97e7f0c1b296
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: abi-carrier-final-rv
          path: piece-evidence/
