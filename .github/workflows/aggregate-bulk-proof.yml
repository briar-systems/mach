name: verify exact aggregate ABI memory extents
on:
  push:
    branches: [fix/3109-proof]
permissions:
  contents: read
jobs:
  carrier:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - uses: ./.github/actions/apt-install
        if: runner.os == 'Linux'
        with:
          packages: clang llvm qemu-user libc6-dev-riscv64-cross
      - run: python3 .github/scripts/abi-carrier-proof.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: abi-carrier-${{ matrix.host }}
          path: piece-evidence/
