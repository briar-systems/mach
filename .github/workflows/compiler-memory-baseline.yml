name: compare snapshot bulk and machine-piece compilers
on:
  push:
    branches: [fix/2299-memory-baseline]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
        id: seed
      - name: Measure exact snapshot bulk and fixed compilers on one host
        env:
          SEED_TAG: ${{ steps.seed.outputs.tag }}
        run: python3 .github/scripts/compiler-memory-piece-compare.py
      - name: Preserve measurements and generators
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-memory-piece-compare
          path: |
            memory-evidence/
            .github/scripts/compiler-memory-baseline.py
            .github/scripts/compiler-memory-piece-compare.py
