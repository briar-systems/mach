name: full compiler bar for audit integration
on:
  push:
    branches: [fix/3139-fullbar]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Install pinned link tools and debugger
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
          bash test/ci-tools.sh ubuntu-latest
      - name: Verify exact source serially
        env:
          AUDIT_COMMIT: 13a6117ebe54638ecc8412c42c2eaa1c14c810c5
        run: python3 .github/scripts/git-fullbar.py
      - name: Retain full bar evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-fullbar-proof
          path: fullbar-evidence/
