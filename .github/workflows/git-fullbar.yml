name: full compiler bar for audit integration
on:
  push:
    branches: [fix/3139-fullbar]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 49fbbc48a9b290cbcb17c8187d339e5ce0bcc64b
          path: source
      - id: seed
        uses: ./.github/actions/seed-mach
      - name: Install native Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y gdb binutils
      - name: Install cross execution tools
        if: matrix.runner == 'ubuntu-latest'
        run: sudo apt-get install -y qemu-user libc6-dev-riscv64-cross
      - name: Install pinned corpus and link oracles
        shell: bash
        run: |
          export MACH_CI_TOOLS_BIN="$PWD/audit-tools/bin"
          cd source
          bash test/ci-tools.sh '${{ matrix.runner }}'
      - name: Verify exact source serially
        shell: bash
        env:
          AUDIT_RUNNER: ${{ matrix.runner }}
          SEED_TAG: ${{ steps.seed.outputs.tag }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export AUDIT_BASH="$(cygpath -w "$(command -v bash)")"; fi
          python .github/scripts/git-fullbar.py
      - name: Retain complete native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fullbar-${{ matrix.runner }}
          path: fullbar-evidence/
          retention-days: 7
  darwin-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 49fbbc48a9b290cbcb17c8187d339e5ce0bcc64b
          path: source
      - id: seed
        uses: ./.github/actions/seed-mach
      - name: Cross-build seeds from the exact source
        env:
          AUDIT_MODE: cross-seeds
          AUDIT_RUNNER: ubuntu-latest
          SEED_TAG: ${{ steps.seed.outputs.tag }}
        run: python .github/scripts/git-fullbar.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fullbar-darwin-seeds
          path: fullbar-evidence/
          retention-days: 7
  darwin:
    needs: darwin-seeds
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            machine: arm64
            target: darwin-aarch64
          - runner: macos-15-intel
            machine: x86_64
            target: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 49fbbc48a9b290cbcb17c8187d339e5ce0bcc64b
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: fullbar-darwin-seeds
          path: seed
      - name: Require native hardware
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 0
      - name: Install pinned corpus and link oracles
        shell: bash
        run: |
          export MACH_CI_TOOLS_BIN="$PWD/audit-tools/bin"
          cd source
          bash test/ci-tools.sh '${{ matrix.runner }}'
      - name: Verify exact source serially
        env:
          AUDIT_RUNNER: ${{ matrix.runner }}
          AUDIT_SEED: seed/mSeed-${{ matrix.target }}
          SEED_TAG: v4.26.5 cross-built exact 49fbbc48
        run: python3 .github/scripts/git-fullbar.py
      - name: Retain complete native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fullbar-${{ matrix.runner }}
          path: fullbar-evidence/
          retention-days: 7
