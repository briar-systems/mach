name: full compiler bar for Git environment
on:
  push:
    branches: [fix/3139-fullbar]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Verify exact source serially
        run: python3 .github/scripts/git-fullbar.py
      - name: Retain full bar evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-fullbar-proof
          path: fullbar-evidence/
