name: audit integrated frontend outcomes
on:
  push:
    branches: [fix/3115-repair-proof]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/seed-mach
      - name: Full driver editor and frontend suites with seed A/B
        shell: bash
        run: python .github/scripts/audit-outcome-repair.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outcome-repair-${{ matrix.os }}
          path: outcome-repair-evidence/
