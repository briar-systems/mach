name: audit native ELF SONAME semantics
on:
  push:
    branches: [fix/3115-repair-proof]
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          run-id: 34074514612
          github-token: ${{ github.token }}
          name: cli-lifecycle-${{ matrix.os }}
          path: retained-cli-lifecycle
      - name: Verify ELF output and host filename semantics
        shell: bash
        run: python3 .github/scripts/audit-cli-lifecycle.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soname-${{ matrix.os }}
          path: soname-evidence/
