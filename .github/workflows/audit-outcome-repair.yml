name: audit Darwin process fixture paths
on:
  push:
    branches: [fix/3115-repair-proof]
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: matrix.os == 'macos-15'
        with:
          run-id: 34074514612
          github-token: ${{ github.token }}
          name: cli-lifecycle-macos-15
          path: retained-cli-lifecycle
      - uses: actions/download-artifact@v8
        if: matrix.os == 'macos-15-intel'
        with:
          run-id: 34073879781
          github-token: ${{ github.token }}
          name: fullbar-darwin-seeds
          path: seed
      - name: Verify native utility paths and exact process fixture change
        shell: bash
        run: python3 .github/scripts/audit-darwin-process.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: darwin-process-${{ matrix.os }}
          path: darwin-process-evidence/
