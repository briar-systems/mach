name: audit paired CLI publication lifecycle
on:
  push:
    branches: [fix/3115-repair-proof]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/seed-mach
      - name: Bridge fixpoints, paired A/B/C, complete Unix suites and mutations
        shell: bash
        run: python3 .github/scripts/audit-cli-lifecycle.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-lifecycle-${{ matrix.os }}
          path: cli-lifecycle-evidence/
