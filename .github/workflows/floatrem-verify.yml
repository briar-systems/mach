name: verify structured floating remainder
on:
  push:
    branches: [fix/3154-verify]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/seed-mach
      - name: Install committed oracle pins
        run: bash test/ci-tools.sh ubuntu-latest
      - name: Verify focused regressions and native SPIR-V output
        run: python3 .github/scripts/floatrem-verify.py
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: floatrem-proof
          path: floatrem-evidence/
