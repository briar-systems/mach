name: verify DWARF ordering
on:
  push:
    branches: [fix/3147-verify]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/seed-mach
      - name: Build serial seed A and fixed B
        run: |
          set -euo pipefail
          mach dep pull
          mach build . -o a
          ./a build . -o b
      - name: Verify workload and runtime mutations serially
        run: python3 .github/scripts/dwarf-verify.py
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dwarf-ordering-proof
          path: dwarf-evidence/
