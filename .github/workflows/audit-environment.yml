name: audit compiler3146 environment

on:
  push:
    branches: [fix/3146-mutations]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/seed-mach
      - name: Verify source compiler and independent environment mutations
        run: python3 .github/scripts/audit-environment.py "$(command -v mach)"
      - name: Install pinned native corpus tools
        if: always()
        run: bash test/ci-tools.sh ubuntu-latest
      - name: Verify native link corpus without PATH overrides
        if: always()
        run: MACH_LINK_MACH="$PWD/environment-compiler" bash test/link/run.sh --leg x86_64-linux --deps pin
      - name: Retain environment and native corpus evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiler3146-linux-environment
          path: |
            environment-evidence/
            test/link/out/
