name: int main

# the darwin legs of the integration matrix run on merge to main (and on manual
# dispatch) rather than per-PR: the macOS runners are scarce, and a from-source
# compiler for each darwin target has to be cross-built on linux first. running at
# the release-integration gate catches a darwin codegen regression there while
# paying the macOS cost only then. the leg set is still data-driven from
# int/targets.conf (the main-cadence rows), so adding a darwin target needs no edit
# here — but it is not free: every case manifest must declare the target too, or the
# leg fails to compile on the case that omitted it. ci.yml's int-matrix job runs
# check-target-matrix.sh on every PR, which is where this actually has to be caught
# (main-cadence-only enforcement is no enforcement, #2353); this job runs it again
# as the second gate before the scarce runner time this workflow spends.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  int-matrix:
    name: int matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v6
      - name: check every case declares its target blocks
        run: bash int/lib/check-target-matrix.sh
      - id: gen
        run: echo "include=$(bash int/lib/ci-matrix.sh main)" >> "$GITHUB_OUTPUT"

  # no darwin seed is published, so the from-source compiler for each darwin target
  # is cross-built on linux from the x86_64-linux seed and handed to the macOS
  # runner. this mirrors the darwin-lane.yml bootstrap; collapse it once a darwin
  # archive self-seeds.
  seed:
    name: seed ${{ matrix.target }}
    needs: int-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.int-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
      - name: fetch released mach
        uses: ./.github/actions/seed-mach
      - name: cross-build the from-source compiler
        run: |
          set -euo pipefail
          mach dep pull
          mach build . -o m
          ./m build . --target ${{ matrix.target }} --profile release -o mach-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: mach-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # timeout-minutes bounds execution, not queue time: a leg pinned to an
  # unavailable runner class still sits in queue to GitHub's 24h cap (#1787).
  # keeping every row on an available runner class is the real guard.
  integration:
    name: int ${{ matrix.target }}
    needs: [int-matrix, seed]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.int-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: mach-${{ matrix.target }}
      # `--deps pin` because this is the release-integration gate. every case resolves
      # the mach-std commit this repo's own mach.lock records, which is the one the
      # compiler being gated was built against, so a red gate here is caused by the
      # code being released and not by a mach-std merge that landed since, and two
      # runs of the same mach commit stay comparable (#2592). the pr lane still floats
      # (ci.yml), which is where a downstream break is meant to surface first.
      - name: run integration suite
        run: |
          set -euo pipefail
          chmod +x mach-${{ matrix.target }}
          bash int/run.sh --deps pin --target ${{ matrix.target }} ./mach-${{ matrix.target }}

      - name: upload the dependency resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-deps-${{ matrix.target }}
          path: int/out/deps.txt
          if-no-files-found: warn
