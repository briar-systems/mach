name: CD

# a tag bootstraps once on linux, cross-compiles stage a for all six targets,
# builds the shipped release binary natively on each host, and publishes the
# archives with SHA256SUMS. the gate is `gh workflow run CI --ref dev -f lane=all`,
# run green on dev right before the release merge.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # the published release that builds stage a. it moves to a later release only
  # when the tree first needs something this one cannot read
  SEED: 7.0.0

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: tag matches the version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' mach.toml | head -1)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != mach.toml version $ver"; exit 1; }
          cver=$(sed -n 's/^pub val MACH_VERSION: str = "\(.*\)";$/\1/p' src/base/version.mach)
          [ "$cver" = "$ver" ] || { echo "::error::compiler version $cver != mach.toml version $ver"; exit 1; }
      - name: one [Unreleased], first, no repeated subsection
        run: |
          count=$(grep -c '^## \[Unreleased\]$' CHANGELOG.md || true)
          [ "$count" -le 1 ] || { echo "::error file=CHANGELOG.md::$count '## [Unreleased]' headings"; exit 1; }
          first=$(grep -m1 '^## \[' CHANGELOG.md || true)
          [ "$count" = 0 ] || [ "$first" = '## [Unreleased]' ] || { echo "::error file=CHANGELOG.md::'## [Unreleased]' sits below '$first'"; exit 1; }
          dupes=$(awk '/^## \[/ { section = $0; delete seen; next } /^### / { if ($0 in seen) print section " repeats \x27" $0 "\x27"; seen[$0] = 1 }' CHANGELOG.md)
          [ -z "$dupes" ] || { echo "::error file=CHANGELOG.md::a release repeats a subsection"; echo "$dupes"; exit 1; }

  # build from the seed release once on linux and cross-compile a release stage a for every host
  bootstrap:
    name: bootstrap
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # the install script checks the archive against the release's SHA256SUMS
      - name: install the seed
        run: MACH_VERSION="$SEED" MACH_INSTALL_DIR="$RUNNER_TEMP/seed" sh dist/install.sh
      # the seed builds a at debug, so no older optimiser compiles this tree
      - name: build a with the seed
        run: |
          "$RUNNER_TEMP/seed/mach" dep pull .
          "$RUNNER_TEMP/seed/mach" build . --profile debug -o a
      - name: build b with a
        run: |
          ./a dep pull .
          ./a build . --profile release --threads 2 -o b
      - name: cross-compile stage a for each host
        env:
          TARGETS: linux-x86_64,linux-aarch64,windows-x86_64,windows-aarch64,darwin-aarch64,darwin-x86_64
        run: |
          host=
          case "$(uname -m)" in
            x86_64) host=linux-x86_64 ;;
            aarch64) host=linux-aarch64 ;;
          esac
          IFS=, read -r -a targets <<< "$TARGETS"
          for t in "${targets[@]}"; do
            exe=
            case "$t" in windows-*) exe=.exe ;; esac
            mkdir -p "$RUNNER_TEMP/bootstrap-out/$t"
            if [ "$t" = "$host" ]; then
              cp b "$RUNNER_TEMP/bootstrap-out/$t/mach"
            else
              ./b build . --profile release -t "$t" -o "cross-$t$exe"
              mv "cross-$t$exe" "$RUNNER_TEMP/bootstrap-out/$t/mach$exe"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-compilers
          path: ${{ runner.temp }}/bootstrap-out
          retention-days: 1
          if-no-files-found: error

  # the cross-compiled stage a builds the shipped release binary on each native host
  build:
    name: build ${{ matrix.target }}
    needs: bootstrap
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,    mach-target: linux-x86_64,    runs-on: ubuntu-latest }
          - { target: aarch64-linux,   mach-target: linux-aarch64,   runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows,  mach-target: windows-x86_64,  runs-on: windows-latest }
          - { target: aarch64-windows, mach-target: windows-aarch64, runs-on: windows-11-arm }
          - { target: aarch64-darwin,  mach-target: darwin-aarch64,  runs-on: macos-15 }
          - { target: x86_64-darwin,   mach-target: darwin-x86_64,   runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-compilers
          path: ${{ runner.temp }}/bootstrap
      - run: |
          exe=
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          boot_root=$RUNNER_TEMP/bootstrap
          [ "$RUNNER_OS" = Windows ] && boot_root=$(cygpath -u "$boot_root")
          if [ "$RUNNER_OS" = macOS ] && [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 1 ]; then
            echo "::error::this runner is translated by rosetta 2, not native silicon"
            exit 1
          fi
          boot="$boot_root/${{ matrix.mach-target }}/mach$exe"
          [ "$RUNNER_OS" != Windows ] && chmod +x "$boot"
          "$boot" --version
          "$boot" dep pull .
          "$boot" build . --profile release --threads 2 -o "mach$exe"
          "./mach$exe" --version
          echo "MACH=$PWD/mach$exe" >> "$GITHUB_ENV"
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist pkg
          cp LICENSE pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$MACH" pkg/mach.exe
            (cd pkg && 7z a -tzip "../dist/mach-$ver-$TARGET.zip" mach.exe LICENSE >/dev/null)
          else
            cp "$MACH" pkg/mach
            tar -C pkg -czf "dist/mach-$ver-$TARGET.tar.gz" mach LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/mach-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      # the notes read the previous tag and the merges since it
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: checksums over the complete archive set
        run: |
          cd dist
          ver=${GITHUB_REF_NAME#v}
          for f in mach-$ver-{x86_64-linux,aarch64-linux,aarch64-darwin,x86_64-darwin}.tar.gz mach-$ver-{x86_64-windows,aarch64-windows}.zip; do
            [ -f "$f" ] || { echo "::error::release is missing $f"; exit 1; }
          done
          sha256sum mach-*.tar.gz mach-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            dist/mach-*.tar.gz
            dist/mach-*.zip
            dist/SHA256SUMS
