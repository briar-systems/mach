name: CD

# a tag builds the release binary on each native host and publishes the
# archives with SHA256SUMS, under the notes .github/scripts/release-notes.sh
# builds from the tag. correctness is CI's job: every change reaches main
# through a pull request that runs everything, so nothing is re-proven here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: tag matches the version
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' mach.toml | head -1)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != mach.toml version $ver"; exit 1; }
          cver=$(sed -n 's/^pub val MACH_VERSION: str = "\(.*\)";$/\1/p' src/lang/version.mach)
          [ "$cver" = "$ver" ] || { echo "::error::compiler version $cver != mach.toml version $ver"; exit 1; }
      # the #3039 invariant, invisible in any one diff: at most one
      # `## [Unreleased]`, it leads, and no release repeats a `###`. checked here
      # rather than on pull requests, which no longer touch the changelog (#3945).
      - name: one [Unreleased], first, no repeated subsection
        run: |
          set -euo pipefail
          status=0
          count=$(grep -c '^## \[Unreleased\]$' CHANGELOG.md || true)
          if [ "$count" -gt 1 ]; then
            echo "::error file=CHANGELOG.md::$count '## [Unreleased]' headings, fold the later ones into the first"
            grep -n '^## \[Unreleased\]$' CHANGELOG.md
            status=1
          fi
          first=$(grep -m1 '^## \[' CHANGELOG.md || true)
          if [ "$count" -gt 0 ] && [ "$first" != '## [Unreleased]' ]; then
            echo "::error file=CHANGELOG.md::'## [Unreleased]' sits below '$first'"
            status=1
          fi
          dupes=$(awk '/^## \[/ { section = $0; delete seen; next } /^### / { if ($0 in seen) print section " repeats \x27" $0 "\x27"; seen[$0] = 1 }' CHANGELOG.md)
          if [ -n "$dupes" ]; then
            echo "::error file=CHANGELOG.md::a release repeats a subsection"
            echo "$dupes"
            status=1
          fi
          exit $status

  # every native host seeds from the previous published release and ships the
  # compiler that release built from this source: the seed compiles `a`, and `a`
  # compiles the shipped `b`, so the release carries its own codegen
  # x86_64-darwin must self-host on real Intel silicon, since Rosetta 2 cannot
  # host mach's raw bsdthread_create worker threads (#2104).
  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
          - { target: aarch64-darwin, runs-on: macos-15,       machine: arm64 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel, machine: x86_64 }
    steps:
      - uses: actions/checkout@v6
      - name: the darwin lane landed on real silicon
        if: runner.os == 'macOS'
        env:
          WANT: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          got=$(uname -m); translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
          [ "$got" = "$WANT" ] && [ "$translated" = 0 ] || { echo "::error::the $WANT lane landed on a $got host (proc_translated=$translated)"; exit 1; }
      - name: seed
        uses: ./.github/actions/seed-mach
      - name: release build
        shell: bash
        run: |
          set -euo pipefail
          exe=; bin=mach; [ "$RUNNER_OS" = Windows ] && exe=.exe && bin=mach-windows
          mach dep pull .
          # a seed older than #3813 builds every artifact without a selector
          mach build . --bin $bin --profile release -o a$exe
          ./a$exe build . --profile release -o b$exe
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist pkg
          cp LICENSE pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            cp b.exe pkg/mach.exe
            (cd pkg && 7z a -tzip "../dist/mach-$ver-$TARGET.zip" mach.exe LICENSE >/dev/null)
          else
            cp b pkg/mach
            tar -C pkg -czf "dist/mach-$ver-$TARGET.tar.gz" mach LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/mach-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      # the notes read the previous tag and the merges since it
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: checksums over the complete archive set
        run: |
          set -euo pipefail
          cd dist
          ver=${GITHUB_REF_NAME#v}
          for t in x86_64-linux aarch64-linux aarch64-darwin x86_64-darwin; do
            [ -f "mach-$ver-$t.tar.gz" ] || { echo "::error::release is missing mach-$ver-$t.tar.gz"; exit 1; }
          done
          [ -f "mach-$ver-x86_64-windows.zip" ] || { echo "::error::release is missing mach-$ver-x86_64-windows.zip"; exit 1; }
          sha256sum mach-*.tar.gz mach-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/mach-*.tar.gz
            dist/mach-*.zip
            dist/SHA256SUMS
