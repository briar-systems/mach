name: CD

# a tag builds the release binary on each native host to its own self-host
# fixpoint, runs the unit suite through it, and publishes the archives with
# SHA256SUMS. correctness is CI's job: every change reaches main through a pull
# request it gates, and the push to main runs everything.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: tag matches the version
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' mach.toml | head -1)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != mach.toml version $ver"; exit 1; }
          cver=$(sed -n 's/^pub val MACH_VERSION: str = "\(.*\)";$/\1/p' src/lang/version.mach)
          [ "$cver" = "$ver" ] || { echo "::error::compiler version $cver != mach.toml version $ver"; exit 1; }

  # the hosts that seed themselves: linux and windows bootstrap through the
  # audited chain, reach the release fixpoint natively and package it
  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - name: seed
        uses: ./.github/actions/setup-mach
      - name: release fixpoint and unit suite
        shell: bash
        run: |
          set -euo pipefail
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          mach dep pull .
          mach build . --profile release -o a$exe
          ./a$exe build . --profile release -o b$exe
          ./b$exe build . --profile release -o c$exe
          cmp b$exe c$exe || { echo "::error::build did not converge to the fixpoint"; exit 1; }
          ./c$exe test .
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist stage
          cp LICENSE stage/
          if [ "$RUNNER_OS" = Windows ]; then
            cp c.exe stage/mach.exe
            (cd stage && 7z a -tzip "../dist/mach-$ver-$TARGET.zip" mach.exe LICENSE >/dev/null)
          else
            cp c stage/mach
            tar -C stage -czf "dist/mach-$ver-$TARGET.tar.gz" mach LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/mach-*
          if-no-files-found: error
          retention-days: 1

  # the darwin hosts: linux cross-builds a seed for each, then every host reaches
  # its own fixpoint natively and packages it. x86_64-darwin must self-host on
  # real Intel silicon, since Rosetta 2 cannot host mach's raw bsdthread_create
  # worker threads (#2104).
  darwin-seed:
    name: darwin seed
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: seed
        uses: ./.github/actions/setup-mach
      - name: cross-build the darwin seeds
        run: |
          set -euo pipefail
          mach dep pull .
          mach build . -o m
          mkdir -p seed
          ./m build . --target darwin-aarch64 --profile release -o seed/mach-aarch64-darwin
          ./m build . --target darwin-x86_64 --profile release -o seed/mach-x86_64-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-seed
          path: seed/
          if-no-files-found: error
          retention-days: 1

  build-darwin:
    name: build ${{ matrix.target }}
    needs: darwin-seed
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-darwin, runs-on: macos-15,       machine: arm64 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel, machine: x86_64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: darwin-seed
          path: seed
      - name: release fixpoint and unit suite
        env:
          WANT: ${{ matrix.machine }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          got=$(uname -m); translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
          [ "$got" = "$WANT" ] && [ "$translated" = 0 ] || { echo "::error::the $WANT lane landed on a $got host (proc_translated=$translated)"; exit 1; }
          chmod +x "seed/mach-$TARGET"
          "./seed/mach-$TARGET" dep pull .
          "./seed/mach-$TARGET" build . --profile release -o a
          ./a build . --profile release -o b
          ./b build . --profile release -o c
          cmp b c || { echo "::error::darwin build did not converge to the fixpoint"; exit 1; }
          ./c test .
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist stage
          cp c stage/mach
          cp LICENSE stage/
          tar -C stage -czf "dist/mach-$ver-$TARGET.tar.gz" mach LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/mach-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    needs: [build, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: checksums over the complete archive set
        run: |
          set -euo pipefail
          cd dist
          ver=${GITHUB_REF_NAME#v}
          for t in x86_64-linux aarch64-linux aarch64-darwin x86_64-darwin; do
            [ -f "mach-$ver-$t.tar.gz" ] || { echo "::error::release is missing mach-$ver-$t.tar.gz"; exit 1; }
          done
          [ -f "mach-$ver-x86_64-windows.zip" ] || { echo "::error::release is missing mach-$ver-x86_64-windows.zip"; exit 1; }
          sha256sum mach-*.tar.gz mach-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/mach-*.tar.gz
            dist/mach-*.zip
            dist/SHA256SUMS
