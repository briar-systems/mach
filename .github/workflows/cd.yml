name: CD

# a tag builds the release binary on each native host and publishes the archives
# with SHA256SUMS. the gate is `gh workflow run CI --ref dev -f lane=all`, run
# green on dev right before the release merge

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: tag matches the version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' mach.toml | head -1)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != mach.toml version $ver"; exit 1; }
          cver=$(sed -n 's/^pub val MACH_VERSION: str = "\(.*\)";$/\1/p' src/lang/version.mach)
          [ "$cver" = "$ver" ] || { echo "::error::compiler version $cver != mach.toml version $ver"; exit 1; }
      - name: one [Unreleased], first, no repeated subsection
        run: |
          count=$(grep -c '^## \[Unreleased\]$' CHANGELOG.md || true)
          [ "$count" -le 1 ] || { echo "::error file=CHANGELOG.md::$count '## [Unreleased]' headings"; exit 1; }
          first=$(grep -m1 '^## \[' CHANGELOG.md || true)
          [ "$count" = 0 ] || [ "$first" = '## [Unreleased]' ] || { echo "::error file=CHANGELOG.md::'## [Unreleased]' sits below '$first'"; exit 1; }
          dupes=$(awk '/^## \[/ { section = $0; delete seen; next } /^### / { if ($0 in seen) print section " repeats \x27" $0 "\x27"; seen[$0] = 1 }' CHANGELOG.md)
          [ -z "$dupes" ] || { echo "::error file=CHANGELOG.md::a release repeats a subsection"; echo "$dupes"; exit 1; }

  # the seed builds a and a builds the shipped b, so the release carries its own codegen
  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh --profile release
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p dist pkg
          cp LICENSE pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$MACH" pkg/mach.exe
            (cd pkg && 7z a -tzip "../dist/mach-$ver-$TARGET.zip" mach.exe LICENSE >/dev/null)
          else
            cp "$MACH" pkg/mach
            tar -C pkg -czf "dist/mach-$ver-$TARGET.tar.gz" mach LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/mach-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      # the notes read the previous tag and the merges since it
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: checksums over the complete archive set
        run: |
          cd dist
          ver=${GITHUB_REF_NAME#v}
          for f in mach-$ver-{x86_64-linux,aarch64-linux,aarch64-darwin,x86_64-darwin}.tar.gz mach-$ver-x86_64-windows.zip; do
            [ -f "$f" ] || { echo "::error::release is missing $f"; exit 1; }
          done
          sha256sum mach-*.tar.gz mach-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/mach-*.tar.gz
            dist/mach-*.zip
            dist/SHA256SUMS
