name: verify std snapshot harnesses and exact CD additivity
on:
  push:
    branches: [fix/3135-verify]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Build release seed to A to B serially
        run: |
          set -euo pipefail
          mkdir -p harness-evidence
          mach info | tee harness-evidence/seed-info.log
          mach dep pull 2>&1 | tee harness-evidence/seed-deps.log
          git -C dep/std rev-parse HEAD | tee harness-evidence/std-revision.log
          mach build . --profile release -o a 2>&1 | tee harness-evidence/seed-a.log
          ./a build . --profile release -o b 2>&1 | tee harness-evidence/a-b.log
          cp b c
          cmp b c
          sha256sum a b c | tee harness-evidence/compiler-hashes.log
      - name: Run checked types and the unchanged CD additivity body
        run: python3 .github/scripts/harness-3135-verify.py
      - name: Retain harness verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-3135-native-linux
          path: harness-evidence/
