name: verify x86-64 ELF imported addresses
on:
  push:
    branches: [fix/3135-verify]
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 34080368520
          name: linker-fixture-${{ matrix.runner }}
          path: paired
      - run: python3 .github/scripts/linker-fixture-proof.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linker-fixture-${{ matrix.runner }}
          path: linker-evidence
