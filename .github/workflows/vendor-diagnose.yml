name: diagnose vendored version harness

on:
  push:
    branches: [fix/3135-diagnose]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/seed-mach
      - name: Install bounded diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb strace
      - name: Build serial seed A and audited B
        run: |
          set -euo pipefail
          mach dep pull
          mach build . -o a
          ./a build . -o b
      - name: Trace vendored harness with bounded stack sampling
        run: python3 .github/scripts/vendor-diagnose.py
      - name: Retain diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-harness-diagnosis
          path: vendor-evidence/
