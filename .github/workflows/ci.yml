name: CI

# the build, nothing else. every pull request and every merge queue entry
# bootstraps on linux, cross-compiles stage a for the linux targets, and builds
# natively on each linux host. the windows, darwin and release lanes run when a
# dispatch names one, and `lane=all` on dev is the release gate. the checks are
# local commands (CONTRIBUTING.md, "Local checks").

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      lane:
        description: lane to run beside the pull request lanes
        type: choice
        default: none
        options: [none, all, windows, darwin, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # build from the seed release once on linux and cross-compile a release stage a for each requested host
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - id: targets
        env:
          LANE: ${{ inputs.lane || 'none' }}
        run: |
          case "$LANE" in
            none) t=linux-x86_64,linux-aarch64 ;;
            windows) t=linux-x86_64,linux-aarch64,windows-x86_64,windows-aarch64 ;;
            darwin) t=linux-x86_64,linux-aarch64,darwin-aarch64,darwin-x86_64 ;;
            release|all) t=linux-x86_64,linux-aarch64,windows-x86_64,windows-aarch64,darwin-aarch64,darwin-x86_64 ;;
            *) echo "::error::unknown lane '$LANE'"; exit 1 ;;
          esac
          echo "targets=$t" >> "$GITHUB_OUTPUT"
      - run: bash .github/scripts/bootstrap.sh --profile release --cross-dir "$RUNNER_TEMP/bootstrap-out" --cross-targets "${{ steps.targets.outputs.targets }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-compilers
          path: ${{ runner.temp }}/bootstrap-out
          retention-days: 1
          if-no-files-found: error

  # the compiler built natively on each host from its cross-compiled stage a
  host:
    name: host ${{ matrix.target }}
    needs: [bootstrap]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,  mach-target: linux-x86_64,  runs-on: ubuntu-latest }
          - { target: aarch64-linux, mach-target: linux-aarch64, runs-on: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-compilers
          path: ${{ runner.temp }}/bootstrap
      - run: |
          boot="$RUNNER_TEMP/bootstrap/${{ matrix.mach-target }}/mach"
          chmod +x "$boot"
          "$boot" --version
          "$boot" dep pull .
          "$boot" build . --profile debug --threads 2 -o mach
          ./mach --version
          echo "MACH=$PWD/mach" >> "$GITHUB_ENV"
      # the editor library, which only mach-lsp reaches otherwise
      - run: '"$MACH" build . -a editor'

  host-windows:
    name: host ${{ matrix.target }}
    needs: [bootstrap]
    if: contains(fromJSON('["all", "windows"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-windows,  mach-target: windows-x86_64,  runs-on: windows-latest }
          - { target: aarch64-windows, mach-target: windows-aarch64, runs-on: windows-11-arm }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-compilers
          path: ${{ runner.temp }}/bootstrap
      - run: |
          boot="$(cygpath -u "$RUNNER_TEMP")/bootstrap/${{ matrix.mach-target }}/mach.exe"
          "$boot" --version
          "$boot" dep pull .
          "$boot" build . --profile debug --threads 2 -o mach.exe
          ./mach.exe --version
          echo "MACH=$PWD/mach.exe" >> "$GITHUB_ENV"

  host-darwin:
    name: host ${{ matrix.target }}
    needs: [bootstrap]
    if: contains(fromJSON('["all", "darwin"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-darwin, mach-target: darwin-aarch64, runs-on: macos-15 }
          - { target: x86_64-darwin,  mach-target: darwin-x86_64,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-compilers
          path: ${{ runner.temp }}/bootstrap
      - run: |
          if [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 1 ]; then
            echo "::error::this runner is translated by rosetta 2, not native silicon"
            exit 1
          fi
          boot="$RUNNER_TEMP/bootstrap/${{ matrix.mach-target }}/mach"
          chmod +x "$boot"
          "$boot" --version
          "$boot" dep pull .
          "$boot" build . --profile debug --threads 2 -o mach
          ./mach --version
          echo "MACH=$PWD/mach" >> "$GITHUB_ENV"

  release:
    name: release ${{ matrix.target }}
    needs: [bootstrap]
    if: contains(fromJSON('["all", "release"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,    mach-target: linux-x86_64,    runs-on: ubuntu-latest }
          - { target: aarch64-linux,   mach-target: linux-aarch64,   runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows,  mach-target: windows-x86_64,  runs-on: windows-latest }
          - { target: aarch64-windows, mach-target: windows-aarch64, runs-on: windows-11-arm }
          - { target: aarch64-darwin,  mach-target: darwin-aarch64,  runs-on: macos-15 }
          - { target: x86_64-darwin,   mach-target: darwin-x86_64,   runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-compilers
          path: ${{ runner.temp }}/bootstrap
      - run: |
          exe=
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          boot_root=$RUNNER_TEMP/bootstrap
          [ "$RUNNER_OS" = Windows ] && boot_root=$(cygpath -u "$boot_root")
          if [ "$RUNNER_OS" = macOS ] && [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 1 ]; then
            echo "::error::this runner is translated by rosetta 2, not native silicon"
            exit 1
          fi
          boot="$boot_root/${{ matrix.mach-target }}/mach$exe"
          [ "$RUNNER_OS" != Windows ] && chmod +x "$boot"
          "$boot" --version
          "$boot" dep pull .
          "$boot" build . --profile release --threads 2 -o "mach$exe"
          "./mach$exe" --version
          echo "MACH=$PWD/mach$exe" >> "$GITHUB_ENV"

  gate:
    name: gate
    if: always()
    needs: [bootstrap, host, host-windows, host-darwin, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
