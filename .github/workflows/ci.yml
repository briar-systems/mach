name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# every native host gets these checks: "build <target>" proves the most recent
# release (the seed) builds the project to a self-host fixpoint. "test <target>"
# reuses that fixpoint compiler to run the in-source corpus. "incremental
# <target>" proves the warm/incremental build path matches a clean build both at
# rest and after an edit (the query engine's invalidation, unexercised by the
# from-scratch fixpoint). "release <target>" repeats the fixpoint under the opt=2
# release profile so -O2 codegen regressions surface on PRs, not only at tag time.
#
# darwin is the exception: it gates the dev -> main release merge only, not every
# PR into dev, since the macOS runners are slow and metered. see the "darwin"
# job below and darwin-lane.yml (shared with cd.yml, so the gate can never drift
# from the lane CD actually runs).
jobs:
  build-linux:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build fixpoint
        run: |
          set -euo pipefail

          mach dep pull
          mach build . -o a
          ./a build . -o b
          ./b build . -o c

          # compare b and c to identify non-determinism
          if ! cmp -s b c; then
            echo "::error::build did not converge to the fixpoint"
            exit 1
          fi

          # hand the fixpoint binary to the test job
          mkdir -p artifact
          cp c artifact/mach

      - name: upload fixpoint result
        uses: actions/upload-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact/mach
          if-no-files-found: error
          retention-days: 1

  test-linux:
    name: test ${{ matrix.target }}
    needs: build-linux
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: download the fixpoint result
        uses: actions/download-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact

      - name: self test
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull
          ./artifact/mach test .

  incremental-linux:
    name: incremental ${{ matrix.target }}
    needs: build-linux
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: download the fixpoint result
        uses: actions/download-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact

      - name: incremental determinism
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull
          bash int/lib/check-determinism.sh ./artifact/mach .

  release-linux:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build release fixpoint
        run: |
          set -euo pipefail
          mach dep pull
          mach build . --profile release -o a
          ./a build . --profile release -o b
          ./b build . --profile release -o c

          # the opt=2 compiler must rebuild itself byte-identically
          if ! cmp -s b c; then
            echo "::error::release build did not converge to the fixpoint"
            exit 1
          fi

      - name: self test
        run: |
          set -euo pipefail
          ./c test .

  build-windows:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build fixpoint
        run: |
          mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mach.exe build . -o a.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./a.exe build . -o b.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./b.exe build . -o c.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # compare b and c to identify non-determinism (no cmp in pwsh)
          if ((Get-FileHash b.exe).Hash -ne (Get-FileHash c.exe).Hash) {
            Write-Error 'build did not converge to the fixpoint'
            exit 1
          }

          # hand the fixpoint binary to the test job
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item c.exe artifact/mach.exe -Force

      - name: upload fixpoint result
        uses: actions/upload-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact/mach.exe
          if-no-files-found: error
          retention-days: 1

  test-windows:
    name: test ${{ matrix.target }}
    needs: build-windows
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: download the fixpoint result
        uses: actions/download-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact

      - name: self test
        run: |
          ./artifact/mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./artifact/mach.exe test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release-windows:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build release fixpoint
        run: |
          mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mach.exe build . --profile release -o a.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./a.exe build . --profile release -o b.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./b.exe build . --profile release -o c.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # the opt=2 compiler must rebuild itself byte-identically (no cmp in pwsh)
          if ((Get-FileHash b.exe).Hash -ne (Get-FileHash c.exe).Hash) {
            Write-Error 'release build did not converge to the fixpoint'
            exit 1
          }

      - name: self test
        run: |
          ./c.exe test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # the integration matrix is data-driven from int/targets.conf: this setup job
  # turns the pr-cadence rows into the include list the integration job matrixes
  # over, so adding a target is one targets.conf row and no workflow edit. also
  # runs the target-matrix consistency check (#2353): static, no compiler and no
  # macOS runner needed, so it belongs in this already-lightweight job rather
  # than its own - and failing here skips `integration` entirely via `needs`,
  # catching a missing [target.<leg>] block before spending real build time on
  # legs that would fail to compile anyway.
  int-matrix:
    name: int matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v6
      - name: check every case declares its target blocks
        run: bash int/lib/check-target-matrix.sh
      - id: gen
        run: echo "include=$(bash int/lib/ci-matrix.sh pr)" >> "$GITHUB_OUTPUT"

  # one job over every pr-cadence leg: build a from-source compiler on the leg's
  # host (seeded by the matching release), then run the int/ suite for the target.
  # the riscv64 leg runs its fixtures under qemu-user; every other leg runs native.
  integration:
    name: int ${{ matrix.target }}
    needs: int-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.int-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v6

      - name: install qemu-user
        if: matrix.runmode == 'qemu'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      # the host-side validators the structural cases inspect artifacts with, all
      # reading the target artifact regardless of the runner's own ISA. debuginfo
      # (int/surface/debuginfo) verifies the emitted DWARF with llvm-dwarfdump and
      # reads PT_LOAD extents with readelf (#2039); spirv-module
      # (int/surface/spirv-module) validates the delivered `.spv` with the Khronos
      # spirv-val (#2245). both run on the Linux legs.
      - name: install artifact validators
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm binutils spirv-tools

      # the seed lands on PATH via GITHUB_PATH, which only takes effect in later
      # steps, so the fetch and the build are separate (as in the build lanes).
      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build the from-source compiler
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mach dep pull
          mach build . -o m

      - name: build the from-source compiler (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mach.exe build . -o m.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # the pr lane deliberately keeps the default `--deps float`: resolving mach-std's
      # branch tip fresh is what catches a downstream break on the pr that would first
      # trip over it. the release gate pins instead (int-main.yml). uploaded on failure
      # too, since "what did the red run build against" is the question that matters.
      - name: run integration suite
        shell: bash
        run: bash int/run.sh --target ${{ matrix.target }} ./m

      - name: upload the dependency resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-deps-${{ matrix.target }}
          path: int/out/deps.txt
          if-no-files-found: warn

  # the release gate: only PRs targeting main (the dev -> main release merge) get
  # a macOS runner. every other PR base schedules nothing here. #2179.
  darwin:
    name: darwin (release gate)
    if: github.base_ref == 'main'
    uses: ./.github/workflows/darwin-lane.yml
