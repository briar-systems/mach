name: CI

# every pull request runs the same lanes. the slow lanes run only when a
# dispatch names one, or on a tag through cd.yml.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: slow lane to run beside the pull request lanes
        type: choice
        default: none
        options: [none, all, release, dwarf, darwin-link, f16proof]
  workflow_call:
    inputs:
      lane:
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  LLVM_MAJOR: 22
  VULKAN_SDK_VERSION: 1.4.357.0

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      - name: release notes selection
        run: bash .github/scripts/release-notes-test.sh
      - name: documented flags are accepted
        run: python3 .github/scripts/doc-flags.py "$MACH" doc
      - name: the committed reference is what mach doc generates
        run: |
          "$MACH" doc . --out out/docgen -q
          diff -r out/docgen/mach doc/mach
          diff out/docgen/README.md doc/README.md
      - name: unshipped markers cite open issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/doc-markers.py doc/language
      - name: doc/language code blocks compile and run
        run: bash test/run.sh --docs
      - name: formatter
        run: |
          rc=0
          "$MACH" fmt --check . || rc=1
          # corpus cases are lone sources, link cases and the f16 proof are projects
          for f in $(find test/cases test/lib -name '*.mach' | sort); do "$MACH" fmt --check "$f" || rc=1; done
          for p in $(find test/link/cases -name mach.toml | sort) test/f16proof; do "$MACH" fmt --check "$p" || rc=1; done
          exit "$rc"

  # the fixpoint and the debug unit suite. windows runs its two suites as
  # separate jobs, since each takes minutes there
  host:
    name: host ${{ matrix.target }} ${{ matrix.suite }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest, suite: compiler }
          - { target: x86_64-windows, runs-on: windows-latest, suite: tests }
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh --fixpoint
      - name: unit suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          [ "$SUITE" = tests ] || "$MACH" test .
          [ "$SUITE" = compiler ] || "$MACH" test . -a tests

  incremental:
    name: incremental ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,  runs-on: ubuntu-latest }
          - { target: aarch64-linux, runs-on: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      - name: warm rebuilds match clean
        run: bash test/run.sh --incremental
      # docs runs them on x86_64
      - name: doc/language code blocks compile and run
        if: matrix.target == 'aarch64-linux'
        run: bash test/run.sh --docs

  # the corpus differential runs where a runner executes the column natively,
  # every other column is built only
  codegen:
    name: codegen ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64 1/4, runs-on: ubuntu-latest, targets: x86_64-linux x86_64v3-linux, flags: --asm, shard: 1/4 }
          - { name: x86_64 2/4, runs-on: ubuntu-latest, targets: x86_64-linux x86_64v3-linux, flags: --asm, shard: 2/4 }
          - { name: x86_64 3/4, runs-on: ubuntu-latest, targets: x86_64-linux x86_64v3-linux, flags: --asm, shard: 3/4 }
          - { name: x86_64 4/4, runs-on: ubuntu-latest, targets: x86_64-linux x86_64v3-linux, flags: --asm, shard: 4/4 }
          - { name: aarch64, runs-on: ubuntu-24.04-arm, targets: aarch64-linux aarch64fp16-linux }
          - { name: x86_64-windows, runs-on: ubuntu-24.04-arm, targets: x86_64-windows }
          - { name: darwin, runs-on: ubuntu-24.04-arm, targets: x86_64-darwin aarch64-darwin }
          - { name: riscv64, runs-on: ubuntu-24.04-arm, targets: riscv64-linux riscv64zkt-linux riscv64zfh-linux, cross: linux-riscv64 }
          - { name: riscv32, runs-on: ubuntu-24.04-arm, targets: riscv32 }
          - { name: spirv, runs-on: ubuntu-latest, targets: spirv, flags: --dwarf, spirv: true }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      - name: install spirv-tools
        if: matrix.spirv
        run: |
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" \
            | sudo tar -xJf - -C /usr/local/bin --strip-components=3 "$VULKAN_SDK_VERSION/x86_64/bin/spirv-dis" "$VULKAN_SDK_VERSION/x86_64/bin/spirv-val"
      - name: corpus
        env:
          TARGETS: ${{ matrix.targets }}
          FLAGS: ${{ matrix.flags }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=()
          for t in $TARGETS; do args+=(--target "$t"); done
          # shard i/n takes every nth case of the sorted corpus
          if [ -n "$SHARD" ]; then
            for c in $(cd test/cases && ls -1 */*.mach | sed 's/\.mach$//' | LC_ALL=C sort |
                awk -v s="$SHARD" 'BEGIN { split(s, p, "/") } (NR - 1) % p[2] == p[1] - 1'); do
              args+=(--case "$c")
            done
          fi
          bash test/run.sh "${args[@]}" $FLAGS
      - name: cross-build the compiler
        if: matrix.cross
        run: '"$MACH" build . --target ${{ matrix.cross }} --profile release -o cross'

  link:
    name: link ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      - name: install the readers
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_MAJOR"
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y binutils gdb
      # the x86_64 leg cross-builds every foreign format, spirv included
      - name: install spirv-tools
        if: matrix.target == 'x86_64-linux'
        run: |
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" \
            | sudo tar -xJf - -C /usr/local/bin --strip-components=3 "$VULKAN_SDK_VERSION/x86_64/bin/spirv-dis" "$VULKAN_SDK_VERSION/x86_64/bin/spirv-val"
      - name: link cases
        run: bash test/run.sh --link

  release:
    name: release ${{ matrix.target }}
    if: contains(fromJSON('["all", "release"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh --fixpoint --profile release
      - name: unit suite
        run: |
          "$MACH" test . --profile release
          "$MACH" test . -a tests --profile release

  dwarf:
    name: dwarf ${{ matrix.target }}
    if: contains(fromJSON('["all", "dwarf"]'), inputs.lane)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux, aarch64-linux, riscv64-linux, riscv64zkt-linux, x86_64-windows, x86_64-darwin, aarch64-darwin]
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      - name: install llvm
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_MAJOR"
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
      - name: dwarf verify
        run: bash test/run.sh --dwarf --target "${{ matrix.target }}"

  darwin-link:
    name: link ${{ matrix.target }}
    if: contains(fromJSON('["all", "darwin-link"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      # homebrew's llvm is keg-only
      - name: install the readers
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      # run.sh passes a host it does not recognize, so the leg must be named
      - name: link cases
        env:
          LEG: ${{ matrix.target }}
        run: |
          bash test/run.sh --link | tee link.log
          grep -Eq "^legs: .* $LEG( |\$)" link.log || { echo "::error::run.sh did not run the $LEG leg"; exit 1; }

  # every f16 operation against a correctly rounded reference, 2^32 cases per
  # operation, so only a dispatch naming it runs it
  f16proof:
    name: f16proof ${{ matrix.target }} ${{ matrix.shard }}/4
    if: inputs.lane == 'f16proof'
    runs-on: ${{ startsWith(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux, x86_64v3-linux, aarch64-linux, aarch64fp16-linux]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      - name: proof
        run: bash test/run.sh --f16proof --target "${{ matrix.target }}" --shard "${{ matrix.shard }}/4"

  gate:
    name: gate
    if: always()
    needs: [docs, host, incremental, codegen, link, release, dwarf, darwin-link, f16proof]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
