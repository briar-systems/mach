name: CI

# the build, nothing else. every pull request and every merge queue entry
# builds the compiler on the linux runners. the windows, darwin and release
# lanes run only when a dispatch names one, and `lane=all` on dev is the
# release gate. the checks are local commands (CONTRIBUTING.md, "Local checks").

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      lane:
        description: lane to run beside the pull request lanes
        type: choice
        default: none
        options: [none, all, windows, darwin, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # the compiler built through the bootstrap chain, on each native runner
  host:
    name: host ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,  runs-on: ubuntu-latest }
          - { target: aarch64-linux, runs-on: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/bootstrap-chain') }}
      - run: bash .github/scripts/bootstrap.sh
      # the editor library, which only mach-lsp reaches otherwise
      - run: '"$MACH" build . -a editor'

  host-windows:
    name: host x86_64-windows
    if: contains(fromJSON('["all", "windows"]'), inputs.lane)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/bootstrap-chain') }}
      - run: bash .github/scripts/bootstrap.sh

  host-darwin:
    name: host ${{ matrix.target }}
    if: contains(fromJSON('["all", "darwin"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/bootstrap-chain') }}
      - run: bash .github/scripts/bootstrap.sh

  release:
    name: release ${{ matrix.target }}
    if: contains(fromJSON('["all", "release"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/bootstrap-chain') }}
      - run: bash .github/scripts/bootstrap.sh --profile release

  gate:
    name: gate
    if: always()
    needs: [host, host-windows, host-darwin, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
