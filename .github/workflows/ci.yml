name: CI

# a pull request proves the primary hosts: the self-host fixpoint, the unit suite
# in both profiles, the formatter, the cross-compiles, the golden disassembly of
# every ISA and the differential execution on the host. a push to main proves
# everything else: qemu, spirv, riscv32, the link cases on every leg, the dwarf
# verify and the darwin hosts natively. `workflow_dispatch` pulls one heavy job
# onto a dev build when a change touched it.
#
# until 5.0.0 is tagged the build job seeds through the audited stage chain in
# .github/actions/setup-mach; the day the tag exists the seed is the published
# binary, downloaded in one step.

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      heavy:
        description: run one of the main-only jobs on this ref
        type: choice
        default: none
        options: [none, qemu, spirv, riscv32, link, dwarf, darwin, all]

permissions:
  contents: read

env:
  # apt.llvm.org serves one build per major on amd64 and arm64; the goldens are
  # blessed with this major and test/run.sh warns on any other
  LLVM_MAJOR: 22

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - name: seed
        uses: ./.github/actions/setup-mach
      - name: fixpoint
        shell: bash
        run: |
          set -euo pipefail
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          mach dep pull .
          mach build . -o a$exe
          ./a$exe build . -o b$exe
          ./b$exe build . -o c$exe
          cmp b$exe c$exe || { echo "::error::build did not converge to the fixpoint"; exit 1; }
          mkdir -p artifact && cp c$exe artifact/mach$exe
      - uses: actions/upload-artifact@v7
        with:
          name: mach-${{ matrix.target }}
          path: artifact/mach*
          if-no-files-found: error
          retention-days: 1

  test:
    name: test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.target }}
          path: artifact
      - name: unit suite, debug and release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifact/mach*
          m=$PWD/artifact/mach; [ "$RUNNER_OS" = Windows ] && m=$m.exe
          "$m" dep pull .
          "$m" test .
          "$m" test . --profile release
      - name: formatter
        shell: bash
        run: |
          m=$PWD/artifact/mach; [ "$RUNNER_OS" = Windows ] && m=$m.exe
          "$m" fmt --check .
      - name: cross-compile the compiler
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for t in darwin-aarch64 darwin-x86_64 linux-riscv64; do
            ./artifact/mach build . --target "$t" --profile release -o "out/cross-$t"
          done

  # the golden disassembly of every ISA and the differential execution on the
  # host. one linux runner decodes every column; the arm runner adds the aarch64
  # differential natively, since qemu is compute evidence and not ABI evidence.
  codegen:
    name: codegen ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,  runs-on: ubuntu-latest,    targets: "--target x86_64-linux --target aarch64-linux --target riscv64-linux --target x86_64-windows --target x86_64-darwin --target aarch64-darwin" }
          - { target: aarch64-linux, runs-on: ubuntu-24.04-arm, targets: "--target aarch64-linux" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.target }}
          path: artifact
      - name: install llvm
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_MAJOR
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
      - name: goldens and differential
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh ${{ matrix.targets }}

  # the riscv64 differential under qemu-user
  qemu:
    name: qemu riscv64
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.heavy == 'qemu' || inputs.heavy == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install llvm and qemu
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_MAJOR
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y qemu-user
      - name: riscv64 differential
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --qemu --target riscv64-linux

  # the spirv column: build, spirv-val, spirv-dis golden. the pinned spirv-tools
  # (2026.3) ships in the Vulkan SDK for linux x86_64 only, which bounds this job
  # to that runner.
  spirv:
    name: spirv
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.heavy == 'spirv' || inputs.heavy == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VULKAN_SDK_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install spirv-tools from the Vulkan SDK
        run: |
          set -euo pipefail
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" \
            | sudo tar -xJf - -C /usr/local/bin --strip-components=3 "$VULKAN_SDK_VERSION/x86_64/bin/spirv-dis" "$VULKAN_SDK_VERSION/x86_64/bin/spirv-val"
          spirv-val --version
      - name: spirv goldens
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --target spirv

  # the riscv32 freestanding column. every case is declared away in its SKIPS
  # today (the backend does not legalize 64-bit values), so this job is the place
  # the column opens when that lands.
  riscv32:
    name: riscv32
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.heavy == 'riscv32' || inputs.heavy == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install llvm
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_MAJOR
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
      - name: riscv32 goldens
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --target riscv32

  # the link cases on every leg. the linux x86_64 leg carries every cross-built
  # format (PE, Mach-O, raw, spirv) and the riscv64 cases under qemu; the arm and
  # windows legs run what executes natively there.
  link:
    name: link ${{ matrix.target }}
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.heavy == 'link' || inputs.heavy == 'all'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.target }}
          path: artifact
      - name: install the readers
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_MAJOR
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y binutils gdb
      - name: install qemu, the riscv64 libc headers and spirv-tools
        if: matrix.target == 'x86_64-linux'
        env:
          VULKAN_SDK_VERSION: 1.4.357.0
        run: |
          set -euo pipefail
          sudo apt-get install -y qemu-user libc6-dev-riscv64-cross
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" \
            | sudo tar -xJf - -C /usr/local/bin --strip-components=3 "$VULKAN_SDK_VERSION/x86_64/bin/spirv-dis" "$VULKAN_SDK_VERSION/x86_64/bin/spirv-val"
          spirv-val --version
      - name: link cases
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifact/mach*
          m=$PWD/artifact/mach; [ "$RUNNER_OS" = Windows ] && m=$m.exe
          "$m" dep pull .
          qemu=; [ "${{ matrix.target }}" = x86_64-linux ] && qemu=--qemu
          MACH=$m bash test/run.sh --link $qemu

  # every case built with -g through llvm-dwarfdump --verify on the ELF and
  # Mach-O targets
  dwarf:
    name: dwarf
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.heavy == 'dwarf' || inputs.heavy == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install llvm
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_MAJOR
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
      - name: dwarf verify
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --dwarf --target x86_64-linux --target aarch64-linux --target riscv64-linux --target x86_64-darwin --target aarch64-darwin

  # the darwin hosts natively, on the metered runners: linux cross-builds the
  # seed, each host reaches its own fixpoint and runs the unit suite. this is
  # the release gate.
  darwin-seed:
    name: darwin seed
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.heavy == 'darwin' || inputs.heavy == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: cross-build the darwin seeds
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          mkdir -p seed
          ./artifact/mach build . --target darwin-aarch64 --profile release -o seed/mach-aarch64-darwin
          ./artifact/mach build . --target darwin-x86_64 --profile release -o seed/mach-x86_64-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-seed
          path: seed/
          if-no-files-found: error
          retention-days: 1

  darwin:
    name: darwin ${{ matrix.target }}
    needs: darwin-seed
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-darwin must self-host on real Intel silicon: under Rosetta 2
          # mach's raw bsdthread_create worker threads crash (#2104)
          - { target: aarch64-darwin, runs-on: macos-15,       machine: arm64 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel, machine: x86_64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: darwin-seed
          path: seed
      - name: fixpoint and unit suite
        env:
          WANT: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          got=$(uname -m); translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
          [ "$got" = "$WANT" ] && [ "$translated" = 0 ] || { echo "::error::the $WANT lane landed on a $got host (proc_translated=$translated)"; exit 1; }
          chmod +x seed/mach-${{ matrix.target }}
          ./seed/mach-${{ matrix.target }} dep pull .
          ./seed/mach-${{ matrix.target }} build . -o a
          ./a build . -o b
          ./b build . -o c
          cmp b c || { echo "::error::darwin build did not converge to the fixpoint"; exit 1; }
          ./c test .
          ./c test . --profile release
