name: CI

# a pull request into dev runs the legs its changed paths select, read from
# .github/scripts/ci-legs.sh, the one table mapping paths to legs (#3945): a docs
# change runs the docs checks alone, any compiler source the fixpoint and the
# unit suite, one target's codegen or ABI that target's corpus column and qemu
# leg, the linker or an object writer the link lane and the matching OS leg, debug
# info the dwarf verify, spirv the spirv leg. a path the table does not know runs
# everything. a pull request into main runs everything whatever it touches: it is
# the backstop for what a path cannot show, such as an IR change shifting every
# target. every change reaches a branch through a pull request, so nothing runs
# on push, and nothing runs on a schedule. `workflow_dispatch` runs the compiler
# legs and every corpus column on any ref, plus the heavy job it names.
#
# a push to a pull request cancels that pull request's run in flight: only the
# newest head is worth proving. dispatch runs are never cancelled.
#
# `gate` needs every job and is the one required check: a job skipped by the
# selection passes, a failed or cancelled one does not. a new job joins `gate`'s
# needs and gets a leg in ci-legs.sh.
#
# every host seeds from the published release .github/actions/seed-mach pins,
# downloaded and verified against SHA256SUMS in one step.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: run one of the main-only jobs on this ref
        type: choice
        default: none
        options: [none, qemu, spirv, riscv32, link, dwarf, darwin, release, all]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # apt.llvm.org serves one build per major on amd64 and arm64; the link and
  # dwarf readers are this major
  LLVM_MAJOR: 22

jobs:
  # the legs this run needs, from the event and the changed paths. on a pull
  # request the checkout is the merge commit, so its first parent is the base.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.legs.outputs.build }}
      compiler: ${{ steps.legs.outputs.compiler }}
      corpus: ${{ steps.legs.outputs.corpus }}
      link: ${{ steps.legs.outputs.link }}
      qemu: ${{ steps.legs.outputs.qemu }}
      riscv32: ${{ steps.legs.outputs.riscv32 }}
      spirv: ${{ steps.legs.outputs.spirv }}
      dwarf: ${{ steps.legs.outputs.dwarf }}
      darwin: ${{ steps.legs.outputs.darwin }}
      release: ${{ steps.legs.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: legs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAVY: ${{ inputs.heavy }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ] && [ "$BASE" = main ]; then
            .github/scripts/ci-legs.sh all
          elif [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | .github/scripts/ci-legs.sh paths
          else
            .github/scripts/ci-legs.sh heavy "$HEAVY"
          fi | tee -a "$GITHUB_OUTPUT"

  # what the docs claim, checked against the tree (#3582), on every pull request.
  # the job builds its own compiler from the seed rather than wait for the
  # fixpoint, so a docs change runs nothing else:
  # - documented flags: a flag doc/ attaches to a command that `mach help` does
  #   not list for it (#3579). only two shapes are read, a `mach <cmd> [<action>]
  #   ... --flag` spelling and a paragraph led by **`--flag`.** that names the
  #   commands taking it. a flag documented in any other prose shape is not
  #   checked. CHANGELOG is history and is not read.
  # - reference drift: doc/mach and doc/README.md are what `mach doc .` writes
  #   (#3458). a doc-comment edit whose page was not regenerated, and a page whose
  #   module is gone, both fail here.
  # - unshipped markers: a doc/language sentence saying phase N, not yet, a later
  #   release or planned must cite an open issue (#3581). a closed issue, no
  #   citation and an unreachable API each fail. a stale marker whose issue stays
  #   open for an unrelated reason is not caught.
  # - the doc/language code blocks compile, match mach fmt and run on x86_64;
  #   incremental runs them on aarch64 when the compiler changed.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
      - name: seed
        uses: ./.github/actions/seed-mach
      - name: build this compiler
        run: |
          set -euo pipefail
          mach dep pull .
          # a seed older than #3813 builds every artifact without a selector
          mach build . --bin mach -o a
      - name: documented flags are accepted
        run: python3 .github/scripts/doc-flags.py ./a doc
      - name: the committed reference is what mach doc generates
        run: |
          set -euo pipefail
          ./a doc . --out out/docgen -q
          diff -r out/docgen/mach doc/mach
          diff out/docgen/README.md doc/README.md
      - name: unshipped markers cite open issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/doc-markers.py doc/language
      - name: doc/language code blocks compile and run
        run: MACH=$PWD/a bash test/run.sh --docs

  build:
    name: build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - name: seed
        uses: ./.github/actions/seed-mach
      - name: fixpoint
        shell: bash
        run: |
          set -euo pipefail
          exe=; bin=mach; [ "$RUNNER_OS" = Windows ] && exe=.exe && bin=mach-windows
          mach dep pull .
          # a seed older than #3813 builds every artifact without a selector
          mach build . --bin $bin -o a$exe
          ./a$exe build . -o b$exe
          ./b$exe build . -o c$exe
          cmp b$exe c$exe || { echo "::error::build did not converge to the fixpoint"; exit 1; }
          mkdir -p artifact && cp c$exe artifact/mach$exe
      - uses: actions/upload-artifact@v7
        with:
          name: mach-${{ matrix.target }}
          path: artifact/mach*
          if-no-files-found: error
          retention-days: 1

  # one job per host and profile, so no host's suite runs both profiles in series
  test:
    name: test ${{ matrix.host.target }} ${{ matrix.profile }}
    needs: [changes, build]
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ${{ matrix.host.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        host:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.host.target }}
          path: artifact
      # the compiler's own closure, then the test-only suites of the tests artifact
      - name: unit suite
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          chmod +x artifact/mach*
          m=$PWD/artifact/mach; [ "$RUNNER_OS" = Windows ] && m=$m.exe
          "$m" dep pull .
          "$m" test . --profile "$PROFILE"
          "$m" test . --lib tests --profile "$PROFILE"
      - name: formatter
        if: matrix.profile == 'debug'
        shell: bash
        run: |
          m=$PWD/artifact/mach; [ "$RUNNER_OS" = Windows ] && m=$m.exe
          "$m" fmt --check .
      - name: cross-compile the compiler
        if: runner.os == 'Linux' && matrix.profile == 'debug'
        run: |
          set -euo pipefail
          for t in darwin-aarch64 darwin-x86_64 linux-riscv64; do
            ./artifact/mach build . --target "$t" --profile release -o "out/cross-$t"
          done

  # the warm build path against clean builds, which the from-scratch fixpoint
  # never reaches (#2045)
  incremental:
    name: incremental ${{ matrix.target }}
    needs: [changes, build]
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,  runs-on: ubuntu-latest }
          - { target: aarch64-linux, runs-on: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.target }}
          path: artifact
      - name: warm rebuilds match clean
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --incremental
      # docs runs them on x86_64; here the example mains execute on aarch64
      - name: doc/language code blocks compile and run
        if: matrix.target == 'aarch64-linux'
        run: |
          set -euo pipefail
          MACH=$PWD/artifact/mach bash test/run.sh --docs

  # the corpus differential against C, one job per target column. a column this
  # host cannot execute is built only; aarch64-linux runs natively on the arm
  # runner, since qemu is compute evidence and not ABI evidence.
  codegen:
    name: codegen ${{ matrix.target }}
    needs: [changes, build]
    if: needs.changes.outputs.corpus != '[]'
    runs-on: ${{ matrix.target == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.corpus) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.target == 'aarch64-linux' && 'aarch64-linux' || 'x86_64-linux' }}
          path: artifact
      - name: differential
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --target "$TARGET"

  # the riscv64 differential under qemu-user
  qemu:
    name: qemu riscv64
    needs: [changes, build]
    if: needs.changes.outputs.qemu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: riscv64 differential
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --qemu --target riscv64-linux --target riscv64zkt-linux

  # the spirv column: build and spirv-val, and the debug model. spirv-tools ships
  # in the Vulkan SDK for linux x86_64 only, which bounds this job to that runner.
  spirv:
    name: spirv
    needs: [changes, build]
    if: needs.changes.outputs.spirv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VULKAN_SDK_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install spirv-tools from the Vulkan SDK
        run: |
          set -euo pipefail
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" \
            | sudo tar -xJf - -C /usr/local/bin --strip-components=3 "$VULKAN_SDK_VERSION/x86_64/bin/spirv-dis" "$VULKAN_SDK_VERSION/x86_64/bin/spirv-val"
          spirv-val --version
      - name: spirv validation and the debug model
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --target spirv --dwarf

  # the riscv32 differential under qemu-user: the freestanding column's run bins,
  # re-laid for the loader by test/lib/elf_loadable.py. codegen builds the column on
  # every pull request; test/cases/NORUN.riscv32 lists the cases whose
  # differential is known wrong today and SKIPS.riscv32 the ones that do not build.
  riscv32:
    name: qemu riscv32
    needs: [changes, build]
    if: needs.changes.outputs.riscv32 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: riscv32 differential
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --qemu --target riscv32

  # the link cases on every leg. the linux x86_64 leg carries every cross-built
  # format (PE, Mach-O, raw, spirv) and the riscv64 cases under qemu; the arm and
  # windows legs run what executes natively there. the darwin legs run in the
  # darwin job, on the fixpoint that host builds for itself.
  link:
    name: link ${{ matrix.target }}
    needs: [changes, build]
    if: needs.changes.outputs.link != '[]'
    runs-on: ${{ matrix.target == 'aarch64-linux' && 'ubuntu-24.04-arm' || matrix.target == 'x86_64-windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.link) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.target }}
          path: artifact
      - name: install the readers
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_MAJOR
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y binutils gdb
      - name: install qemu, the riscv64 libc headers and spirv-tools
        if: matrix.target == 'x86_64-linux'
        env:
          VULKAN_SDK_VERSION: 1.4.357.0
        run: |
          set -euo pipefail
          sudo apt-get install -y qemu-user libc6-dev-riscv64-cross
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" \
            | sudo tar -xJf - -C /usr/local/bin --strip-components=3 "$VULKAN_SDK_VERSION/x86_64/bin/spirv-dis" "$VULKAN_SDK_VERSION/x86_64/bin/spirv-val"
          spirv-val --version
      - name: link cases
        shell: bash
        run: |
          set -euo pipefail
          chmod +x artifact/mach*
          m=$PWD/artifact/mach; [ "$RUNNER_OS" = Windows ] && m=$m.exe
          "$m" dep pull .
          qemu=; [ "${{ matrix.target }}" = x86_64-linux ] && qemu=--qemu
          MACH=$m bash test/run.sh --link $qemu

  # every case built with -g through llvm-dwarfdump --verify on the ELF and
  # Mach-O targets
  dwarf:
    name: dwarf
    needs: [changes, build]
    if: needs.changes.outputs.dwarf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-x86_64-linux
          path: artifact
      - name: install llvm
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_MAJOR
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
      - name: dwarf verify
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull .
          MACH=$PWD/artifact/mach bash test/run.sh --dwarf --target x86_64-linux --target aarch64-linux --target riscv64-linux --target riscv64zkt-linux --target x86_64-windows --target x86_64-darwin --target aarch64-darwin

  # the darwin hosts natively, on the metered runners: each host seeds from its
  # own published archive, reaches its own fixpoint, and runs the unit suite and
  # the link cases (#3857). this is the release gate.
  darwin:
    name: darwin ${{ matrix.target }}
    needs: [changes, build]
    if: needs.changes.outputs.darwin == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-darwin must self-host on real Intel silicon: under Rosetta 2
          # mach's raw bsdthread_create worker threads crash (#2104)
          - { target: aarch64-darwin, runs-on: macos-15,       machine: arm64 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel, machine: x86_64 }
    steps:
      - uses: actions/checkout@v6
      - name: seed
        uses: ./.github/actions/seed-mach
      - name: fixpoint
        env:
          WANT: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          got=$(uname -m); translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
          [ "$got" = "$WANT" ] && [ "$translated" = 0 ] || { echo "::error::the $WANT lane landed on a $got host (proc_translated=$translated)"; exit 1; }
          mach dep pull .
          # a seed older than #3813 builds every artifact without a selector
          mach build . --bin mach -o a
          ./a build . -o b
          ./b build . -o c
          cmp b c || { echo "::error::darwin build did not converge to the fixpoint"; exit 1; }
      - name: unit suite
        run: |
          set -euo pipefail
          ./c test .
          ./c test . --profile release
          ./c test . --lib tests
          ./c test . --lib tests --profile release
      # the macho checks read with llvm-readobj, which xcode does not ship, and
      # homebrew's llvm is keg-only, so its bin joins PATH
      - name: install the readers
        run: |
          set -euo pipefail
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      # a host run.sh does not recognize runs no darwin cell and passes, so the
      # step also requires this host's leg in the legs run.sh chose
      - name: link cases
        env:
          LEG: ${{ matrix.target }}
        run: |
          set -euo pipefail
          MACH=$PWD/c bash test/run.sh --link | tee link.log
          grep -Eq "^legs: .* $LEG( |\$)" link.log || { echo "::error::run.sh did not run the $LEG leg"; exit 1; }

  # the binary cd.yml ships is the release-profile build, so it must reach its
  # own fixpoint and pass the unit suite before main takes the change
  release:
    name: release ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - name: seed
        uses: ./.github/actions/seed-mach
      - name: release fixpoint and unit suite
        shell: bash
        run: |
          set -euo pipefail
          exe=; bin=mach; [ "$RUNNER_OS" = Windows ] && exe=.exe && bin=mach-windows
          mach dep pull .
          # a seed older than #3813 builds every artifact without a selector
          mach build . --bin $bin --profile release -o a$exe
          ./a$exe build . --profile release -o b$exe
          ./b$exe build . --profile release -o c$exe
          cmp b$exe c$exe || { echo "::error::release build did not converge to the fixpoint"; exit 1; }
          ./c$exe test .
          ./c$exe test . --profile release
          ./c$exe test . --lib tests
          ./c$exe test . --lib tests --profile release

  # the one required check. skipped is a pass, so a leg the selection leaves out
  # does not block, and a failed or cancelled job does.
  gate:
    name: gate
    if: always()
    needs: [changes, docs, build, test, incremental, codegen, qemu, spirv, riscv32, link, dwarf, darwin, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          [ -z "$bad" ] || { echo "::error::gate: not passed: $bad"; exit 1; }
