name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# every native host gets these checks: "build <target>" proves the most recent
# release (the seed) builds the project to a self-host fixpoint. "test <target>"
# reuses that fixpoint compiler to run the in-source corpus. "incremental
# <target>" proves the warm/incremental build path matches a clean build both at
# rest and after an edit (the query engine's invalidation, unexercised by the
# from-scratch fixpoint). "release <target>" repeats the fixpoint under the opt=2
# release profile so -O2 codegen regressions surface on PRs, not only at tag time.
#
# darwin is the exception: it gates the dev -> main release merge only, not every
# PR into dev, since the macOS runners are slow and metered. see the "darwin"
# job below and darwin-lane.yml (shared with cd.yml, so the gate can never drift
# from the lane CD actually runs).
jobs:
  build-linux:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build fixpoint
        run: |
          set -euo pipefail

          mach dep pull
          mach build . -o a
          ./a build . -o b
          ./b build . -o c

          # compare b and c to identify non-determinism
          if ! cmp -s b c; then
            echo "::error::build did not converge to the fixpoint"
            exit 1
          fi

          # hand the fixpoint binary to the test job
          mkdir -p artifact
          cp c artifact/mach

      - name: upload fixpoint result
        uses: actions/upload-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact/mach
          if-no-files-found: error
          retention-days: 1

  test-linux:
    name: test ${{ matrix.target }}
    needs: build-linux
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: download the fixpoint result
        uses: actions/download-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact

      - name: self test
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull
          ./artifact/mach test .

  incremental-linux:
    name: incremental ${{ matrix.target }}
    needs: build-linux
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: download the fixpoint result
        uses: actions/download-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact

      - name: incremental determinism
        run: |
          set -euo pipefail
          chmod +x artifact/mach
          ./artifact/mach dep pull
          bash test/determinism.sh ./artifact/mach .

  release-linux:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runs-on: ubuntu-latest
          - target: aarch64-linux
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build release fixpoint
        run: |
          set -euo pipefail
          mach dep pull
          mach build . --profile release -o a
          ./a build . --profile release -o b
          ./b build . --profile release -o c

          # the opt=2 compiler must rebuild itself byte-identically
          if ! cmp -s b c; then
            echo "::error::release build did not converge to the fixpoint"
            exit 1
          fi

      - name: self test
        run: |
          set -euo pipefail
          ./c test .

  build-windows:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build fixpoint
        run: |
          mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mach.exe build . -o a.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./a.exe build . -o b.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./b.exe build . -o c.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # compare b and c to identify non-determinism (no cmp in pwsh)
          if ((Get-FileHash b.exe).Hash -ne (Get-FileHash c.exe).Hash) {
            Write-Error 'build did not converge to the fixpoint'
            exit 1
          }

          # hand the fixpoint binary to the test job
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item c.exe artifact/mach.exe -Force

      - name: upload fixpoint result
        uses: actions/upload-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact/mach.exe
          if-no-files-found: error
          retention-days: 1

  test-windows:
    name: test ${{ matrix.target }}
    needs: build-windows
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: download the fixpoint result
        uses: actions/download-artifact@v4
        with:
          name: mach-${{ matrix.target }}
          path: artifact

      - name: self test
        run: |
          ./artifact/mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # `mach test` takes the first declared artifact as its primary, and that
          # stanza does not declare windows, so name the windows one (#2961)
          ./artifact/mach.exe test . --bin mach-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release-windows:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build release fixpoint
        run: |
          mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mach.exe build . --profile release -o a.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./a.exe build . --profile release -o b.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./b.exe build . --profile release -o c.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # the opt=2 compiler must rebuild itself byte-identically (no cmp in pwsh)
          if ((Get-FileHash b.exe).Hash -ne (Get-FileHash c.exe).Hash) {
            Write-Error 'release build did not converge to the fixpoint'
            exit 1
          }

      - name: self test
        run: |
          # see the debug leg: the first declared artifact is not the windows one (#2961)
          ./c.exe test . --bin mach-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  # the leg set is data-driven from test/engines.conf: this setup job turns the
  # pr-cadence rows into the include list the suites matrix over, so registering a
  # target is one row and no workflow edit - which is what that file's header has
  # always promised and what CI was the last place to make false.
  #
  # a leg is a RUNNER, not a target row, and the runner column is what assigns rows to
  # it: the five ubuntu-latest rows (x86_64-linux, riscv64-linux, riscv32, spirv,
  # mos6502) are one job covering all five rather than five jobs each rebuilding the
  # same compiler. that list is handed to the suites rather than re-derived by them,
  # which is the one rule #2948 settled. ci-legs.sh refuses a runner whose
  # rows disagree about cadence instead of silently picking one.
  test-legs:
    name: test legs
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v6
      - id: gen
        run: echo "include=$(bash test/ci-legs.sh pr)" >> "$GITHUB_OUTPUT"

  # one job per pr-cadence runner: build a from-source compiler on that host, then
  # run both suites over the targets it serves. the corpus answers what the compiler
  # computes and the link suite answers what it emits and links, and neither can see
  # the other's defects, so a leg runs both or covers neither half.
  test-targets:
    name: targets on ${{ matrix.runner }}
    needs: test-legs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-legs.outputs.include) }}
    steps:
      - uses: actions/checkout@v6

      # the qemu interpreters this runner's own engine columns name, and nothing
      # more: a runner installs the emulator for the rows it carries.
      - name: install qemu-user
        if: matrix.qemu != ''
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-user

      # a cross build needs the target's libc headers as soon as a case's C probe
      # includes one, and riscv64-linux is the only row whose runner is not its own
      # ISA. keyed on the leg list rather than on qemu: this package is riscv64's,
      # and a future qemu row of another ISA needs its own, not this one. cc.sh names
      # the same path in its --sysroot and refuses loudly without it (#2741, #2771).
      - name: install riscv64 cross libc headers
        if: contains(matrix.legs, 'riscv64-linux')
        uses: ./.github/actions/apt-install
        with:
          packages: libc6-dev-riscv64-cross

      # gdb and binutils are the runner's own, read by the link suite's debug-info and
      # symbol-table cases. tools.lock pins neither, so apt's is the record.
      #
      # no cc65: the mos6502 column declares `* ab` in its SKIPS, so no run reaches
      # da65 and tools.lock pins no version for it. installing an unpinned decoder
      # nothing runs would make the leg look like it covers a column it does not.
      - name: install the unpinned host tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: binutils gdb

      # the pinned external oracles both suites are grounded in, at the versions
      # test/tools.lock names and from the sources it records. the runner images carry
      # neither (llvm 18 and spirv-tools 2025.1 on ubuntu, llvm 20 and no spirv-tools
      # on windows) against pins of llvm 22 and spirv-tools 2026.3, so all three legs
      # refused to start (#2948). ci-tools.sh asks the driver which rows THIS RUNNER
      # owns and installs exactly those, so the workflow holds no copy of a version
      # and cannot install one thing while the driver demands another.
      - name: install the pinned oracles
        shell: bash
        run: bash test/ci-tools.sh ${{ matrix.runner }}

      # the seed lands on PATH via GITHUB_PATH, which only takes effect in later
      # steps, so the fetch and the build are separate (as in the build lanes).
      - name: fetch released mach
        uses: ./.github/actions/seed-mach

      - name: build the from-source compiler
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mach dep pull
          mach build . -o m

      - name: build the from-source compiler (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mach.exe dep pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mach.exe build . -o m.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: name the compiler under test
        shell: bash
        run: |
          set -euo pipefail
          m=./m; [ -f ./m.exe ] && m=./m.exe
          echo "MACH_CORPUS_MACH=$PWD/${m#./}" >> "$GITHUB_ENV"
          echo "MACH_LINK_MACH=$PWD/${m#./}" >> "$GITHUB_ENV"

      # THE REGISTRY DECIDES WHAT A LEG COVERS. the driver used to select by host
      # CAPABILITY, and a target with `engine none` needs no execution host at all, so
      # spirv, riscv32 and mos6502 were recomputed on every runner - including windows,
      # where the pinned spirv-tools has no build to install (#2948). "can this machine
      # serve it" and "which leg carries it" are different questions and only the
      # runner column answers the second.
      #
      # the workflow names THE RUNNER IT IS RUNNING ON and nothing else. it does not
      # name a target list, because a workflow that names a leg is a workflow that can
      # claim a leg it never ran: the driver reads engines.conf itself, covers the rows
      # assigned to that label, and refuses loudly naming any row this host cannot
      # serve rather than silently substituting a set it can.
      - name: codegen corpus
        shell: bash
        run: bash test/run.sh --runner "${{ matrix.runner }}"

      # no --leg for the link suite: its own selection already agrees with the
      # registry, because it declines a row whose os and isa no host matches and that
      # is every `engine none` row. its spirv cases are declared `legs: x86_64-linux`
      # with `target: spirv`, which is the same statement the runner column makes.
      #
      # the pr lane keeps the default `--deps float`: resolving mach-std's branch tip
      # fresh is what catches a downstream break on the pull request that would first
      # trip over it. the release gate pins instead (test-main.yml).
      - name: link suite
        shell: bash
        run: bash test/link/run.sh

      # both matrices, uploaded whether the run passed or failed: a red run's
      # coverage is the more interesting of the two, and "which cells did it even
      # reach" is not answerable from a log line.
      - name: upload the coverage matrices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-${{ matrix.runner }}
          path: |
            test/out/matrix.tsv
            test/link/out/matrix.tsv
            test/link/out/deps.txt
          if-no-files-found: warn

  # the pinned lane, on the runner that carries every case with a dependency.
  #
  # `--deps pin` is what the release gate (test-main.yml) and any bisect over mach
  # commits run, so it has to work on an ordinary day, not only on the day someone
  # needs it. it did not: #2729 sat unnoticed because the only pinned run in CI was
  # the main-cadence darwin one, and the cases that broke it were not in that leg
  # set. a lane exercised only where the gap cannot appear is not exercised.
  #
  # a SEPARATE job rather than a second run inside the linux leg: two runs in one
  # checkout would have the second overwrite the first's deps.txt, and the record of
  # what the float lane resolved is the artifact #2592 added.
  link-pin:
    name: link pinned (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: install the unpinned host tools
        uses: ./.github/actions/apt-install
        with:
          packages: binutils gdb
      # the runner label, same as the leg jobs: engines.conf gives ubuntu-latest the
      # spirv row, and the link suite's spirv cases are declared `legs: x86_64-linux`
      # with `target: spirv`, which is the same statement. so this job needs the pinned
      # spirv-tools and gets it from the registry rather than from a list written here.
      - name: install the pinned oracles
        run: bash test/ci-tools.sh ubuntu-latest
      - name: fetch released mach
        uses: ./.github/actions/seed-mach
      - name: build the from-source compiler
        run: |
          set -euo pipefail
          mach dep pull
          mach build . -o m
      - name: run the link suite pinned
        run: MACH_LINK_MACH=$PWD/m bash test/link/run.sh --deps pin --leg x86_64-linux
      - name: upload the dependency resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-deps-pin-linux
          path: test/link/out/deps.txt
          if-no-files-found: warn

  # the release gate: only PRs targeting main (the dev -> main release merge) get
  # a macOS runner. every other PR base schedules nothing here. #2179.
  darwin:
    name: darwin (release gate)
    if: github.base_ref == 'main'
    uses: ./.github/workflows/darwin-lane.yml
