name: classify SPIR-V audit output
on:
  push:
    branches: [fix/3150-verify]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
      - name: Install committed oracle pins
        run: bash test/ci-tools.sh ubuntu-latest
      - name: Capture serial seed and audited SPIR-V evidence
        run: python3 .github/scripts/spirv-audit.py
      - name: Retain classification inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spirv-audit-evidence
          path: spirv-evidence/
