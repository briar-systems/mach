name: native Windows carrier corpus observation
on:
  push:
    branches: [fix/3199-proof]
permissions:
  contents: read
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seed-mach
        id: seed
      - name: Install pinned corpus oracles
        shell: bash
        run: bash test/ci-tools.sh windows-latest
      - name: Retain exact carrier corpus disassemblies
        shell: bash
        env:
          SEED_TAG: ${{ steps.seed.outputs.tag }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export MACH_AUDIT_BASH="$(cygpath -w "$BASH")"
          fi
          python .github/scripts/windows-corpus-observe.py
      - name: Retain native proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-carrier-corpus
          path: windows-corpus-evidence/
