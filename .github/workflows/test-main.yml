name: test main

# the main-cadence legs of the target registry run on merge to main (and on manual
# dispatch) rather than per pull request: the macOS runners are metered, and a
# from-source compiler for each darwin target has to be cross-built on linux first.
# running at the release-integration gate catches a darwin regression there while
# paying the macOS cost only then.
#
# the leg set is data-driven from test/engines.conf's cadence column, so promoting a
# target between cadences is one edit to that row. it is not free: a link case must
# declare a [target.<t>] block for every leg it runs on, and the link driver checks
# that before it builds anything - on every leg, including the pr ones, because
# main-cadence-only enforcement is no enforcement (#2353).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-legs:
    name: test legs
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v6
      - id: gen
        run: echo "include=$(bash test/ci-legs.sh main)" >> "$GITHUB_OUTPUT"

  # no darwin seed is published, so the from-source compiler for each darwin target
  # is cross-built on linux from the x86_64-linux seed and handed to the macOS
  # runner. this mirrors the darwin-lane.yml bootstrap; collapse it once a darwin
  # archive self-seeds.
  #
  # the cross-build names the target in the REPO'S OWN mach.toml, which is a
  # different vocabulary from the registry's leg names, so the mapping is written
  # here rather than derived from a leg name that happens to look similar.
  seed:
    name: seed ${{ matrix.runner }}
    needs: test-legs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-legs.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
      - name: fetch released mach
        uses: ./.github/actions/seed-mach
      - name: cross-build the from-source compiler
        run: |
          set -euo pipefail
          case "${{ matrix.legs }}" in
            x86_64-darwin)  root=darwin-x86_64 ;;
            aarch64-darwin) root=darwin-aarch64 ;;
            *) echo "::error::no repo manifest target for legs '${{ matrix.legs }}'"; exit 1 ;;
          esac
          mach dep pull
          mach build . -o m
          ./m build . --target "$root" --profile release -o mach-${{ matrix.runner }}
      - uses: actions/upload-artifact@v7
        with:
          name: mach-${{ matrix.runner }}
          path: mach-${{ matrix.runner }}
          if-no-files-found: error
          retention-days: 1

  # timeout-minutes bounds execution, not queue time: a leg pinned to an unavailable
  # runner class still sits in queue to GitHub's 24h cap (#1787). keeping every row
  # on an available runner class is the real guard.
  test-targets:
    name: targets on ${{ matrix.runner }}
    needs: [test-legs, seed]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-legs.outputs.include) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mach-${{ matrix.runner }}

      # the pinned external oracles, from test/tools.lock and its recorded sources.
      # ci-tools.sh installs llvm through homebrew here and checks the major it got
      # against the pin, since brew's `llvm` formula is whatever is current and would
      # otherwise walk past the pin silently on the day the next major ships.
      #
      # no spirv-tools on a darwin leg: engines.conf gives the spirv row an
      # ubuntu-latest runner and the link suite's spirv cases name x86_64-linux, so
      # nothing here reaches spirv-val, and the pinned build is linux x86_64 only.
      - name: install the pinned oracles
        run: bash test/ci-tools.sh ${{ matrix.runner }}

      - name: name the compiler under test
        run: |
          set -euo pipefail
          chmod +x mach-${{ matrix.runner }}
          echo "MACH_CORPUS_MACH=$PWD/mach-${{ matrix.runner }}" >> "$GITHUB_ENV"
          echo "MACH_LINK_MACH=$PWD/mach-${{ matrix.runner }}" >> "$GITHUB_ENV"

      # this leg takes a BINARY from the seed job rather than building here, so it
      # never runs the `mach dep pull` a from-source build does, and the checkout has
      # no `dep/`. every other leg gets the pull for free from its own build, which is
      # why nothing else needs this step and why the gap only shows on the two darwin
      # rows. the corpus refuses to start without mach-std rather than skipping the
      # cases that need it, which is how this surfaced as a red leg instead of a
      # quietly smaller run.
      - name: materialise dependencies
        run: ./mach-${{ matrix.runner }} dep pull .

      # the registry decides what this leg covers, exactly as on the pr lane: see the
      # comment on the same step in ci.yml.
      - name: codegen corpus
        run: bash test/run.sh --runner "${{ matrix.runner }}"

      # `--deps pin` because this is the release-integration gate: every case resolves
      # the commit this repo's own mach.lock records, which is the one the compiler
      # being gated was built against, so a red gate here is caused by the code being
      # released and not by a mach-std merge that landed since, and two runs of the
      # same mach commit stay comparable (#2592). the pr lane still floats (ci.yml),
      # which is where a downstream break is meant to surface first.
      - name: link suite pinned
        run: bash test/link/run.sh --deps pin

      - name: upload the coverage matrices
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-${{ matrix.runner }}
          path: |
            test/out/matrix.tsv
            test/link/out/matrix.tsv
            test/link/out/deps.txt
          if-no-files-found: warn
