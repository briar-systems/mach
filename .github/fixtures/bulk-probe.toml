[project]
id = "probe"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"
[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"
[profile.debug]
opt = 0
debug = false
simd = "scalarize"
[profile.release]
opt = 2
debug = false
simd = "scalarize"
[artifact.probe]
kind = "bin"
entry = "main.mach"
out = "bin/probe"
targets = ["*"]
link = []
need = []
[dep.std]
path = "../../dep/std"
