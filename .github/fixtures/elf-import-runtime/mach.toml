[project]
id = "got_import_runtime"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.x86_64-linux]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[step.probe]
argv = ["bash", "build.sh", "{project.out}/obj", "out/{target.name}/{profile.name}/obj/libprovider.so"]
in = ["build.sh", "provider.c", "probe.c"]
out = ["{project.out}/obj/probe.o", "{project.out}/obj/libprovider.so", "{project.out}/obj/probe.relocs"]
need = []

[link.probe]
source = "local"
path = "{project.out}/obj/probe.o"
os = ["linux"]
isa = ["x86_64"]
abi = ["sysv64"]
export = false

[link.provider]
source = "local"
path = "{project.out}/obj/libprovider.so"
library = "got-provider"
symbols = ["got_value", "got_object"]
os = ["linux"]
isa = ["x86_64"]
abi = ["sysv64"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe", "provider"]
need = ["probe"]

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "commit/c6a8816933fffa8ee490bb0bed8a97e7f0c1b296"
