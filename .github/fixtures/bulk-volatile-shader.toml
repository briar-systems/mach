[project]
id = "bulk_shader"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"
[target.spirv]
isa = "spirv"
os = "freestanding"
abi = "spirv"
[profile.debug]
opt = 0
debug = false
simd = "scalarize"
[profile.release]
opt = 2
debug = false
simd = "scalarize"
[artifact.shader]
kind = "bin"
entry = "main.mach"
out = "bin/shader"
targets = ["spirv"]
link = []
need = []
