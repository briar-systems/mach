# an import pinned to a library the link provides as a STATIC input is refused by
# naming that fact, not by claiming the library is absent from the link (#2800).
#
# THE LINK HERE HAS NO DYNAMIC INPUT AT ALL, deliberately. that is the arm whose
# wording used to be decided by accident: the same broken program read
# "undefined symbol" with no shared library in the link and "pinned to library 'L'
# not among the link's dependencies" the moment any unrelated one joined it, and
# the second was false both times. `2800-pin-to-absent-library` is the sibling that
# holds the genuine refusal, so the two messages are pinned against each other and
# a fix cannot collapse one into the other.
run: build-fails
targets: linux
profiles: debug
