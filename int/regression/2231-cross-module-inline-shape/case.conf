# the CALL-SHAPE case for #2231: a cross-module `#[inline]` callee leaves no call.
#
# the observable is the emitted shape because the value is not one. inlining preserves
# values by definition, so the sibling `2231-cross-module-inline-asm` case stays green
# whether the cross-module flow works or has silently stopped. only the surviving call
# count moves, and that is what this reads.
#
# release only: the inline pass does not run in the debug pipeline, so a debug golden
# would report `calls=1` on every line and assert nothing about this issue.
#
# the ELF legs only, matching const-pool / vector-emit. the inline decision is made in
# the middle end and is identical on every OS for a given ISA, so a windows or darwin
# golden would re-assert its linux twin's; they are also the legs without a dependable
# llvm-objdump.
run: call-shape
profiles: release
targets: linux linux-arm64 linux-riscv64
