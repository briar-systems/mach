# build-only: a flat image must CARRY its zero-initialized data, not leave it past
# the end of the file for a startup that cannot exist. the observable is the image
# emitting at all; the byte-level assertion lives in the raw writer's unit test,
# which can read the file directly. no bmos runner exists, so the image is not run.
run: built
targets: linux
build-target: bmos-x86_64
