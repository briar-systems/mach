[project]
id = "vend"
version = "0.0.0"
src = "src"
out = "out"

[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[step.vendor]
cmd = "mkdir -p {project.out}/vendor {project.out}/obj/vend && touch {project.out}/vendor/lib.o && touch {project.out}/obj/vend/window.o"
in  = ["src/main.mach"]
out = ["{project.out}/vendor/lib.o"]
need = []

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = []
need = ["vendor"]

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
