# binary-inspection case: builds the fixture with and without `-g` and crosses the two
# halves of every frame-slot variable location against each other - each `DW_OP_fbreg`
# offset must name an address the same function's emitted code addresses from the
# register `DW_AT_frame_base` names. inspecting the offset alone cannot see #2759,
# because the producer derived the frame's reserved top a second way and was
# self-consistent with itself while pointing 16 to 200 bytes past the variable.
#
# runs on every ELF leg, but only the riscv64 one can fail it: x86-64 and aarch64
# reserve nothing between the frame pointer and the slot region, so their two
# derivations agreed and that is exactly why this went unnoticed. the golden is shared
# because both facts are counts of a property that holds identically on every target.
run: varloc-fbreg
targets: linux linux-arm64 linux-riscv64
