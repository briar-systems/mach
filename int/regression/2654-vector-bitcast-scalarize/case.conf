# a `:~` bit reinterpret BETWEEN two vector types must survive scalarization (#2654).
# every operator in the signed-select idiom scalarized; the reinterpret did not, so
# it reached the riscv64 backend still vector-typed and was refused as a missing
# 128-bit vector feature. the refusal blocked every project using `std` from building
# for riscv64, which is why mach-std had no library-level coverage on that arch.
#
# the point of this case is the riscv64 leg, where the reinterpret goes through
# scalarization; the two capable legs run the same source through native SIMD so a
# fix that changed the VALUE rather than the representation cannot pass unnoticed.
#
# lane values are read with `v[i]`, never through a vector -> array reinterpret:
# that separate form crashes at runtime on both capable legs (reported separately),
# and this case is about the vector -> vector one.
run: exec
targets: linux linux-arm64 linux-riscv64
