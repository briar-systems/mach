# riscv64 only: this case exists to pin one member of the RISC-V ABI family, and the
# other legs have no lp64d to select. its two siblings (2777-riscv-abi-lp64 and
# 2777-riscv-abi-lp64f) hold identical source and an identical golden and differ only
# in the abi their manifest names, so the three together assert that each member
# places these arguments consistently between caller and callee.
targets: linux-riscv64
