# A sub-register-width vector across a CALL BOUNDARY (#2687)
#
# `int/surface/vector-subwidth` proves an `i32x3` keeps its lanes WITHIN a function.
# This proves it keeps them across a call: passed by value, returned by value, and
# placed on the stack once the vector register file is exhausted. Before this work
# none of these compiled at all - the FP move-width classifier accepted the fixed set
# {4, 8, 16} and refused a twelve-byte vector - so `fun addv(a: f32x3, b: f32x3)
# f32x3` was a hard error and vec3 was usable inside one function and nowhere else.
#
# WHY THIS IS AN INT CASE AND NOT A UNIT TEST. The only observable that settles an ABI
# is a value that survived a real call on real hardware. A unit test can assert the
# classifier's answer, and the defect this closes was never in the answer - it was in
# the WIDTH of the move that carries it, three layers down at the encoder.
#
# WHY IT IS NOT IN vector_runtime.mach: that suite is compiled by whichever `mach` runs
# `mach test`, which is the RELEASED compiler, and every released compiler refuses these
# signatures outright. An int case is compiled by the compiler under test.
#
# EVERY CASE CARRIES A NEIGHBOUR GUARD, because the whole risk of a wrong ABI slot
# width is that it lands on the argument next door: `guarded` puts a scalar on each
# side of a register-passed vector, `many` puts one on each side of both stack-passed
# vectors, and the two records put a scalar field next to a vector field. A run that
# read every lane correctly and clobbered the neighbour would look identical on the
# lanes alone.
#
# WHAT FAILS WITHOUT EACH HALF OF THE FIX, measured by reverting each half and
# re-running rather than reasoned from the sources:
#
#   without the width split at the ABI boundary   the case does not COMPILE on any leg
#   without the scratch round trip on the stack   `many` reports 42477 on linux and
#                                                 32477 on linux-arm64, both profiles,
#                                                 against a want of 54477 - the lanes
#                                                 of the two stack-passed vectors that
#                                                 sit past the machine word are lost,
#                                                 and how many survive differs by ISA
#
# linux-riscv64 PASSES ON UNPATCHED dev, both profiles. It declares has_v128 false, so
# these shapes are scalarized and passed by hidden reference, and no part of the fix is
# on that path. The case still belongs on that leg - the lanes are the lanes, and it
# guards the by-reference path against its own regressions - but it is NOT evidence
# that this fix works there, because there is nothing of this fix there to work.
#
# darwin-aarch64 is the leg that matters most for the stack half: Apple's arm64 ABI
# gives a fixed stack argument its NATURAL size, so `v8`'s slot there is exactly twelve
# bytes with `g2` packed against it, and a sixteen-byte write into it - the obvious fix,
# and the one that works everywhere else - destroys the neighbour.
run: exec
