# lane exactness for vectors WIDER than the vector register (#2727)
#
# Every target refused these shapes by name until #2727: `vector_bits` was read as a
# legality gate on the surface when it is a capability fact about realization. The
# refusal was incoherent besides - rv64gc has no vector unit at all, scalarizes every
# vector it is handed, and still refused `f32x8` on the ground of a 128-bit SIMD
# width it does not have.
#
# WHY THIS IS AN INT CASE AND NOT IN vector_runtime.mach. That suite is compiled by
# whichever `mach` runs `mach test`, which is the RELEASED compiler - and every
# released compiler refuses these spellings outright, so the file would not build for
# anyone until the next release. An int case is compiled by the compiler under test,
# which is the only place a just-enabled spelling can be exercised at all.
#
# WHAT EACH LEG PROVES, measured by building this case with a compiler built from
# `dev` before the change rather than reasoned from the target models:
#
#   linux (x86_64)   every shape here is REFUSED AT THE FRONT END without the change
#   linux-arm64      same refusal, same message
#   linux-riscv64    same refusal, same message
#
# So unlike `vector-subwidth` there is no leg where this case passes unfixed: the
# spellings do not resolve. What differs per leg is the REALIZATION being measured -
# x86-64 and aarch64 place an over-width shape in memory beside register-resident
# neighbours, riscv64 places every vector that way and this case rides the path it
# already had. The lanes are the lanes on all three.
run: exec
targets: linux linux-arm64 linux-riscv64
