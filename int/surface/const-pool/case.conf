# the CONSTANT-POOL case (#2248, #2700): which pool entries the module holds, and
# which of them each function references.
#
# the observable is the emitted shape, because the value is not one. a back end
# that reverted to rebuilding every constant from instructions computes exactly the
# right answer while emitting three to seven instructions where two suffice, and an
# interning key that stopped deduplicating emits one entry per USE while every
# loaded value stays correct. the sibling `const-pool-exec` case asserts the values;
# neither replaces the other.
#
# `entries=` is the module-wide dedup fact and each `pool=` is a per-function
# pooling fact, kept apart so neither masks the other. a reference is counted by
# entry NAME, so the number means the same thing on every ISA even though x86-64
# spells one reference with a single relocation and aarch64 / riscv64 spell it with
# a pair.
#
# release only: the counts are a property of the encoder, and a debug build spills
# far more, which changes which registers a constant is materialized into without
# changing whether it is pooled. pinning release keeps the golden about the pool.
#
# the ELF legs only: pooling is a property of the ISA's immediate forms (x86-64 has
# none for SSE, aarch64 has MOVZ/MOVK, riscv64 has LUI/ADDI), not of the OS, so the
# windows and darwin legs would re-assert their linux twins' codegen. they are also
# the legs without a dependable llvm-objdump.
run: const-pool
profiles: release
targets: linux linux-arm64 linux-riscv64
