# build-only: cross-build the os=freestanding, platform=bmos, of=raw x86-64 flat image on the linux leg
# and assert it emitted. BareMetal loads a program at a fixed address and enters
# it with a `call`, so the image is not runnable on a Linux host; what this pins
# is that the bmos entry-at-base contract, the 0xFFFF800000000000 load address,
# and the raw writer still compose and emit end to end.
run: built
targets: linux
build-target: bmos-x86_64
