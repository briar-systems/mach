[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/int"

# a CPU target, deliberately: the whole case is what `shader.math` does on one.
[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = []
need = []

[dep.mach-shader]
git = "https://github.com/briar-systems/mach-shader"
ref = "branch/main"
