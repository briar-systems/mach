# a `#[builtin("...")]` variable declared at a type SPIR-V does not specify for it
# is refused, and the refusal names the required type (#2745).
#
# ONE REFUSAL PER BUILD, which is why this case holds one declaration and not
# eight: the emitter refuses at the first interface variable it cannot declare and
# stops, so a source carrying every wrong shape would still report one error. The
# TABLE is exercised at all eight built-ins in both directions by the
# `mach.lang.target.isa.spirv.emit:builtin_type_table` unit test, which can call it
# directly. What this case adds is the end-to-end evidence that the check is wired
# into `declare_interface` at all, and that the text a reader sees is the text the
# table produces.
#
# the build target is spirv: the requirement is a SPIR-V one and the check lives in
# the SPIR-V emitter, so on any other target this file compiles clean.
run: build-fails
targets: linux
build-target: spirv
