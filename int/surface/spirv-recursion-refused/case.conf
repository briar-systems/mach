# a cycle in the static call graph is refused, naming the chain (#2748).
#
# THIS IS A LIBRARY MODULE ON PURPOSE - no `#[stage(...)]`, so it carries linkage
# exports rather than entry points. `spirv-val` scopes its own cycle rule to entry
# points, so a library module with a cycle validates CLEAN and fails later, in
# whatever consumer links it into a pipeline, far from the source. That is the case
# the validator cannot be the observable for, and so the one this case has to hold.
# `spirv-module` covers the shader-module side by no longer carrying a self-call.
run: build-fails
targets: linux
build-target: spirv
