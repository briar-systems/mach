# where an image handle may and may not be declared (#2794).
#
# The sibling `spirv-sampler-refused` holds the GRAMMAR half: the handle members
# this cut does not emit, refused while a spelling is read. These are the other
# half - a handle that IS emitted, declared somewhere it cannot live. They cannot
# share a build: a module with a name-resolution error never reaches these checks,
# so a single case would report only the first set and the second would be dead
# while appearing covered.
#
# Every one of these is a shape that would otherwise compile into a module that
# fails at a validator, or worse binds a descriptor the author did not mean. A
# handle with no `#[sampler]` reaches no stage; one wearing another interface role
# lands in a storage class no image variable may live in; one behind a pointer or
# inside an array is a shape logical addressing has no form for; one named as a
# local needs storage SPIR-V forbids writing a handle into.
#
# THE REFUSAL MUST NOT BE SATISFIED BY AN UNRELATED REJECTION. The file parses, and
# `albedo` is a handle bound correctly and used, so a rule that refused handles
# generally would show up as a diff rather than as a pass.
#
# THE BUILD TARGET IS THE DEFAULT ONE, not spirv: which target a module is built
# for is not a property of the source, so these refuse on a CPU target too.
run: build-fails
targets: linux
