[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[step.probe]
cmd = "../../lib/cc.sh -c -O1 -fno-stack-protector probe.c -o {project.out}/obj/probe.o"
in = ["probe.c"]
out = ["{project.out}/obj/probe.o"]
need = []

[link.probe]
source = "local"
path = "{project.out}/obj/probe.o"
os = ["*"]
isa = ["*"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe"]
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
