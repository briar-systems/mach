# a `#[uniform(...)]` block whose members mach's own layout places where the SPIR-V
# block layout rules do not allow is refused, naming the member and both offsets
# (#2746).
#
# The refusal, not the module, is the observable. This is the half of the layout
# surface `spirv-interface` and `spirv-storage` cannot show: both declare blocks
# that CONFORM, and a conforming block is emitted identically whether the rules are
# checked or taken on faith. Only a block that does not conform separates the two,
# and before #2746 it was emitted with mach's offsets verbatim and rejected by a
# validator rather than by the compiler.
#
# ONE REFUSAL PER BUILD: the emitter stops at the first block it cannot lay out, so
# this case holds the nested-record violation and its siblings live in the
# `mach.lang.target.isa.spirv.emit` unit tests, which reach the rules directly.
#
# the build target is spirv: the rule is a SPIR-V one and the check lives in the
# SPIR-V emitter, so on any other target this file compiles clean.
run: build-fails
targets: linux
build-target: spirv
