# behavioural case (#2756): drives a real gdb batch session over the `-g` artifact
# and asserts on where it stops, which frame it reports, and what a local reads
# back as - not on the encoding, which int/surface/debuginfo already checks
# structurally. every fact below was read off this file's own program by hand
# before it went into the golden (see src/main.mach's header for the values):
#
#   addone(41)     -> a breakpoint on `val r = v + 1` stops inside `addone`
#                      (a real call in debug, an inlined body in release - #[inline]
#                      forces it at release only, since the debug pipeline runs no
#                      inlining pass) with `v` reading 41, and the caller frame is
#                      `main` at the call's own source line.
#   accumulate(10) -> five iterations into the loop, `total` (0+1+2+3+4) is 10 and
#                      `i` is 4, both register-resident the whole time in both
#                      profiles (no spill), so a live register value is what gets
#                      read back, not a stack slot.
#   deadlocal(4)   -> `unused` is written and never read, so its DIE carries no
#                      DW_AT_location in either profile - "optimized out" is the
#                      correct answer, not a gap to fill in.
#   single-step    -> `step` off the loop body's assignment line lands on the
#                      condition check, then back into the body - source-level
#                      stepping, not a raw instruction count.
#
# THE GOLDEN IS PER-PROFILE (expect.debug.txt / expect.release.txt, see run.sh's
# golden-selection case), not the single expect.txt every other gdb-session-adjacent
# case uses. This case's own facts genuinely differ by profile now (#2779: `accum_i`
# reads `<optimized out>` at release but `4` at debug - adding the #2779 probes below
# changed what opt2 folds `accumulate` into, an incidental but real and hand-verified
# fact, not a bug), and only a debug-profile session runs the #2779 probes at all
# (next paragraph) - a single shared golden cannot hold two different fact sets.
#
# #2779's two probes, debug-profile only:
#
#   accumulate(10) -> a SECOND breakpoint, on accumulate's own `ret total;` line,
#                      proves Bug B fixed: it resolves to that statement's real
#                      address (`total`=45, the loop's actual final sum) rather than
#                      to the function's entry address, where the bug put a spurious
#                      duplicate line-table row and `total` was still uninitialized.
#   dies(41)       -> Bug A's repro: `v` is read once to compute `r`, then genuinely
#                      dies before the function ends. `break` before that line, `v`
#                      reads 41; `next` past it, `v` must now read `<optimized out>`
#                      (a fixed opt0 allocator legitimately reuses `v`'s storage for
#                      `r` - `r` itself keeps reading 42, checked in program_stdout's
#                      own d=42 - the bug was DW_AT_location still describing `v` as
#                      live there instead of bounding it to its true live range).
#   staysalive(41) -> the control, asserted in the SAME session as `dies`, not a
#                      separate case: `v` is read again on its own `ret` line, so it
#                      is genuinely live throughout and must keep reading 41 after
#                      the same `next`. A fix that reported `<optimized out>` for
#                      BOTH functions would pass `dies` alone and is exactly the
#                      regression asserting them together rules out.
#
# neither probe runs at release: both bugs are specific to opt0's own location and
# line-table construction (verified: neither reproduces there), and `dies` /
# `staysalive` auto-inline at opt2 exactly like `addone` does, where a breakpoint's
# `next` steps clean out to the CALLER's frame - a same-frame before/after `v`
# comparison is meaningless once that happens, which is also why `addone` itself
# never carried this probe.
#
# scoped to `linux` only, deliberately: gdb is what this environment has (no lldb),
# and a native x86_64 runner is the one leg this repo can drive it on and read the
# result by hand. linux-arm64 runs gdb NATIVELY in CI (ubuntu-24.04-arm, real
# hardware) and could plausibly carry this same case, but a foreign-arch gdb
# session was never exercised or hand-verified here and this repo's own convention
# (int/run.sh's header) is not to claim a leg on the strength of a leg that passed
# for an unrelated reason - so linux-arm64, linux-riscv64 (qemu-user has no ptrace
# story a host gdb can attach through), windows, and both darwin legs remain
# UNVERIFIED by a real debugger. a missing gdb on the linux leg itself is a hard
# error here, the same contract int/surface/debuginfo already uses for its own
# validators, because every runner this case targets is expected to carry one.
run: gdb-session
targets: linux
