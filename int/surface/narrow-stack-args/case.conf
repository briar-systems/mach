# Fixed arguments that overflow the register file with a tail narrower than eight
# bytes, called against a C object the RUNNER'S own toolchain built, so each callee
# reads its stack arguments where the platform's real ABI puts them rather than where
# mach's model does. This is the case that fails on darwin-aarch64 without #2598:
# Apple's arm64 ABI gives a stack-passed fixed argument its natural size and alignment,
# so a caller applying the AAPCS64 eight-byte slot writes four of the five tail
# arguments into offsets belonging to a different argument - a wrong VALUE, which only
# executing against real clang output can catch.
#
# Runs natively on the two macOS legs (the arm64 one is the divergence, the Intel one
# the SysV control) and on both linux legs (linux-arm64 is the same AAPCS64 vtable
# WITHOUT the divergence, so the two arm64 legs cross-check each other). linux-riscv64
# builds the probe object through int/lib/cc.sh, which cross-compiles it with clang
# when the runner's own `cc` cannot target the leg (mach#2741) - the observable here
# is target-independent (see main.mach), so a cross-built probe object proves it just
# as well as a native one would.
#
# exempt windows: `[step]` now runs there (#2578/#2587 fixed it), but this case has
# not yet been verified against the windows-latest runner's own C toolchain (does it
# expose a bare `cc`, and does it target win64 the way this case needs?). Re-enable
# once that's confirmed rather than guessing at it here.
#
# linux-riscv64 was exempt twice over a float row of `regs=0 0` / `tail=0 0 0` against
# a golden of `regs=10 80` / `tail=95 105 115`, blamed first on a variadic-classifier
# defect (this case declares no variadic argument, so it never was that) and then on a
# linker one. The actual cause was mach#2797: this probe's `* 10.0` constant is the one
# thing here clang loads through a pc-relative pair, and mach resolved the low half of
# such a pair without ever reading the target off its paired `auipc`. Reading a scale
# of 0.0 makes every product exactly 0, which is why the row was zeros rather than
# noise.
#
# It passed on one developer host and failed in CI, and the reason is worth stating so
# nobody re-derives the wrong lesson: the newer clang builds `10.0` with `lui`+`slli`
# and emits no relocation at all, so there is no pair to get wrong. clang 18 pools the
# constant and gets one. That is a difference in the SHAPE this probe compiles to, not
# a difference in which toolchains the defect affects - it affects every pc-relative
# pair a foreign object contains. int/surface/riscv-pcrel-pair builds the shape on
# purpose so the coverage does not depend on what a probe written for something else
# happens to emit.
#
# The case is unexempt and runs on the leg; it needs both mach#2797's pairing fix and
# cc.sh's `-mabi=lp64d` pin (mach#2771), because a soft-float probe object produces the
# identical row for a completely different reason.
#
# WHAT THIS CASE DOES NOT COVER, on the pc-relative pair specifically. It does fail
# pre-fix and it is a real end-to-end guard, but its probe reaches exactly ONE pooled
# constant, and under clang 18 that constant is `.LCPI1_0` at section offset 0, with a
# zero addend on the high half, four bytes from its low half, through the `_I` spelling
# only. That is the identity value on every axis a pairing can get wrong at once, so
# passing here proves the label chase happens and nothing about what the chase carries:
# a fix that dropped the symbol's offset, or dropped the high half's addend, or still
# assumed a four-byte gap, or handled `_I` and not `_S`, passes this case unchanged.
# int/surface/riscv-pcrel-pair is the case built non-trivial on each of those axes
# simultaneously, and its header states them individually. Treat the two as one guard:
# this one for the end-to-end value, that one for the pairing's actual coverage.
# int/observability.md generalizes the trap - offset zero validates any scheme that
# drops the offset, because adding nothing is indistinguishable from adding correctly.
#
# The ABI half of what this case covers is NOT degenerate and is the reason it exists:
# the darwin-aarch64 stack-argument divergence (mach#2598) needs a tail narrower than
# eight bytes called against the runner's own toolchain, which is what the probe is.
run: exec
exempt: windows
