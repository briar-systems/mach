# an import whose loader-facing name still carries PE's `__imp_` import-address
# prefix must be refused at link time (#2527). before the guard this linked clean
# and emitted `kernel32.dll:__imp_Sleep`, an import no library exports, so the
# image failed only at load with a missing entry point - CI never saw it.
# cross-build the win64 PE on the linux leg and capture the link diagnostic.
run: build-fails
targets: linux
build-target: windows
