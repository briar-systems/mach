# .symtab on a static-PIE executable (#2807): the same fixture and the same
# facts int/surface/symtab already established for a fixed-address static
# executable, built `--pie` instead. #2807 found that a PIE binary carried NO
# section headers at all (readelf -h reported 0) - PIE is the default for
# ordinary distribution on most modern targets, so a user shipping the normal
# way got none of #2772's benefit. build-flags supplies `--pie`; the producer
# (produce_symtab) and golden are otherwise identical to int/surface/symtab,
# since the facts under test - a real .symtab/.strtab pair, nm finding both
# functions defined, addr2line resolving an address mid-function (not just
# the entry point), and the table sitting strictly after every PT_LOAD's
# file extent - hold identically once the format carries the table at all.
#
# runs on every ELF leg (linux, linux-arm64, linux-riscv64): the facts hold
# identically on every ISA, so the golden is shared.
run: symtab
targets: linux linux-arm64 linux-riscv64
build-flags: --pie
