# the same os=freestanding, of=raw flat image as the `freestanding` case, but the
# exit status is read out of an `#[embed]`ed file rather than computed: it proves
# embedded bytes land in the flat image and are addressable with no loader, no
# section table, and no runtime (#2507).
run: flat-loader
targets: linux
build-target: freestanding-x86_64
