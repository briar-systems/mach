# Is an atomic on a `#[packed]` field refused, and refused by the ADDRESS-OF rule
# rather than by a rule of its own (#2715)?
#
# Atomics are not a language surface in mach: `std.sync.atomic` is a set of ordinary
# functions over `*i64` implemented in inline asm, so the ONLY way an atomic reaches
# a record field is a pointer to that field. `#[packed]` already refuses to hand one
# out, so the atomic refusal falls out of it and there is one rule here rather than
# two.
#
# That is a COUPLING, and it is invisible in the compiler source: nothing in
# `infer_unary` mentions atomics and nothing in mach-std mentions packing. If atomics
# ever become an intrinsic that takes an lvalue instead of a pointer, this case is
# what fails, and it fails saying exactly which assumption expired. Pinning it needs
# real mach-std, which is why it is here rather than in the unit suite.
#
# One leg is enough: the refusal is a sema decision, taken before any target-specific
# lowering, so every target reports the same text.
run: build-fails
targets: linux
