# vector shapes whose LANE COUNT exceeds what a Shader module's OpTypeVector holds,
# through the spirv back half and validated host-side by spirv-val (#2749).
#
# the sibling spirv-vector and spirv-vector-narrow cases both stay at or under four
# components, which is exactly the gap this fills: the emitter refused `i8x16` /
# `u8x16` / `i16x8` / `u16x8` BY NAME, and no case could observe that because the
# refusal was the only thing those shapes ever produced.
#
# nothing executes: a SPIR-V module is a GPU artifact, so the leg needs the Khronos
# validator, not a runner.
run: spirv-val
targets: linux
build-target: spirv
