[project]
id = "windows-step-shell"
version = "1.0.0"
src = "src"
out = "out"

[target.windows]
isa = "x86_64"
os = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.windows-step-shell]
kind = "bin"
entry = "main.mach"
out = "bin/windows-step-shell.exe"
targets = ["*"]
link = []
need = ["plain", "quoted"]

# cmd.exe syntax deliberately: this case exists to prove the windows step shell
# is spawned at all, so it must be the shell that runs the command.
[step.plain]
cmd = "copy assets\\seed.txt out\\gen\\plain.txt"
in = ["assets/seed.txt"]
out = ["out/gen/plain.txt"]
need = []

# the two shapes that actually break: an argument quoted because its path
# contains a space. the CRT argv convention escapes the embedded quotes as \" ,
# which cmd.exe takes literally, so this step fails unless the interpreter's own
# quoting rules are honoured (#2587).
[step.quoted]
cmd = "copy \"assets\\seed with space.txt\" \"out\\gen\\quoted out.txt\""
in = ["assets/seed with space.txt"]
out = ["out/gen/quoted out.txt"]
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/feat/spawn-cwd-and-path"
