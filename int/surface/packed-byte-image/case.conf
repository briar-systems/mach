# Whether a `#[packed]` record (#2715) describes the byte layout it claims to.
#
# The golden is a BYTE IMAGE, not a set of layout intrinsics. `$size_of` and
# `$offset_of` are answers the compiler computes, so pinning only those proves it
# agrees with itself; the bytes are what a C struct, a file header or a wire frame is
# actually compared against, and they are what `#[packed]` exists to control.
#
# One image spans both padding walks: `walk` computes size and `field_offset_of`
# computes offsets, independently, and a wrong offset moves a byte while a wrong size
# changes the row's length. A test reading only one of them passes with the other
# broken.
#
# It runs on every leg, including the NATIVE linux-arm64 row (int/targets.conf),
# which is where its value is: the unpacked fields are read and written through
# ordinary field access at offsets no type guarantees, so a target that cannot do
# that prints wrong bytes here rather than passing.
run: exec
