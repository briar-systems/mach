# `--emit-asm` must name the symbol an inline-asm statement actually references
# (#2788, epic #2288).
#
# `--emit-asm` is what someone reaches for when debugging inline asm, which is exactly
# the code where reading the source and assuming the obvious is not available. On
# x86-64 it named a DIFFERENT, REAL symbol from the same module for every `[symbol]`
# memory operand and printed a bare `call` with no operand at all - a plausible wrong
# name gives a reader no signal that the output is untrustworthy.
#
# The observable pairs what the printer says with what the OBJECT relocates against at
# the same site, in file order, so a printer that names the wrong real symbol fails
# here and not merely one that names nothing. The three ELF legs are all covered
# because the printers are separate per ISA and a fix in one says nothing about the
# others - two of the three were already correct, and that is exactly what needs
# pinning.
#
# debug only: the observable is the hand-written asm body, which no optimisation
# level touches, so a release leg would re-assert the same text.
run: asm-symbol
profiles: debug
targets: linux linux-arm64 linux-riscv64
build-flags: --emit-asm
