[project]
id = "case"
version = "0.0.0"
src = "src"
# a fixed out root, not the usual {target.name}/{profile.name} template: the
# asm-symbol producer reads both the emitted `.s` text and the per-module objects
# this build leaves behind, so their paths must be the same on every leg. run.sh
# wipes out/int before and after each build, so one target's output can never be
# read on another's run.
out = "out/int/build"

[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = []
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
