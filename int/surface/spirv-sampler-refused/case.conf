# the image-handle members this cut does NOT emit, refused BY NAME (#2794).
#
# "Out of scope" has to mean named and refused, not silently miscompiled and not
# half-supported. Depth-comparison sampling is the member the issue puts out of
# scope explicitly, and a `sampler2dshadow` emitted as an ordinary image would
# compile, validate, and compare nothing at run time - which is the failure this
# case exists to make impossible.
#
# THE REFUSAL MUST NOT BE SATISFIED BY AN UNRELATED REJECTION, which is the trap a
# build-fails case falls into: a file that fails to parse, or that names an
# undeclared identifier, also "fails to build". So the source here is a shader that
# COMPILES apart from these declarations - the same shader `spirv-sampled-image`
# builds, minus the sampling - and every line the harness records is a sentence
# about a handle member. An unresolved name or a parse error would be a diff.
#
# THE BUILD TARGET IS THE DEFAULT ONE, not spirv, and that is the second half of
# the assertion: which target a module is built for is not a property of the source,
# so a handle spelling refuses on a CPU target too. A case built for spirv could not
# tell a front-end rule from a back-end one.
run: build-fails
targets: linux
