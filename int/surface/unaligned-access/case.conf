# Whether an unaligned scalar access is correct on REAL hardware, which is the
# question #[packed] (#2715) turns on and the one an emulator cannot answer.
#
# linux-arm64 is the row that matters: it runs natively on ubuntu-24.04-arm
# (int/targets.conf), not under qemu. aarch64 tolerates unaligned scalar loads
# but not every atomic or vector form, so the scalar answer has to be measured
# rather than assumed from "aarch64 is fine with unaligned".
#
# linux-riscv64 runs under qemu-user and is kept deliberately: unaligned access
# on RV64 is permitted-but-may-trap, and Linux emulates a trapping one in the
# kernel. A pass there means the access is CORRECT, not that it is usable, and
# the case comment says so. Do not read three green legs as three proofs.
run: exec
