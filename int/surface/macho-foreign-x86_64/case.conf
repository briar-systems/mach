# cross-build a darwin-x86_64 binary that links a normally-compiled clang object
# (debug info and unwind tables intact) on the cheap linux leg. both halves of
# #2521 remain load-bearing: section-based relocations must parse and `ext fun`
# must bind `_mad_device_open`. the same object carries SIGNED_1/_2/_4; the
# producer resolves their linked fields and compares each with an independent
# initialized-data marker, proving the exact targets without a darwin runner.
run: macho-signed
targets: linux
build-target: darwin-x86_64
