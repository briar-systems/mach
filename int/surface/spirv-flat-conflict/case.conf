# one integer `#[input(...)]` read by both a vertex stage and a fragment stage is
# refused, because no SPIR-V module satisfies both (#2747).
#
# Vulkan REQUIRES Flat on a fragment stage's integer input and FORBIDS it on a
# vertex stage's, so a module-scope variable standing for both has no valid
# decoration. The refusal is the only correct answer and it has to be a compile
# error: decorating for either stage emits a module the other one makes invalid.
run: build-fails
targets: linux
build-target: spirv
