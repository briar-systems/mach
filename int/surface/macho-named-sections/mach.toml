[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[link.probe-a]
source = "local"
path = "probe-a.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[link.probe-b]
source = "local"
path = "probe-b.o"
os = ["darwin"]
isa = ["x86_64"]
abi = ["*"]
export = false

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["probe-a", "probe-b"]
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
