# a linked darwin image keeps the (segment, section) identity of its inputs, so a
# runtime that finds content by name finds it: libobjc scans __DATA,__objc_classlist
# and reads __DATA,__objc_imageinfo, and dyld runs __DATA,__mod_init_func (#2606).
#
# two clang objects each contribute to __objc_classlist, so the case also pins that
# same-named inputs are CONCATENATED into one contiguous, pointer-aligned run rather
# than emitted as two sections sharing a name.
#
# the section structure is read host-side on the cheap linux leg; the macOS leg
# builds the same image and additionally RUNS it, which is the only way to see
# whether dyld actually called the initializer - losing __mod_init_func fails
# silently, unlike losing an objc section.
run: macho-sections
targets: linux darwin-x86_64
build-target: darwin-x86_64
build-flags: --pie
