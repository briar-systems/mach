# the widest signatures the SPIR-V target accepts emit a valid OpTypeFunction
# (#2748).
#
# The universal environment is the right one here: `Id is 0` is a structural fault
# the base validator catches, and the module declares no Vulkan interface at all. A
# 15- or 16-parameter signature used to build clean and emit `OpFunction` naming
# type id 0 - the reserved never-valid id - because `emit_function` refused above 16
# while `type_fn`'s fixed operand buffer failed above 14 and returned a 0 the caller
# never read.
run: spirv-val
targets: linux
build-target: spirv
