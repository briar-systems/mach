[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = ["alias", "alias-two", "provider"]
need = []

[link.alias]
source = "local"
path = "{project.out}/obj/foreign/alias.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.alias-two]
source = "local"
path = "{project.out}/obj/foreign/alias-two.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[link.provider]
source = "local"
path = "{project.out}/obj/foreign/provider.o"
os = ["windows"]
isa = ["*"]
abi = ["*"]
export = false

[step.foreign]
cmd = "sh decode-fixture.sh {project.out}/obj/foreign"
in = ["decode-fixture.sh", "alias.c", "alias-two.c", "provider.c", "alias.o.b64", "alias-two.o.b64", "provider.o.b64"]
out = ["{project.out}/obj/foreign/alias.o", "{project.out}/obj/foreign/alias-two.o", "{project.out}/obj/foreign/provider.o"]
need = []
