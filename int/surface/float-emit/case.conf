# the scalar-float EMISSION case (#2237): each function below carries the number of
# emitted instructions that name the back end's reserved FP scratch registers, read
# out of the disassembled objects. an encoder that stages an already-allocated float
# operand through scratch — which is what x86-64 did for every operand of every
# scalar float op before #2237 — raises the count and fails here.
#
# release only: the counts are a property of the encoder, but a debug build spills
# far more aggressively, and a spilled operand legitimately reaches scratch. pinning
# release keeps the golden a statement about the encoder rather than about the
# allocator's pressure.
#
# the ELF legs only: the verdict is a property of the ISA (x86_64 SSE, aarch64 NEON /
# scalar FP, riscv64 F/D), not of the OS, so the windows and darwin legs would
# re-assert their linux twins' codegen. they are also the legs without a dependable
# llvm-objdump.
# WHY `main` AND `widen` MOVED ON x86-64 (#2248, #2700). the constant pool did not
# change what reaches the FP scratch; it removed the reason a constant went there.
# a float immediate used to be staged as `movabs r11 ; movq xmm15, r11` and then
# operated on, so every use named the scratch twice. a pooled constant is a memory
# operand the SSE operation reads directly - `mulsd xmm1, [rip + .Lconst.2]` - so it
# names no register at all.
#
#   widen  2 -> 0: its `d + 1.0` folds the constant into the ADDSD.
#   main   6 -> 2: its two `* 4.0` uses fold the same way (4 of the 6). the
#                  remaining 2 are one f32 literal, which reaches the back end as an
#                  f64 pattern plus an explicit CVTSD2SS - and CVTSD2SS has no
#                  memory-source form here, so its operand is loaded into the
#                  scratch first. that pair is the narrowing convert, not staging.
#
# aarch64 and riscv64 do not move: every constant in this case (0.0, 1.0, 4.0) is one
# the per-target cost rule declines to pool, because one MOVZ / one LUI-class word
# plus the bank move already beats a load. that is the rule working, not the pool
# failing to reach them - `surface/const-pool` is where they do move.
#
# WHY `main` MOVED AGAIN ON EVERY TARGET (#2752). the residual pair the paragraph
# above names is exactly `saxpy(1.5::f32, 64)`, the case's one f32 literal, and it
# is now folded into an f32 constant in the middle end rather than narrowed at the
# use site. the narrowing convert and its operand load are both gone, so the pair
# that was never staging goes with them.
#
#   main   2 -> 0 on x86-64: the CVTSD2SS and the scratch load feeding it.
#   main   6 -> 4 on aarch64 and riscv64: the same two, spelled as a constant
#          materialization into the FP scratch plus the FCVT that read it. the 4
#          that remain are the two `* 4.0` f64 uses, each an FMOV of a MOVZ-built
#          pattern into the scratch and an FMUL reading it there - the cost rule
#          declining to pool them, unchanged.
run: float-emit
profiles: release
targets: linux linux-arm64 linux-riscv64
