# the scalar-float EMISSION case (#2237): each function below carries the number of
# emitted instructions that name the back end's reserved FP scratch registers, read
# out of the disassembled objects. an encoder that stages an already-allocated float
# operand through scratch — which is what x86-64 did for every operand of every
# scalar float op before #2237 — raises the count and fails here.
#
# release only: the counts are a property of the encoder, but a debug build spills
# far more aggressively, and a spilled operand legitimately reaches scratch. pinning
# release keeps the golden a statement about the encoder rather than about the
# allocator's pressure.
#
# the ELF legs only: the verdict is a property of the ISA (x86_64 SSE, aarch64 NEON /
# scalar FP, riscv64 F/D), not of the OS, so the windows and darwin legs would
# re-assert their linux twins' codegen. they are also the legs without a dependable
# llvm-objdump.
run: float-emit
profiles: release
targets: linux linux-arm64 linux-riscv64
