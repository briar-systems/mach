[project]
id = "case"
version = "0.0.0"
src = "src"
out = "out/int"

# a CPU target, deliberately. `#[spirv_op]` is inert here - nothing on this target
# reads it - and the point of the case is that its value sets are still closed.
[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[profile.debug]
opt = 0
debug = false
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.case]
kind = "bin"
entry = "main.mach"
out = "bin/case"
targets = ["*"]
link = []
need = []
