# two interface variables whose Location spans overlap within one stage are refused,
# naming both and how many locations each takes (#2747).
#
# The author writes the numbers, so the collision is arguably their error - but mach
# knows each variable's type and so knows its span, and a located compile error is
# strictly better than a validator message naming an `OpEntryPoint` operand index.
# Before #2747 the Location was emitted verbatim and never checked against anything.
run: build-fails
targets: linux
build-target: spirv
