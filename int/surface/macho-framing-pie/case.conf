# the PIE (LC_MAIN) darwin x86_64 layout's framing, the reference the non-PIE twin
# macho-framing-static must match on the framing (#2599): the __PAGEZERO span,
# __TEXT's base, and a section command on every mapped segment. cross-built on the
# linux leg and read host-side.
#
# both images are dyld-loaded - see the twin's comment, which used to claim this
# one was and the other was not. what separates them is the rebase stream, and so
# __DATA_CONST, and the entry command.
run: macho-framing
targets: linux
build-target: darwin-x86_64
build-flags: --pie
