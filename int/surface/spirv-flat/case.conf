# a fragment stage's integer and 64-bit inputs carry the Flat decoration Vulkan
# requires, validated host-side against the VULKAN environment (#2747).
#
# THE ENVIRONMENT IS THE WHOLE CASE. `Flat` is a Vulkan interface rule and the
# universal environment does not apply it, so a `spirv-val` leg with no target-env
# reports this module clean whether the decoration is there or not. Before #2747
# the emitter declared no Flat decoration at all and every module of this shape was
# one a Vulkan consumer rejected, with no diagnostic from mach.
run: spirv-val-vulkan
targets: linux
build-target: spirv
