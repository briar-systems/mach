# how a vector LANE is reached (#2236). every function below is recorded as
# `lane=<0|1> vecmem=<0|1>`, read out of the disassembled objects: whether a scalar
# left or entered a vector register directly, and whether a whole 128-bit vector went
# to memory. before #2236 the only way to name a lane was the vector's memory image,
# so aarch64 read `lane=0 vecmem=1` on every one of these and paid a
# store-to-load forwarding stall per lane.
#
# the observable execution cannot produce: a lane access that round-trips through the
# stack computes exactly the right answer, so the sibling `vectors` case stays green
# whether or not lane selection fires. only the emitted form tells them apart.
#
# release only: the shape is the back end's, and a debug leg would re-assert the same
# selection through a noisier frame.
#
# the ELF legs only: the verdict is a property of the ISA (aarch64 UMOV / INS,
# x86_64 with no lane form selected yet, riscv64 with no vector unit at all), not of
# the OS, so the windows and darwin legs would re-assert their linux twins' codegen.
# they are also the legs without a dependable llvm-objdump.
run: vector-lanes
profiles: release
targets: linux linux-arm64 linux-riscv64
