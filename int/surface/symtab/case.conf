# function-symbol-table case (#2772): asserts, on the artifact this case's plain
# build already produces (no `-g`, no special flag - the shape a shipped release
# binary actually has), that a real `.symtab`/`.strtab` pair exists and a real
# consumer reads correct facts out of it:
#
#   - `readelf` sees a `.symtab` section of type SYMTAB with a paired `.strtab`
#   - `nm` finds `main` and `burn`'s mangled names as defined (`T`) symbols
#   - `addr2line -f` resolves an address WELL INSIDE `burn`'s body (not just its
#     entry point) back to `burn` - the fact that actually matters for a
#     profiler, and the one a symbol table with entries but no real `st_size`
#     would fail even though `nm` alone would look fine
#   - `.symtab`/`.strtab` sit strictly after every PT_LOAD segment's file extent
#     (`readelf -lW`), proving the loadable image byte-additivity int/surface/
#     debuginfo already established for DWARF holds for the symbol table too -
#     a release binary's runtime behavior is unchanged by carrying one
#
# runs on every ELF leg (linux, linux-arm64, linux-riscv64): the facts hold
# identically on every ISA, so the golden is shared.
run: symtab
targets: linux linux-arm64 linux-riscv64
