# Whether an unaligned VECTOR access is correct on REAL hardware, which is the half
# of the `#[packed]` question (#2715) that `unaligned-access` does not answer and
# #2728 is about.
#
# WHICH LEGS ARE EVIDENCE. The native rows are (int/targets.conf): linux,
# linux-arm64, windows, darwin-aarch64, darwin-x86_64. linux-arm64 is the row that
# matters most and the reason this case exists at all - aarch64 has 128-bit load and
# store forms with alignment requirements, and it runs natively on ubuntu-24.04-arm.
# darwin-aarch64 is a second native aarch64 data point at main cadence.
#
# linux-riscv64 is NOT evidence, twice over. It runs under qemu-user, which lowers a
# guest load to a host load and lets the host do the unaligned access in hardware, so
# it cannot report what silicon does (#1885 is the standing incident). And riscv64
# declares has_v128 false, so every vector here goes through the scalarizer and the
# access being measured is not a vector access at all. The leg is kept because the
# lanes are still the lanes and the scalarized path deserves its own guard, but a
# green row there must never be quoted as an answer to this question.
#
# Verified to be measuring a vector access rather than a scalar expansion, by
# disassembling the built artifact: x86_64 emits `movups` and no `movaps`, aarch64
# emits `str q` / `ldr q` against the computed misaligned address.
run: exec
