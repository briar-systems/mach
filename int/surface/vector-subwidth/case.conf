# lane exactness for vectors NARROWER than the vector register (#2697)
#
# A sub-register-width vector is the first value whose register width and memory
# footprint differ - `i32x3` rides a 16-byte register and occupies 12 bytes - and
# before the fix `op_width_of` answered one number for both. The whole-vector move
# fell back to the GP word and dropped everything above the eighth byte.
#
# WHY THIS IS AN INT CASE AND NOT IN vector_runtime.mach. That suite is compiled by
# whichever `mach` runs `mach test`, which is the RELEASED compiler - and every
# released compiler still refuses these shapes, since the refusal this work deletes
# is what shipped. Putting `i32x3` there breaks the build for everyone until the
# next release. An int case is compiled by the compiler under test, which is the
# only place a just-enabled language feature can be exercised.
#
# WHICH TARGET THIS CASE ACTUALLY PROVES ANYTHING ABOUT, measured by reverting the
# width split and re-running rather than reasoned from the target models:
#
#   linux (x86_64)   0 of 2 profiles pass without the fix  -> the fix is load-bearing
#   linux-arm64      0 of 2 profiles pass without the fix  -> the fix is load-bearing
#   linux-riscv64    2 of 2 profiles pass without the fix  -> never reaches the fix
#
# riscv64 declares has_v128 false, so these shapes go through the scalarizer and the
# register/memory width split is never consulted. The case still belongs on that leg
# - the lanes are the lanes, and it guards the scalarized path against its own
# regressions - but it is NOT evidence that this fix works there, because there is
# nothing of this fix on that path to work.
run: exec
targets: linux linux-arm64 linux-riscv64
