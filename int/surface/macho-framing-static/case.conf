# the non-PIE (LC_UNIXTHREAD) darwin x86_64 layout's framing: __PAGEZERO spans the
# whole low 4 GiB, __TEXT is based at DARWIN_BASE_ADDR with the mach header inside
# its first page, and every load segment carries its section commands (#2599).
# cross-built on the linux leg and read host-side; no darwin runner is needed for
# the framing, only for execution.
#
# its --pie twin is macho-framing-pie. the two goldens must agree on the framing -
# the __PAGEZERO span, __TEXT's base, and a section command on every mapped segment.
# they differ in the entry command, and in that only the PIE image has a
# __DATA_CONST: that segment IS dyld's rebased-then-read-only mapping, and an image
# fixed at one address needs no rebase stream, so its read-only content stays
# __RODATA. read, not assumed: this image's LC_DYLD_INFO carries a zero-length
# rebase stream and its twin's carries eight bytes.
#
# THE NAME IS A MISNOMER AND THIS IMAGE IS NOT STATIC. the comment here used to say
# the LC_UNIXTHREAD layout is loaded by the kernel with dyld uninvolved. that held
# only while the program happened to import nothing: before mach-std routed
# darwin's clocks, filesystem and threads through libSystem, this image was
# MH_NOUNDEFS and carried no LC_LOAD_DYLINKER at all. it now carries
# LC_LOAD_DYLINKER /usr/lib/dyld, LC_LOAD_DYLIB /usr/lib/libSystem.B.dylib,
# LC_DYLD_INFO with 597 bytes of bind opcodes over 29 undefined symbols, one
# eight-byte __got slot each, and MH_DYLDLINK - the same machinery its PIE twin
# carries. --pie has never selected whether dyld runs. the import list does, and
# the __STUBS and __GOT segments below are what a real import list looks like.
#
# NOTE WHAT THIS OBSERVABLE CANNOT SEE. the producer reports segments, sections and
# the entry command, so the dyld-versus-no-dyld property the old comment asserted
# was never once checked by this case. pinning it needs the producer to report the
# load command set.
run: macho-framing
targets: linux
build-target: darwin-x86_64
