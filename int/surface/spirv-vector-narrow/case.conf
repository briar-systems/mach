# SUB-REGISTER-WIDTH vector work through the spirv back half, validated host-side
# by spirv-val. the sibling spirv-vector case is 128-bit shapes only by
# construction, and that is exactly the gap #2743 lived in: the MIR lane
# descriptor derived its lane count as `16 / element-bytes`, which is right for
# every 128-bit shape and wrong for every other one, so a whole suite of green
# 128-bit cases said nothing about `f32x3`.
#
# nothing executes: a SPIR-V module is a GPU artifact, so the leg needs the
# Khronos validator, not a runner.
run: spirv-val
targets: linux
build-target: spirv
