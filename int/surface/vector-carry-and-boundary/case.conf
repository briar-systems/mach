# adversarial vector-correctness sweep (see src/main.mach's header for the full
# rationale and the exact axes covered). every value is hand-computed and
# checked lane by lane; only `mul_loop3` is a real regression pin against
# #2749 (x86-64 only - see the file header for why the other two ELF ISAs
# don't reproduce it even pre-fix), every other probe is coverage of a
# combination nothing else in the suite reaches, not a known-bug pin.
#
# runs on all three ELF ISAs at both profiles, same as vector-subwidth and the
# #2749 regression this extends. no darwin/windows legs: nothing here is
# platform-specific, this simply hasn't been verified there yet - extend rather
# than assume when one of those legs is in reach.
run: exec
targets: linux linux-arm64 linux-riscv64
